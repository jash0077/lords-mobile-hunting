<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile - Guild Leaderboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css"> <!-- Link to existing style.css for theme -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }
        .back-btn {
            padding: 10px 20px;
            background: #334155;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .back-btn:hover { background: #475569; }

        .player-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .player-header h2 {
            font-size: 2.5em;
            color: #2563eb;
            margin-bottom: 10px;
        }
        .player-header .rank-badge {
            font-size: 1.2em;
            padding: 6px 12px;
        }

        .stat-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .stat-card i {
            font-size: 2.5em;
            color: #2563eb;
            margin-bottom: 10px;
        }
        .stat-card h3 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        .stat-card p {
            color: #94a3b8;
            font-size: 0.9em;
        }

        .section-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .section-box h2 {
            font-size: 1.8em;
            color: #e2e8f0;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .quota-progress {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }
        .progress-bar-container {
            flex-grow: 1;
            height: 20px;
            background-color: #334155;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background-color: #10b981; /* Green for met quota */
            width: 0%;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }
        .quota-text {
            font-weight: bold;
            color: #e2e8f0;
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
            margin-top: 20px;
        }

        .rank-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            color: #0f172a;
        }
        .rank-badge.r5 { background: #fbbf24; }
        .rank-badge.r4 { background: #f97316; }
        .rank-badge.r3 { background: #ef4444; }
        .rank-badge.r2 { background: #8b5cf6; }
        .rank-badge.r1 { background: #06b6d4; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-user-circle"></i> Player Profile</h1>
            <a href="members.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Members</a>
        </header>

        <div class="player-header">
            <h2 id="playerName"></h2>
            <span id="playerRankBadge" class="rank-badge"></span>
        </div>

        <div class="stat-cards-grid">
            <div class="stat-card">
                <i class="fas fa-chess-rook"></i>
                <h3>Current Might</h3>
                <p id="currentMight">Loading...</p>
                <p id="mightChange"></p>
            </div>
            <div class="stat-card">
                <i class="fas fa-swords"></i>
                <h3>Current Kills</h3>
                <p id="currentKills">Loading...</p>
                <p id="killsChange"></p>
            </div>
        </div>

        <div class="section-box">
            <h2>Monthly Kill Quota</h2>
            <div class="quota-progress">
                <div class="progress-bar-container">
                    <div class="progress-bar" id="killQuotaProgressBar"></div>
                </div>
                <span class="quota-text" id="killQuotaText">Loading...</span>
            </div>
        </div>

        <div class="section-box">
            <h2>LAST 30 DAYS</h2>
            <div class="chart-container">
                <canvas id="powerProgressChart"></canvas>
            </div>
        </div>

        <div class="section-box">
            <h2>ALL HISTORY — 52 WEEKS</h2>
            <div class="chart-container">
                <canvas id="killsHistoryChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const playerName = urlParams.get("name");
        let allPlayers = [];
        const SHEET_ID = '1PGJ-Ad74mpx-v3RbqHku2310jiCCyYcb85eC1G3d8wM';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

        function parseCSV(csv) {
            const lines = csv.split('\n').filter(l => l.trim());
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.replace(/\"/g, '').trim());
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].match(/(\"[^\"]*\"|[^,]*)/g) || [];
                const obj = {};
                headers.forEach((h, idx) => {
                    obj[h] = (values[idx] || '').replace(/\"/g, '').trim();
                });
                // Map Google Sheet columns to expected keys
                const mapped = {
                    NAME: obj['Player'] || obj['NAME'] || '',
                    MIGHT: obj['Might'] || obj['MIGHT'] || '',
                    PLAYER_KILL: obj['Player Kill'] || obj['PLAYER_KILL'] || '',
                    KILL: obj['Kills INCREASE '] || obj['KILL'] || '',
                    'MIGHT GAIN': obj['MightGain'] || obj['MIGHT GAIN'] || '',
                    'MIGHT LOSS': obj['MightLoss'] || obj['MIGHT LOSS'] || '',
                    RANK: obj['RANK'] || '',
                    MONTH: obj['Date'] || obj['MONTH'] || '',
                    'GUILD FEST': obj['GUILD FEST'] || ''
                };
                if (mapped.NAME) data.push(mapped);
            }
            return data;
        }

        async function loadPlayerData() {
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                allPlayers = parseCSV(csvText);
                const player = allPlayers.find(p => p.NAME === playerName);

                if (player) {
                    document.getElementById("playerName").textContent = player.NAME;
                    document.getElementById("playerRankBadge").textContent = `R${player.RANK || '1'}`;
                    document.getElementById("playerRankBadge").className = `rank-badge r${player.RANK || '1'}`;
                    document.getElementById("currentMight").textContent = player.MIGHT || "N/A";
                    document.getElementById("currentKills").textContent = player.PLAYER_KILL || "N/A";

                    // Placeholder for change data (needs historical data)
                    document.getElementById("mightChange").textContent = "+0 • Last 30 Days";
                    document.getElementById("killsChange").textContent = "+0 • Last 30 Days";

                    // Monthly Kill Quota (example logic)
                    const monthlyQuota = 100000000; // Example: 100M kills quota
                    const currentMonthKills = parseValue(player.KILL); // Using current kills as a proxy for this month
                    const quotaPercentage = Math.min((currentMonthKills / monthlyQuota) * 100, 100);
                    document.getElementById("killQuotaProgressBar").style.width = `${quotaPercentage}%`;
                    if (currentMonthKills >= monthlyQuota) {
                        document.getElementById("killQuotaText").textContent = "QUOTA MET";
                    } else {
                        document.getElementById("killQuotaText").textContent = `${formatValue(currentMonthKills)} / ${formatValue(monthlyQuota)} kills this month (${quotaPercentage.toFixed(1)}%)`;
                    }

                    renderCharts();
                } else {
                    document.getElementById("playerName").textContent = "Player Not Found";
                }
            } catch (error) {
                console.error("Error loading player data:", error);
                document.getElementById("playerName").textContent = "Error loading data";
            }
        }

        function renderCharts() {
            // Placeholder data for charts
            const labels = ['Week 1', 'Week 2', 'Week 3', 'Week 4'];
            const powerData = [1.5, 1.6, 1.7, 1.8]; // Example in Billions
            const killsData = [0.5, 0.6, 0.7, 0.8]; // Example in Billions

            new Chart(document.getElementById("powerProgressChart"), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Power Progress (B)',
                        data: powerData,
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.2)',
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#334155' },
                            ticks: { color: '#e2e8f0' }
                        },
                        x: {
                            grid: { color: '#334155' },
                            ticks: { color: '#e2e8f0' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });

            new Chart(document.getElementById("killsHistoryChart"), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Kills History (B)',
                        data: killsData,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.2)',
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#334155' },
                            ticks: { color: '#e2e8f0' }
                        },
                        x: {
                            grid: { color: '#334155' },
                            ticks: { color: '#e2e8f0' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function parseValue(value) {
            if (!value) return 0;
            value = value.toUpperCase().replace(/,/g, '');
            if (value.endsWith('B')) return parseFloat(value) * 1000000000;
            if (value.endsWith('M')) return parseFloat(value) * 1000000;
            if (value.endsWith('K')) return parseFloat(value) * 1000;
            return parseFloat(value);
        }

        function formatValue(num) {
            if (num >= 1000000000) return (num / 1000000000).toFixed(1) + 'B';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        loadPlayerData();
    </script>
</body>
</html>
