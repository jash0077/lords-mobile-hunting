<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile | Lords Mobile Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0b0b0f;
            --bg-card: #13131a;
            --bg-elevated: #1c1c24;
            --text-primary: #f3f4f6;
            --text-secondary: #94949e;
            --accent-blue: #4d94ff;
            --accent-purple: #bc8cff;
            --accent-green: #3fb950;
            --border: rgba(255, 255, 255, 0.06);
        }
        body { background: var(--bg-dark); color: var(--text-primary); padding: 20px; font-family: 'Inter', sans-serif; }
        .container { max-width: 800px; margin: 0 auto; }
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .profile-avatar { 
            width: 80px; height: 80px; 
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); 
            border-radius: 20px; display: flex; align-items: center; justify-content: center; 
            font-size: 2rem; color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .profile-info h2 { margin: 0; font-size: 1.8rem; }
        .profile-info p { margin: 5px 0 0; color: var(--text-secondary); font-size: 0.9rem; }
        .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .profile-stat-card { 
            background: var(--bg-card); padding: 25px; border-radius: 16px; 
            border: 1px solid var(--border); text-align: center; 
        }
        .profile-stat-card .value { display: block; font-size: 1.8rem; font-weight: 700; margin-bottom: 5px; }
        .profile-stat-card .label { font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        .chart-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .section-header h2 { font-size: 1rem; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .chart-container { height: 250px; position: relative; }
        .back-btn { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); padding: 8px 15px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .back-btn:hover { background: var(--bg-card); }
        .quota-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 30px; border-left: 4px solid var(--accent-green); }
    </style>
</head>
<body>
    <div class="container">
        <a href="leaderboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to War Dashboard</a>
        
        <div id="loading" style="text-align:center; padding: 50px;">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p style="margin-top: 15px;">Loading Profile...</p>
        </div>

        <div id="profile-content" style="display:none;">
            <div class="profile-header">
                <div class="profile-avatar" id="playerAvatar">?</div>
                <div class="profile-info">
                    <h2 id="playerName">Loading... <span id="playerGuild" style="font-size: 0.5em; vertical-align: middle; background: rgba(77, 148, 255, 0.1); color: var(--accent-blue); padding: 4px 8px; border-radius: 4px; margin-left: 10px;"></span> <span id="playerRank" style="font-size: 0.5em; vertical-align: middle; background: rgba(63, 185, 80, 0.1); color: var(--accent-green); padding: 4px 8px; border-radius: 4px;"></span></h2>
                    <p id="playerSeen">First Seen: -- | Last Seen: --</p>
                </div>
            </div>

            <div class="profile-grid">
                <div class="profile-stat-card">
                    <span class="value" id="mightVal">--</span>
                    <span class="label">Current Might</span>
                    <span id="mightGain" style="font-size: 0.75em;">--</span>
                </div>
                <div class="profile-stat-card">
                    <span class="value" id="killsVal">--</span>
                    <span class="label">Current Kills</span>
                    <span id="killsGain" style="font-size: 0.75em;">--</span>
                </div>
            </div>

            <div class="quota-card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h3 style="font-size: 0.9rem; color: var(--text-secondary); text-transform: uppercase;">Monthly Kill Quota (1,000,000)</h3>
                        <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
                            <div style="width: 40px; height: 40px; background: var(--accent-green); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white;">
                                <i class="fas fa-check"></i>
                            </div>
                            <div>
                                <div style="font-weight: bold; color: var(--accent-green);">QUOTA MET</div>
                                <div id="quotaProgressText" style="font-size: 0.8rem; color: var(--text-secondary);">-- / 1M kills this month</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div style="height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; margin-top: 15px;">
                    <div id="quotaBar" style="height: 100%; width: 0%; background: var(--accent-green); border-radius: 2px; transition: width 1s;"></div>
                </div>
            </div>

            <div class="chart-section">
                <div class="section-header">
                    <h2><i class="fas fa-chart-area"></i> Power Progress (History)</h2>
                </div>
                <div class="chart-container">
                    <canvas id="powerChart"></canvas>
                </div>
            </div>

            <div class="chart-section">
                <div class="section-header">
                    <h2><i class="fas fa-chart-line"></i> Kills History (History)</h2>
                </div>
                <div class="chart-container">
                    <canvas id="killsChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1PGJ-Ad74mpx-v3RbqHku2310jiCCyYcb85eC1G3d8wM';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

        function parseCSV(csv) {
            const lines = csv.split('\n').filter(l => l.trim());
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.replace(/\"/g, '').trim());
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].match(/(\"[^\"]*\"|[^,]*)/g) || [];
                const obj = {};
                headers.forEach((h, idx) => {
                    obj[h] = (values[idx] || '').replace(/\"/g, '').trim();
                });
                const mapped = {
                    NAME: obj['Player'] || obj['NAME'] || '',
                    MIGHT: obj['Might'] || obj['MIGHT'] || '',
                    PLAYER_KILL: obj['Player Kill'] || obj['PLAYER_KILL'] || '',
                    KILL: obj['Kills INCREASE '] || obj['Kills INCREASE'] || obj['KILL'] || '',
                    'MIGHT GAIN': obj['MightGain'] || obj['MIGHT GAIN'] || '',
                    RANK: obj['RANK'] || '',
                    MONTH: obj['Date'] || obj['MONTH'] || '',
                    GUILD: obj['GUILD'] || 'HEM'
                };
                if (mapped.NAME) data.push(mapped);
            }
            return data;
        }

        async function loadProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            const playerName = urlParams.get('name');
            if (!playerName) {
                window.location.href = 'leaderboard.html';
                return;
            }

            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                const data = parseCSV(csvText);

                const playerHistory = data.filter(p => p.NAME === playerName).sort((a, b) => new Date(a.MONTH) - new Date(b.MONTH));
                if (playerHistory.length === 0) {
                    document.getElementById('playerName').textContent = 'Player Not Found';
                    return;
                }

                const latest = playerHistory[playerHistory.length - 1];
                
                document.getElementById('playerName').childNodes[0].textContent = latest.NAME + ' ';
                document.getElementById('playerAvatar').textContent = latest.NAME.charAt(0).toUpperCase();
                document.getElementById('playerGuild').textContent = latest.GUILD;
                document.getElementById('playerRank').textContent = latest.RANK;
                document.getElementById('playerSeen').textContent = `First Seen: ${playerHistory[0].MONTH} | Last Seen: ${latest.MONTH}`;
                
                document.getElementById('mightVal').textContent = latest.MIGHT;
                const mGain = latest['MIGHT GAIN'] || '0';
                document.getElementById('mightGain').textContent = `Gain: ${mGain}`;
                document.getElementById('mightGain').style.color = mGain.includes('-') ? '#ff4d4d' : '#3fb950';

                document.getElementById('killsVal').textContent = latest.PLAYER_KILL;
                const kGain = latest.KILL || '0';
                document.getElementById('killsGain').textContent = `Gain: ${kGain}`;
                document.getElementById('killsGain').style.color = '#3fb950';

                const killsNum = parseFloat(kGain.replace(/[^0-9.]/g, '')) || 0;
                if (kGain.includes('M')) killsNum *= 1000000;
                else if (kGain.includes('K')) killsNum *= 1000;
                
                const percent = Math.min(100, (killsNum / 1000000) * 100);
                document.getElementById('quotaProgressText').textContent = `${kGain} / 1M kills this month`;
                document.getElementById('quotaBar').style.width = percent + '%';

                initCharts(playerHistory);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('profile-content').style.display = 'block';

            } catch (error) {
                console.error('Error loading profile:', error);
                document.getElementById('playerName').textContent = 'Error loading data';
            }
        }

        function initCharts(history) {
            const labels = history.map(h => h.MONTH);
            const parseVal = (v) => {
                if (!v) return 0;
                let s = v.toString().toUpperCase();
                let n = parseFloat(s.replace(/[^0-9.]/g, '')) || 0;
                if (s.includes('B')) n *= 1e9;
                else if (s.includes('M')) n *= 1e6;
                return n;
            };

            const chartOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#94949e', font: { size: 10 } } },
                    y: { 
                        grid: { color: 'rgba(255,255,255,0.05)' }, 
                        ticks: { 
                            color: '#94949e', 
                            callback: v => v >= 1e9 ? (v/1e9).toFixed(1)+'B' : v >= 1e6 ? (v/1e6).toFixed(1)+'M' : v 
                        } 
                    }
                }
            };

            new Chart(document.getElementById('powerChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: history.map(h => parseVal(h.MIGHT)),
                        borderColor: '#4d94ff',
                        backgroundColor: 'rgba(77, 148, 255, 0.1)',
                        fill: true, tension: 0.4
                    }]
                },
                options: chartOptions
            });

            new Chart(document.getElementById('killsChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: history.map(h => parseVal(h.PLAYER_KILL)),
                        borderColor: '#ff4d4d',
                        backgroundColor: 'rgba(255, 77, 77, 0.1)',
                        fill: true, tension: 0.4
                    }]
                },
                options: chartOptions
            });
        }
        loadProfile();
    </script>
</body>
</html>
