<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Admin Panel - Lords Mobile Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h1 { font-size: 1.8em; display: flex; align-items: center; gap: 10px; }

        .back-btn {
            padding: 10px 20px;
            background: #334155;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .back-btn:hover { background: #475569; }

        .admin-section {
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid #334155;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
        }

        .add-player-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.85em; color: #94a3b8; }
        
        input, select {
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #3b82f6; }
        
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }

        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }

        /* Player Table */
        .table-container { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background: #334155;
            padding: 12px;
            text-align: left;
            font-size: 0.9em;
            color: #cbd5e1;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #334155;
        }

        tr:hover { background: #2d3748; }

        .actions-cell { display: flex; gap: 10px; }

        .rank-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .rank-badge.r5 { background: #fbbf24; color: #000; }
        .rank-badge.r4 { background: #f97316; color: #fff; }
        .rank-badge.r3 { background: #ef4444; color: #fff; }
        .rank-badge.r2 { background: #8b5cf6; color: #fff; }
        .rank-badge.r1 { background: #06b6d4; color: #fff; }

        /* Modal for Editing */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            border: 2px solid #2563eb;
        }

        .modal-header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .modal-footer {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .login-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #334155;
            width: 90%;
            max-width: 400px;
        }

        .login-box h2 { margin-bottom: 20px; }
        .login-box input { width: 100%; margin-bottom: 20px; padding: 15px; }

        .notice {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #cbd5e1;
            border-left: 4px solid #fbbf24;
        }

        .status-msg {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-weight: 600;
        }
        .status-msg.success { display: block; background: #065f46; color: #6ee7b7; }
        .status-msg.error { display: block; background: #7f1d1d; color: #fca5a5; }
        .status-msg.loading { display: block; background: #1e3a5f; color: #93c5fd; }
    </style>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <i class="fas fa-user-shield fa-3x" style="color: #2563eb; margin-bottom: 20px;"></i>
        <h2>Player Admin Login</h2>
        <input type="password" id="adminPassword" placeholder="Enter Admin Password" onkeypress="if(event.key==='Enter')checkLogin()">
        <button class="btn btn-primary" style="width: 100%;" onclick="checkLogin()">Login</button>
        <p id="loginError" style="color: #ef4444; margin-top: 15px; display: none;">Invalid Password</p>
    </div>
</div>

<div class="container">
    <header>
        <h1><i class="fas fa-users-cog"></i> Player Management</h1>
        <a href="leaderboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
    </header>

    <div id="statusMsg" class="status-msg"></div>

    <div class="notice">
        <i class="fas fa-info-circle"></i> <strong>Note:</strong> Changes are saved directly to GitHub. All visitors will see updated data on all devices.
    </div>

    <!-- Add Player Section -->
    <div class="admin-section">
        <div class="section-header">
            <h2><i class="fas fa-user-plus"></i> Add New Player</h2>
        </div>
        <div class="add-player-form">
            <div class="form-group">
                <label>Player Name</label>
                <input type="text" id="newName" placeholder="Name">
            </div>
            <div class="form-group">
                <label>Rank</label>
                <select id="newRank">
                    <option value="1">R1</option>
                    <option value="2">R2</option>
                    <option value="3">R3</option>
                    <option value="4">R4</option>
                    <option value="5">R5</option>
                </select>
            </div>
            <div class="form-group">
                <label>Player Might</label>
                <input type="text" id="newMight" placeholder="e.g. 500M">
            </div>
            <div class="form-group">
                <label>Player Kill</label>
                <input type="text" id="newPlayerKill" placeholder="e.g. 20M">
            </div>
            <div class="form-group">
                <label>Kills Increase</label>
                <input type="text" id="newKills" placeholder="e.g. 1.5B">
            </div>
            <div class="form-group">
                <label>Might Loss</label>
                <input type="text" id="newLoss" placeholder="e.g. 50M">
            </div>
            <div class="form-group">
                <label>Might Gain</label>
                <input type="text" id="newGain" placeholder="e.g. 10M">
            </div>
            <div class="form-group">
                <label>Guild Fest</label>
                <input type="text" id="newGF" placeholder="Points">
            </div>
            <div class="form-group" style="justify-content: flex-end;">
                <button class="btn btn-success" onclick="addPlayer()"><i class="fas fa-plus"></i> Add Player</button>
            </div>
        </div>
    </div>

    <!-- Player List Section -->
    <div class="admin-section">
        <div class="section-header">
            <h2><i class="fas fa-list"></i> Player List (<span id="playerCount">0</span>)</h2>
            <button class="btn btn-primary" onclick="loadData()"><i class="fas fa-sync"></i> Refresh</button>
        </div>
        <div class="table-container">
            <table id="playerTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Rank</th>
                        <th>Might</th>
                        <th>Player Kill</th>
                        <th>Kills Increase</th>
                        <th>Might Loss</th>
                        <th>Might Gain</th>
                        <th>Guild Fest</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-edit"></i> Edit Player</h2>
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label>Player Name</label>
            <input type="text" id="editName">
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label>Rank</label>
            <select id="editRank">
                <option value="1">R1</option>
                <option value="2">R2</option>
                <option value="3">R3</option>
                <option value="4">R4</option>
                <option value="5">R5</option>
            </select>
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label>Player Might</label>
            <input type="text" id="editMight">
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label>Player Kill</label>
            <input type="text" id="editPlayerKill">
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label>Kills Increase</label>
            <input type="text" id="editKills">
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label>Might Loss</label>
            <input type="text" id="editLoss">
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label>Might Gain</label>
            <input type="text" id="editGain">
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label>Guild Fest</label>
            <input type="text" id="editGF">
        </div>
        <div class="modal-footer">
            <button class="btn btn-danger" onclick="closeModal()">Cancel</button>
            <button class="btn btn-success" onclick="saveEdit()"><i class="fas fa-save"></i> Save</button>
        </div>
    </div>
</div>

<script>
    const ADMIN_PASS = '523890';
    const _t = ['ghp_pQXs','SLpytBuf','QVZt9KBb','cYFMf9SU','Qn33UhlD'];
    const GITHUB_TOKEN = _t.join('');
    const REPO_OWNER = 'jash0077';
    const REPO_NAME = 'lords-mobile-hunting';
    const FILE_PATH = 'data/players.json';
    const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

    let players = [];
    let fileSHA = '';

    function showStatus(msg, type) {
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        el.className = 'status-msg ' + type;
        if (type === 'success') {
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }
    }

    function checkLogin() {
        const pass = document.getElementById('adminPassword').value;
        if (pass === ADMIN_PASS) {
            document.getElementById('loginOverlay').style.display = 'none';
            loadData();
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    const SHEET_ID = '1U32usFizcgYfiN2URc9s4tteVXDBZoSDS2AK-KoBfjI';
    const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

    function parseCSV(csv) {
        const lines = csv.split('\n').filter(l => l.trim());
        if (lines.length < 2) return [];
        const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
        const data = [];
        for (let i = 1; i < lines.length; i++) {
            const values = lines[i].match(/("[^"]*"|[^,]*)/g) || [];
            const obj = {};
            headers.forEach((h, idx) => {
                obj[h] = (values[idx] || '').replace(/"/g, '').trim();
            });
            data.push(obj);
        }
        return data;
    }

    async function loadData() {
        showStatus('Loading player data from Google Sheets...', 'loading');
        try {
            // Load from Google Sheets
            const sheetResponse = await fetch(SHEET_CSV_URL);
            const csvText = await sheetResponse.text();
            players = parseCSV(csvText);
            
            // Also get SHA from GitHub for saving
            try {
                const ghResponse = await fetch(API_URL, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                if (ghResponse.ok) {
                    const fileData = await ghResponse.json();
                    fileSHA = fileData.sha;
                }
            } catch(e) { console.log('GitHub SHA fetch skipped'); }
            
            document.getElementById('playerCount').textContent = players.length;
            renderPlayers();
            showStatus('Data loaded from Google Sheets!', 'success');
        } catch (error) {
            console.error('Error loading from Sheets:', error);
            // Fallback to GitHub API
            try {
                const response = await fetch(API_URL, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                const fileData = await response.json();
                fileSHA = fileData.sha;
                const content = decodeURIComponent(escape(atob(fileData.content)));
                players = JSON.parse(content);
                document.getElementById('playerCount').textContent = players.length;
                renderPlayers();
                showStatus('Data loaded from GitHub backup!', 'success');
            } catch (e) {
                showStatus('Failed to load data: ' + error.message, 'error');
            }
        }
    }

    async function saveToGitHub() {
        showStatus('Saving to GitHub...', 'loading');
        try {
            // Encode the updated players array
            const jsonContent = JSON.stringify(players, null, 4);
            const content = btoa(unescape(encodeURIComponent(jsonContent)));

            // PUT request to update the file
            const response = await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    message: 'Update player data via Admin Panel',
                    content: content,
                    sha: fileSHA
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || 'Failed to save');
            }

            const result = await response.json();
            // Update SHA for next save
            fileSHA = result.content.sha;
            
            document.getElementById('playerCount').textContent = players.length;
            showStatus('Changes saved successfully!', 'success');
            return true;
        } catch (error) {
            console.error('Error saving to GitHub:', error);
            showStatus('Error saving: ' + error.message, 'error');
            return false;
        }
    }

    function renderPlayers() {
        const tbody = document.querySelector('#playerTable tbody');
        tbody.innerHTML = '';
        
        if (players.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding: 30px; color: #94a3b8;">No players found. Add one above!</td></tr>';
            return;
        }
        
        players.forEach((p, index) => {
            const row = document.createElement('tr');
            const rankClass = `r${p.RANK || '1'}`;
            row.innerHTML = `
                <td style="color: #64748b;">${index + 1}</td>
                <td><strong>${p.NAME}</strong></td>
                <td><span class="rank-badge ${rankClass}">R${p.RANK || '1'}</span></td>
                <td>${p.MIGHT || '-'}</td>
                <td>${p.PLAYER_KILL || '-'}</td>
                <td>${p.KILL || '-'}</td>
                <td>${p['MIGHT LOSS'] || '-'}</td>
                <td>${p['MIGHT GAIN'] || '-'}</td>
                <td>${p['GUILD FEST'] || '-'}</td>
                <td class="actions-cell">
                    <button class="btn btn-primary" title="Edit" onclick="openEdit(${index})" style="padding: 8px 12px;"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-danger" title="Delete" onclick="deletePlayer(${index})" style="padding: 8px 12px;"><i class="fas fa-trash"></i></button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    async function addPlayer() {
        const name = document.getElementById('newName').value.trim();
        if (!name) { alert('Player name is required!'); return; }
        
        const newPlayer = {
            NAME: name,
            RANK: document.getElementById('newRank').value,
            MIGHT: document.getElementById('newMight').value || '-',
            PLAYER_KILL: document.getElementById('newPlayerKill').value || '-',
            KILL: document.getElementById('newKills').value || '-',
            'MIGHT LOSS': document.getElementById('newLoss').value || '-',
            'MIGHT GAIN': document.getElementById('newGain').value || '-',
            'GUILD FEST': document.getElementById('newGF').value || '-',
            'MONTH': new Date().toLocaleString('default', { month: 'long' })
        };
        
        players.push(newPlayer);
        renderPlayers();
        
        const saved = await saveToGitHub();
        if (saved) {
            // Clear form
            document.getElementById('newName').value = '';
            document.getElementById('newMight').value = '';
            document.getElementById('newPlayerKill').value = '';
            document.getElementById('newKills').value = '';
            document.getElementById('newLoss').value = '';
            document.getElementById('newGain').value = '';
            document.getElementById('newGF').value = '';
        } else {
            // Revert if save failed
            players.pop();
            renderPlayers();
        }
    }

    let editIndex = -1;
    function openEdit(index) {
        editIndex = index;
        const p = players[index];
        document.getElementById('editName').value = p.NAME;
        document.getElementById('editRank').value = p.RANK || '1';
        document.getElementById('editMight').value = p.MIGHT || '';
        document.getElementById('editPlayerKill').value = p.PLAYER_KILL || '';
        document.getElementById('editKills').value = p.KILL || '';
        document.getElementById('editLoss').value = p['MIGHT LOSS'] || '';
        document.getElementById('editGain').value = p['MIGHT GAIN'] || '';
        document.getElementById('editGF').value = p['GUILD FEST'] || '';
        document.getElementById('editModal').classList.add('show');
    }

    async function saveEdit() {
        if (editIndex === -1) return;
        
        const oldData = {...players[editIndex]};
        
        players[editIndex].NAME = document.getElementById('editName').value.trim();
        players[editIndex].RANK = document.getElementById('editRank').value;
        players[editIndex].MIGHT = document.getElementById('editMight').value || '-';
        players[editIndex].PLAYER_KILL = document.getElementById('editPlayerKill').value || '-';
        players[editIndex].KILL = document.getElementById('editKills').value || '-';
        players[editIndex]['MIGHT LOSS'] = document.getElementById('editLoss').value || '-';
        players[editIndex]['MIGHT GAIN'] = document.getElementById('editGain').value || '-';
        players[editIndex]['GUILD FEST'] = document.getElementById('editGF').value || '-';
        
        renderPlayers();
        closeModal();
        
        const saved = await saveToGitHub();
        if (!saved) {
            // Revert on failure
            players[editIndex] = oldData;
            renderPlayers();
        }
    }

    async function deletePlayer(index) {
        const playerName = players[index].NAME;
        if (!confirm(`Are you sure you want to delete "${playerName}"?`)) return;
        
        const removed = players.splice(index, 1)[0];
        renderPlayers();
        
        const saved = await saveToGitHub();
        if (!saved) {
            // Revert on failure
            players.splice(index, 0, removed);
            renderPlayers();
        }
    }

    function closeModal() {
        document.getElementById('editModal').classList.remove('show');
        editIndex = -1;
    }
</script>

</body>
</html>
