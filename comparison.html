<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Comparison | Lords Mobile Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0b0b0f;
            --bg-card: #13131a;
            --bg-elevated: #1c1c24;
            --text-primary: #f3f4f6;
            --text-secondary: #94949e;
            --accent-blue: #4d94ff;
            --accent-purple: #bc8cff;
            --accent-green: #3fb950;
            --accent-red: #ef4444;
            --accent-gold: #f5a623;
            --border: rgba(255, 255, 255, 0.06);
            --glow-green: rgba(63, 185, 80, 0.15);
            --glow-red: rgba(239, 68, 68, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-dark); color: var(--text-primary); font-family: 'Inter', sans-serif; padding: 20px; line-height: 1.5; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header-title h1 { font-family: 'Poppins', sans-serif; font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 10px; }
        .header-title p { color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px; }
        .nav-controls { display: flex; gap: 12px; align-items: center; }
        .nav-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 8px 16px; border-radius: 8px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer; transition: 0.2s; }
        .nav-btn:hover { background: var(--bg-elevated); border-color: var(--accent-blue); }

        .selector-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 30px; }
        .selector-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .player-select-box { position: relative; }
        .player-select-box label { display: block; color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 600; }
        .search-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px; color: var(--text-primary); font-size: 0.95rem; transition: all 0.3s; }
        .search-input:focus { border-color: var(--accent-blue); outline: none; background: rgba(255,255,255,0.08); }
        
        .search-results { position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; margin-top: 5px; max-height: 200px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .result-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid var(--border); transition: 0.2s; }
        .result-item:last-child { border-bottom: none; }
        .result-item:hover { background: rgba(77, 148, 255, 0.1); color: var(--accent-blue); }
        .selected-player-badge { display: flex; align-items: center; justify-content: space-between; background: rgba(77, 148, 255, 0.1); border: 1px solid rgba(77, 148, 255, 0.3); padding: 10px 15px; border-radius: 12px; margin-top: 10px; }
        .remove-btn { color: var(--accent-red); cursor: pointer; font-size: 1.1rem; }

        .comparison-grid { display: none; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .comparison-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 25px; position: relative; }
        .comparison-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--player-color, var(--accent-blue)); border-radius: 20px 20px 0 0; }
        
        .player-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .player-avatar { width: 50px; height: 50px; border-radius: 12px; background: var(--player-color, var(--accent-blue)); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; color: #fff; }
        .player-name { font-size: 1.3rem; font-weight: 700; font-family: 'Poppins', sans-serif; }
        .player-rank { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; }

        .stat-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: var(--text-secondary); font-size: 0.9rem; }
        .stat-value { font-weight: 700; font-family: 'Poppins', sans-serif; }
        .text-green { color: var(--accent-green); }
        .text-red { color: var(--accent-red); }

        .charts-container { display: none; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .chart-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 25px; }
        .chart-card h3 { font-size: 1.1rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .chart-box { height: 300px; position: relative; }

        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .charts-container { grid-template-columns: 1fr; }
            .chart-box { height: 250px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1>⚔️ Player Comparison</h1>
                <p>Evaluate and compare guild members' performance side-by-side.</p>
            </div>
            <div class="nav-controls">
                <a href="leaderboard.html" class="nav-btn"><i class="fas fa-trophy"></i> Leaderboard</a>
                <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Home</a>
            </div>
        </header>

        <section class="selector-section">
            <div class="selector-grid">
                <div class="player-select-box" id="box-0">
                    <label>Player 1</label>
                    <input type="text" class="search-input" placeholder="Search player name..." oninput="handleSearch(0, this.value)">
                    <div class="search-results" id="results-0"></div>
                    <div class="selected-player-badge" id="badge-0" style="display:none;">
                        <span class="name">Player Name</span>
                        <i class="fas fa-times-circle remove-btn" onclick="removePlayer(0)"></i>
                    </div>
                </div>
                <div class="player-select-box" id="box-1">
                    <label>Player 2</label>
                    <input type="text" class="search-input" placeholder="Search player name..." oninput="handleSearch(1, this.value)">
                    <div class="search-results" id="results-1"></div>
                    <div class="selected-player-badge" id="badge-1" style="display:none;">
                        <span class="name">Player Name</span>
                        <i class="fas fa-times-circle remove-btn" onclick="removePlayer(1)"></i>
                    </div>
                </div>
                <div class="player-select-box" id="box-2">
                    <label>Player 3 (Optional)</label>
                    <input type="text" class="search-input" placeholder="Search player name..." oninput="handleSearch(2, this.value)">
                    <div class="search-results" id="results-2"></div>
                    <div class="selected-player-badge" id="badge-2" style="display:none;">
                        <span class="name">Player Name</span>
                        <i class="fas fa-times-circle remove-btn" onclick="removePlayer(2)"></i>
                    </div>
                </div>
            </div>
        </section>

        <div id="comparison-content">
            <div class="comparison-grid" id="statsGrid"></div>
            <div class="charts-container" id="chartsContainer">
                <div class="chart-card">
                    <h3><i class="fas fa-chart-line" style="color: var(--accent-blue)"></i> Might Growth</h3>
                    <div class="chart-box"><canvas id="mightChart"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3><i class="fas fa-skull" style="color: var(--accent-red)"></i> Kills Growth</h3>
                    <div class="chart-box"><canvas id="killsChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>Syncing guild data...</p>
    </div>

    <script>
        const SHEET_ID = '1SmaO7EImblnP5RlyyxKH1_6GU9Dz1J0gu776ojbSo7I';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&t=${Date.now()}`;
        
        let allData = [];
        let playerNames = [];
        let selectedPlayers = [null, null, null];
        let charts = { might: null, kills: null };
        const colors = ['#4d94ff', '#bc8cff', '#f5a623'];

        async function init() {
            showLoading(true);
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                allData = parseCSV(csvText);
                playerNames = [...new Set(allData.map(p => p.NAME))].sort();
                showLoading(false);
            } catch (error) {
                console.error('Fetch failed:', error);
                showLoading(false);
                alert('Failed to load data from Google Sheets.');
            }
        }

        function parseCSV(csv) {
            const lines = csv.split('\n').filter(l => l.trim());
            const parseLine = (line) => {
                const result = []; let cur = ''; let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { result.push(cur.trim()); cur = ''; }
                    else cur += char;
                }
                result.push(cur.trim()); return result;
            };
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const v = parseLine(lines[i]);
                if (v.length < 2) continue;
                data.push({
                    MONTH: v[0] || '', NAME: v[1] || '', PREV_MIGHT: v[2] || '', MIGHT: v[3] || '',
                    PREV_KILLS: v[4] || '', PLAYER_KILL: v[5] || '', KILL: v[6] || '',
                    'MIGHT LOSS': v[7] || '', 'MIGHT GAIN': v[8] || '', RANK: v[9] || '', 'GUILD FEST': v[10] || ''
                });
            }
            return data.filter(p => p.NAME && p.NAME !== 'Player');
        }

        function handleSearch(index, query) {
            const resultsEl = document.getElementById(`results-${index}`);
            if (query.length < 2) {
                resultsEl.style.display = 'none';
                return;
            }

            const matches = playerNames.filter(name => 
                name.toLowerCase().includes(query.toLowerCase()) && 
                !selectedPlayers.includes(name)
            ).slice(0, 10);

            if (matches.length > 0) {
                resultsEl.innerHTML = matches.map(name => `
                    <div class="result-item" onclick="selectPlayer(${index}, '${name}')">${name}</div>
                `).join('');
                resultsEl.style.display = 'block';
            } else {
                resultsEl.style.display = 'none';
            }
        }

        function selectPlayer(index, name) {
            selectedPlayers[index] = name;
            document.getElementById(`results-${index}`).style.display = 'none';
            document.querySelector(`#box-${index} .search-input`).style.display = 'none';
            const badge = document.getElementById(`badge-${index}`);
            badge.querySelector('.name').textContent = name;
            badge.style.display = 'flex';
            updateComparison();
        }

        function removePlayer(index) {
            selectedPlayers[index] = null;
            document.querySelector(`#box-${index} .search-input`).style.display = 'block';
            document.querySelector(`#box-${index} .search-input`).value = '';
            document.getElementById(`badge-${index}`).style.display = 'none';
            updateComparison();
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        function parseVal(val) {
            if (!val) return 0;
            let str = val.toString().toUpperCase().trim();
            let numeric = parseFloat(str.replace(/[^0-9.]/g, '')) || 0;
            if (str.includes('B')) numeric *= 1e9;
            else if (str.includes('M')) numeric *= 1e6;
            else if (str.includes('K')) numeric *= 1e3;
            return numeric;
        }

        function formatVal(val) {
            if (val >= 1e9) return (val / 1e9).toFixed(2) + 'B';
            if (val >= 1e6) return (val / 1e6).toFixed(2) + 'M';
            if (val >= 1e3) return (val / 1e3).toFixed(1) + 'K';
            return val.toString();
        }

        function updateComparison() {
            const activePlayers = selectedPlayers.filter(p => p !== null);
            const grid = document.getElementById('statsGrid');
            const chartsContainer = document.getElementById('chartsContainer');

            if (activePlayers.length === 0) {
                grid.style.display = 'none';
                chartsContainer.style.display = 'none';
                return;
            }

            grid.style.display = 'grid';
            chartsContainer.style.display = 'grid';
            grid.innerHTML = '';

            const playerData = activePlayers.map(name => {
                const history = allData.filter(p => p.NAME === name);
                const latest = history[history.length - 1];
                const first = history[0];
                
                const mightStart = parseVal(first.MIGHT);
                const mightEnd = parseVal(latest.MIGHT);
                const mightGrowth = mightEnd - mightStart;
                
                const killsStart = parseVal(first.KILL);
                const killsEnd = parseVal(latest.KILL);
                const killsGrowth = killsEnd - killsStart;

                return { name, history, latest, mightGrowth, killsGrowth };
            });

            playerData.forEach((data, i) => {
                const card = document.createElement('div');
                card.className = 'comparison-card';
                card.style.setProperty('--player-color', colors[i]);
                
                card.innerHTML = `
                    <div class="player-header">
                        <div class="player-avatar" style="background:${colors[i]}">${data.name.charAt(0)}</div>
                        <div>
                            <div class="player-name">${data.name}</div>
                            <div class="player-rank">${data.latest.RANK || 'R1'}</div>
                        </div>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Current Might</span>
                        <span class="stat-value">${data.latest.MIGHT}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Might Growth</span>
                        <span class="stat-value text-green">+${formatVal(data.mightGrowth)}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Current Kills</span>
                        <span class="stat-value">${data.latest.KILL}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Kills Gained</span>
                        <span class="stat-value text-green">+${formatVal(data.killsGrowth)}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Total Might Loss</span>
                        <span class="stat-value text-red">${data.latest['MIGHT LOSS'] || '0'}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Avg GF Points</span>
                        <span class="stat-value">${calculateAvgGF(data.history)}</span>
                    </div>
                `;
                grid.appendChild(card);
            });

            updateCharts(playerData);
        }

        function calculateAvgGF(history) {
            const points = history.map(h => parseVal(h['GUILD FEST'])).filter(p => p > 0);
            if (points.length === 0) return '0';
            const avg = points.reduce((a, b) => a + b, 0) / points.length;
            return Math.round(avg).toLocaleString();
        }

        function updateCharts(playerData) {
            const allMonths = [...new Set(allData.map(d => d.MONTH))];
            
            // Might Chart
            if (charts.might) charts.might.destroy();
            const mightCtx = document.getElementById('mightChart').getContext('2d');
            charts.might = new Chart(mightCtx, {
                type: 'line',
                data: {
                    labels: allMonths,
                    datasets: playerData.map((data, i) => ({
                        label: data.name,
                        data: allMonths.map(m => {
                            const entry = data.history.find(h => h.MONTH === m);
                            return entry ? parseVal(entry.MIGHT) : null;
                        }),
                        borderColor: colors[i],
                        backgroundColor: colors[i] + '20',
                        fill: true,
                        tension: 0.4
                    }))
                },
                options: getChartOptions('Might')
            });

            // Kills Chart
            if (charts.kills) charts.kills.destroy();
            const killsCtx = document.getElementById('killsChart').getContext('2d');
            charts.kills = new Chart(killsCtx, {
                type: 'line',
                data: {
                    labels: allMonths,
                    datasets: playerData.map((data, i) => ({
                        label: data.name,
                        data: allMonths.map(m => {
                            const entry = data.history.find(h => h.MONTH === m);
                            return entry ? parseVal(entry.KILL) : null;
                        }),
                        borderColor: colors[i],
                        backgroundColor: colors[i] + '20',
                        fill: true,
                        tension: 0.4
                    }))
                },
                options: getChartOptions('Kills')
            });
        }

        function getChartOptions(label) {
            return {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: '#94949e', font: { family: 'Inter' } } },
                    tooltip: { mode: 'index', intersect: false }
                },
                scales: {
                    y: {
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: {
                            color: '#94949e',
                            callback: value => formatVal(value)
                        }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: '#94949e' }
                    }
                }
            };
        }

        // Close search results when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.player-select-box')) {
                document.querySelectorAll('.search-results').forEach(el => el.style.display = 'none');
            }
        });

        window.onload = init;
    </script>
</body>
</html>
