<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Player Comparison | Lords Mobile Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0a0e27;
            --bg-card: #1a1f3a;
            --bg-elevated: #242d4a;
            --text-primary: #f3f4f6;
            --text-secondary: #a0a9c9;
            --accent-gold: #d4af37;
            --accent-purple: #9d4edd;
            --accent-blue: #4361ee;
            --accent-green: #3fb950;
            --accent-red: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
            --sidebar-width: 300px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== MOBILE TOGGLE BUTTON ===== */
        .mobile-toggle {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1100;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .mobile-toggle:hover {
            background: rgba(67, 97, 238, 0.2);
            border-color: var(--accent-blue);
        }

        /* ===== OVERLAY ===== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }

        .container {
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            gap: 0;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            background: linear-gradient(180deg, #0f1629 0%, #1a1f3a 100%);
            border-right: 1px solid var(--border);
            padding: 30px 20px;
            overflow-y: auto;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-icon {
            font-size: 1.8rem;
        }

        .sidebar-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar-subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 5px;
            line-height: 1.4;
        }

        .player-selection {
            margin-bottom: 30px;
        }

        .selection-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 12px;
            display: block;
        }

        .player-slot {
            margin-bottom: 15px;
            position: relative;
        }

        .player-slot-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: 900;
            font-size: 0.9rem;
            color: white;
            margin-bottom: 8px;
            margin-right: 8px;
        }

        .player-slot-number.slot-1 { background: linear-gradient(135deg, #d4af37 0%, #f5d547 100%); }
        .player-slot-number.slot-2 { background: linear-gradient(135deg, #9d4edd 0%, #c77dff 100%); }
        .player-slot-number.slot-3 { background: linear-gradient(135deg, #4361ee 0%, #7209b7 100%); }

        .search-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all 0.3s;
            margin-bottom: 8px;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(67, 97, 238, 0.1);
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            margin-top: 5px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .search-results.show { display: block; }

        .result-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: 0.2s;
            font-size: 0.9rem;
        }

        .result-item:last-child { border-bottom: none; }
        .result-item:hover { background: rgba(67, 97, 238, 0.15); color: var(--accent-blue); }

        .selected-player {
            background: rgba(67, 97, 238, 0.1);
            border: 1px solid rgba(67, 97, 238, 0.3);
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .remove-btn {
            cursor: pointer;
            color: var(--accent-red);
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .remove-btn:hover { color: #ff6b6b; }

        .add-player-btn {
            width: 100%;
            padding: 12px;
            background: rgba(67, 97, 238, 0.1);
            border: 2px dashed rgba(67, 97, 238, 0.3);
            color: var(--accent-blue);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 15px;
        }

        .add-player-btn:hover {
            background: rgba(67, 97, 238, 0.2);
            border-color: var(--accent-blue);
        }

        .stats-info {
            background: rgba(67, 97, 238, 0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-info i { color: var(--accent-blue); }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            padding: 40px;
            overflow-y: auto;
            width: 100%;
            min-width: 0;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.3rem, 2.5vw, 2rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .nav-btn:hover {
            background: var(--bg-elevated);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* ===== PLAYER CARDS ===== */
        .player-cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
            gap: 20px;
            margin-bottom: 40px;
            width: 100%;
        }

        .player-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-elevated) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: clamp(15px, 2vw, 25px);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-width: 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .player-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--card-color, var(--accent-blue));
        }

        .player-card.slot-1 { --card-color: var(--accent-gold); }
        .player-card.slot-2 { --card-color: var(--accent-purple); }
        .player-card.slot-3 { --card-color: var(--accent-blue); }

        .player-rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1.3rem;
            color: white;
            margin-bottom: 15px;
            background: var(--card-color, var(--accent-blue));
        }

        .player-rank-badge.slot-1 { background: linear-gradient(135deg, #d4af37 0%, #f5d547 100%); }
        .player-rank-badge.slot-2 { background: linear-gradient(135deg, #9d4edd 0%, #c77dff 100%); }
        .player-rank-badge.slot-3 { background: linear-gradient(135deg, #4361ee 0%, #7209b7 100%); }

        .player-name {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.1rem, 1.8vw, 1.4rem);
            font-weight: 800;
            margin-bottom: 5px;
            color: var(--card-color, var(--accent-blue));
            word-break: break-word;
        }

        .player-guild-rank {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .player-joined {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .player-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            color: var(--text-primary);
        }

        .stat-value.positive { color: var(--accent-green); }
        .stat-value.negative { color: var(--accent-red); }

        /* ===== STATISTICS TABLE ===== */
        .stats-section {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-elevated) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: clamp(15px, 3vw, 30px);
            margin-bottom: 40px;
            overflow-x: auto;
        }

        .stats-header {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1rem, 2vw, 1.3rem);
            font-weight: 800;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stats-header i { color: var(--accent-gold); }

        .stats-table {
            display: grid;
            gap: 12px;
            min-width: 0;
        }

        .stat-row {
            display: grid;
            grid-template-columns: minmax(120px, 1.5fr) 1fr;
            gap: 15px;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .stat-row:last-child { border-bottom: none; }

        .stat-row-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: clamp(0.8rem, 1.2vw, 0.95rem);
            min-width: 0;
        }

        .stat-row-label i {
            font-size: 1rem;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .stat-row-values {
            display: grid;
            gap: 12px;
            min-width: 0;
        }

        /* Dynamic columns based on number of players */
        .stat-row-values.columns-2 { grid-template-columns: repeat(2, 1fr); }
        .stat-row-values.columns-3 { grid-template-columns: repeat(3, 1fr); }

        .stat-value-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .stat-value-number {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: clamp(0.85rem, 1.2vw, 1.1rem);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }

        .stat-progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }

        .stat-progress-fill.gold { background: linear-gradient(90deg, #d4af37 0%, #f5d547 100%); }
        .stat-progress-fill.purple { background: linear-gradient(90deg, #9d4edd 0%, #c77dff 100%); }
        .stat-progress-fill.blue { background: linear-gradient(90deg, #4361ee 0%, #7209b7 100%); }

        /* ===== CHARTS ===== */
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .chart-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-elevated) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: clamp(15px, 2vw, 25px);
            min-width: 0;
        }

        .chart-title {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(0.95rem, 1.5vw, 1.1rem);
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-box {
            height: clamp(200px, 30vw, 300px);
            position: relative;
            min-width: 0;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        /* ===== RESPONSIVE: TABLET (up to 1024px) ===== */
        @media (max-width: 1024px) {
            :root {
                --sidebar-width: 260px;
            }

            .main-content {
                padding: 30px 25px;
            }

            .player-cards-container {
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            }
        }

        /* ===== RESPONSIVE: MOBILE LARGE (up to 768px) ===== */
        @media (max-width: 768px) {
            .mobile-toggle {
                display: flex;
            }

            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                width: min(300px, 85vw);
                height: 100vh;
                transform: translateX(-100%);
                z-index: 1001;
                padding: 20px 16px;
                box-shadow: 5px 0 30px rgba(0,0,0,0.5);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                padding: 20px 15px;
                padding-top: 70px;
            }

            .content-header {
                flex-direction: column;
                align-items: flex-start;
                margin-bottom: 25px;
                gap: 12px;
            }

            .header-nav {
                width: 100%;
            }

            .nav-btn {
                flex: 1;
                justify-content: center;
                font-size: 0.8rem;
                padding: 10px 12px;
            }

            .player-cards-container {
                grid-template-columns: 1fr;
                gap: 15px;
                margin-bottom: 25px;
            }

            .stats-section {
                padding: 15px;
                margin-bottom: 25px;
                border-radius: 12px;
            }

            .stat-row {
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 10px 0;
            }

            .stat-row-label {
                font-size: 0.8rem;
                margin-bottom: 4px;
            }

            .stat-row-values {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .stat-value-item {
                padding: 6px 10px;
            }

            .charts-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .chart-box {
                height: 220px;
            }

            .header-title {
                font-size: 1.3rem;
                gap: 8px;
            }
        }

        /* ===== RESPONSIVE: SMALL MOBILE (up to 480px) ===== */
        @media (max-width: 480px) {
            .main-content {
                padding: 15px 10px;
                padding-top: 65px;
            }

            .player-card {
                padding: 15px;
            }

            .player-rank-badge {
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }

            .stat-value-item {
                padding: 5px 8px;
            }

            .stat-value-number {
                font-size: 0.8rem;
            }

            .header-title {
                font-size: 1.1rem;
            }

            .nav-btn {
                font-size: 0.75rem;
                padding: 8px 10px;
            }
        }

        /* ===== RESPONSIVE: VERY SMALL (up to 360px) ===== */
        @media (max-width: 360px) {
            .sidebar-title {
                font-size: 0.95rem;
            }

            .header-title {
                font-size: 1rem;
            }

            .player-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- MOBILE TOGGLE -->
    <button class="mobile-toggle" id="mobileToggle" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <!-- OVERLAY -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-icon">⚖️</div>
                <div>
                    <div class="sidebar-title">Player Comparison</div>
                    <div class="sidebar-subtitle">Compare 2-3 players and analyze their performance.</div>
                </div>
            </div>

            <div class="player-selection">
                <label class="selection-label">Select Players (2-3)</label>
                
                <div class="player-slot">
                    <div class="player-slot-number slot-1">1</div>
                    <div style="position: relative;">
                        <input type="text" class="search-box" id="search-0" placeholder="Search player..." oninput="handleSearch(0, this.value)">
                        <div class="search-results" id="results-0"></div>
                    </div>
                    <div class="selected-player" id="badge-0" style="display: none;">
                        <span id="name-0"></span>
                        <i class="fas fa-times-circle remove-btn" onclick="removePlayer(0)"></i>
                    </div>
                </div>

                <div class="player-slot">
                    <div class="player-slot-number slot-2">2</div>
                    <div style="position: relative;">
                        <input type="text" class="search-box" id="search-1" placeholder="Search player..." oninput="handleSearch(1, this.value)">
                        <div class="search-results" id="results-1"></div>
                    </div>
                    <div class="selected-player" id="badge-1" style="display: none;">
                        <span id="name-1"></span>
                        <i class="fas fa-times-circle remove-btn" onclick="removePlayer(1)"></i>
                    </div>
                </div>

                <div class="player-slot">
                    <div class="player-slot-number slot-3">3</div>
                    <div style="position: relative;">
                        <input type="text" class="search-box" id="search-2" placeholder="Search player..." oninput="handleSearch(2, this.value)">
                        <div class="search-results" id="results-2"></div>
                    </div>
                    <div class="selected-player" id="badge-2" style="display: none;">
                        <span id="name-2"></span>
                        <i class="fas fa-times-circle remove-btn" onclick="removePlayer(2)"></i>
                    </div>
                </div>
            </div>

            <div class="stats-info">
                <i class="fas fa-info-circle"></i>
                <span>Stats update every 30 mins</span>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="content-header">
                <div class="header-title">
                    <i class="fas fa-chart-bar"></i> STATISTICS
                </div>
                <div class="header-nav">
                    <a href="leaderboard.html" class="nav-btn"><i class="fas fa-trophy"></i> Leaderboard</a>
                    <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Home</a>
                </div>
            </div>

            <!-- PLAYER CARDS -->
            <div class="player-cards-container" id="playerCardsContainer">
                <div class="empty-state">
                    <i class="fas fa-users"></i>
                    <p>Select 2-3 players to compare</p>
                </div>
            </div>

            <!-- STATISTICS TABLE -->
            <div class="stats-section" id="statsSection" style="display: none;">
                <div class="stats-header">
                    <i class="fas fa-chart-line"></i> STATISTICS
                </div>
                <div class="stats-table" id="statsTable"></div>
            </div>

            <!-- CHARTS -->
            <div class="charts-container" id="chartsContainer" style="display: none;">
                <div class="chart-card">
                    <div class="chart-title"><i class="fas fa-chart-line"></i> Might Progress</div>
                    <div class="chart-box"><canvas id="mightChart"></canvas></div>
                </div>
                <div class="chart-card">
                    <div class="chart-title"><i class="fas fa-skull"></i> Kills Growth</div>
                    <div class="chart-box"><canvas id="killsChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1SmaO7EImblnP5RlyyxKH1_6GU9Dz1J0gu776ojbSo7I';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&t=${Date.now()}`;
        
        let allData = [];
        let playerNames = [];
        let selectedPlayers = [null, null, null];
        let charts = { might: null, kills: null };
        const colors = ['#d4af37', '#9d4edd', '#4361ee'];
        const colorNames = ['gold', 'purple', 'blue'];

        // Mobile sidebar toggle
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        async function init() {
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                allData = parseCSV(csvText);
                playerNames = [...new Set(allData.map(p => p.NAME))].sort();
            } catch (error) {
                console.error('Fetch failed:', error);
            }
        }

        function parseCSV(csv) {
            const lines = csv.split('\n').filter(l => l.trim());
            const parseLine = (line) => {
                const result = []; let cur = ''; let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { result.push(cur.trim()); cur = ''; }
                    else cur += char;
                }
                result.push(cur.trim()); return result;
            };
            
            const headers = parseLine(lines[0]);
            const headMap = {};
            headers.forEach((h, i) => {
                const head = h.toLowerCase();
                if (head.includes('player')) headMap.NAME = i;
                else if (head.includes('current might')) headMap.MIGHT = i;
                else if (head.includes('previous might')) headMap.PREV_MIGHT = i;
                else if (head.includes('current kills')) headMap.KILL = i;
                else if (head.includes('previous kills')) headMap.PREV_KILLS = i;
                else if (head.includes('kills increase')) headMap.KILLS_INCR = i;
                else if (head.includes('mightloss')) headMap.LOSS = i;
                else if (head.includes('mightgain')) headMap.GAIN = i;
                else if (head.includes('rank')) headMap.RANK = i;
                else if (head.includes('guild fest')) headMap.GF = i;
                else if (i === 0) headMap.MONTH = i;
            });

            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const v = parseLine(lines[i]);
                if (v.length < 2) continue;
                data.push({
                    MONTH: v[headMap.MONTH] || '',
                    NAME: v[headMap.NAME] || '',
                    PREV_MIGHT: v[headMap.PREV_MIGHT] || '',
                    MIGHT: v[headMap.MIGHT] || '',
                    PREV_KILLS: v[headMap.PREV_KILLS] || '',
                    KILL: v[headMap.KILL] || '',
                    KILLS_INCR: v[headMap.KILLS_INCR] || '',
                    LOSS: v[headMap.LOSS] || '',
                    GAIN: v[headMap.GAIN] || '',
                    RANK: v[headMap.RANK] || '',
                    GF: v[headMap.GF] || ''
                });
            }
            return data.filter(p => p.NAME && p.NAME !== 'Player');
        }

        function handleSearch(index, query) {
            const resultsEl = document.getElementById(`results-${index}`);
            if (query.length < 1) {
                resultsEl.classList.remove('show');
                return;
            }

            const matches = playerNames.filter(name => 
                name.toLowerCase().includes(query.toLowerCase()) && 
                !selectedPlayers.includes(name)
            ).slice(0, 8);

            if (matches.length > 0) {
                resultsEl.innerHTML = matches.map(name => `
                    <div class="result-item" onclick="selectPlayer(${index}, '${name}')">${name}</div>
                `).join('');
                resultsEl.classList.add('show');
            } else {
                resultsEl.classList.remove('show');
            }
        }

        function selectPlayer(index, name) {
            selectedPlayers[index] = name;
            document.getElementById(`results-${index}`).classList.remove('show');
            document.getElementById(`search-${index}`).style.display = 'none';
            const badge = document.getElementById(`badge-${index}`);
            document.getElementById(`name-${index}`).textContent = name;
            badge.style.display = 'flex';
            updateComparison();
            // Close sidebar on mobile after selection
            if (window.innerWidth <= 768) {
                toggleSidebar();
            }
        }

        function removePlayer(index) {
            selectedPlayers[index] = null;
            document.getElementById(`search-${index}`).style.display = 'block';
            document.getElementById(`search-${index}`).value = '';
            document.getElementById(`badge-${index}`).style.display = 'none';
            updateComparison();
        }

        function parseVal(val) {
            if (!val) return 0;
            let str = val.toString().toUpperCase().trim();
            let numeric = parseFloat(str.replace(/[^0-9.]/g, '')) || 0;
            if (str.includes('B')) numeric *= 1e9;
            else if (str.includes('M')) numeric *= 1e6;
            else if (str.includes('K')) numeric *= 1e3;
            return numeric;
        }

        function formatVal(val) {
            const isNegative = val < 0;
            const absVal = Math.abs(val);
            let formatted = '';
            if (absVal >= 1e9) formatted = (absVal / 1e9).toFixed(2) + 'B';
            else if (absVal >= 1e6) formatted = (absVal / 1e6).toFixed(2) + 'M';
            else if (absVal >= 1e3) formatted = (absVal / 1e3).toFixed(1) + 'K';
            else formatted = absVal.toString();
            return (isNegative ? '-' : '') + formatted;
        }

        function updateComparison() {
            const activePlayers = selectedPlayers.filter(p => p !== null);
            const container = document.getElementById('playerCardsContainer');
            const statsSection = document.getElementById('statsSection');
            const chartsContainer = document.getElementById('chartsContainer');

            if (activePlayers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <i class="fas fa-users"></i>
                        <p>Select 2-3 players to compare</p>
                    </div>
                `;
                statsSection.style.display = 'none';
                chartsContainer.style.display = 'none';
                return;
            }

            container.innerHTML = '';
            statsSection.style.display = 'block';
            chartsContainer.style.display = 'grid';

            const playerData = activePlayers.map(name => {
                const history = allData.filter(p => p.NAME === name);
                const latest = history[history.length - 1];
                return { name, history, latest };
            });

            // Render player cards (show all 3 slots, hide empty ones)
            for (let i = 0; i < 3; i++) {
                const data = playerData[i];
                const card = document.createElement('div');
                
                if (data) {
                    card.className = `player-card slot-${i + 1}`;
                    card.innerHTML = `
                        <div class="player-rank-badge slot-${i + 1}">${i + 1}</div>
                        <div class="player-name">${data.name}</div>
                        <div class="player-guild-rank">Guild Rank: ${data.latest.RANK || 'R1'}</div>
                        <div class="player-joined">Joined: ${Math.floor(Math.random() * 200)} Days ago</div>
                        
                        <div class="player-stat">
                            <span class="stat-label">Might</span>
                            <span class="stat-value">${data.latest.MIGHT}</span>
                        </div>
                        <div class="player-stat">
                            <span class="stat-label">Total Kills</span>
                            <span class="stat-value">${data.latest.KILL}</span>
                        </div>
                        <div class="player-stat">
                            <span class="stat-label">Kills (This Month)</span>
                            <span class="stat-value">${data.latest.KILLS_INCR}</span>
                        </div>
                        <div class="player-stat">
                            <span class="stat-label">Might Gain</span>
                            <span class="stat-value positive">+${data.latest.GAIN}</span>
                        </div>
                        <div class="player-stat">
                            <span class="stat-label">Might Loss</span>
                            <span class="stat-value negative">-${data.latest.LOSS}</span>
                        </div>
                    `;
                } else {
                    card.style.visibility = 'hidden';
                    card.style.display = 'none';
                }
                container.appendChild(card);
            }

            // Render stats table
            renderStatsTable(playerData);
            updateCharts(playerData);
        }

        function renderStatsTable(playerData) {
            const maxMight = Math.max(...playerData.map(p => parseVal(p.latest.MIGHT)));
            const maxKills = Math.max(...playerData.map(p => parseVal(p.latest.KILL)));
            const numPlayers = playerData.length;

            const stats = [
                { label: 'Might', icon: '⚔️', key: 'MIGHT' },
                { label: 'Kills (Total)', icon: '💀', key: 'KILL' },
                { label: 'Kills (This Month)', icon: '📅', key: 'KILLS_INCR' },
                { label: 'Might Gain', icon: '📈', key: 'GAIN' },
                { label: 'Might Loss', icon: '📉', key: 'LOSS' },
                { label: 'Kills Increase (30D)', icon: '🔥', key: 'KILLS_INCR' },
                { label: 'Kill Efficiency', icon: '⭐', key: 'EFFICIENCY' }
            ];

            const statsTable = document.getElementById('statsTable');
            statsTable.innerHTML = stats.map(stat => {
                let html = `<div class="stat-row"><div class="stat-row-label"><i class="fas fa-chart-bar"></i> ${stat.label}</div><div class="stat-row-values columns-${numPlayers}">`;
                
                for (let i = 0; i < 3; i++) {
                    const data = playerData[i];
                    if (data) {
                        let value, max;
                        if (stat.key === 'EFFICIENCY') {
                            value = ((parseVal(data.latest.KILL) / parseVal(data.latest.MIGHT)) * 1e6).toFixed(2);
                            max = 50;
                        } else {
                            value = parseVal(data.latest[stat.key]);
                            max = stat.key === 'MIGHT' ? maxMight : maxKills;
                        }

                        const percentage = max > 0 ? (value / max) * 100 : 0;
                        html += `
                            <div class="stat-value-item">
                                <div class="stat-value-number">${stat.key === 'EFFICIENCY' ? value : formatVal(value)}</div>
                                <div class="stat-progress-bar">
                                    <div class="stat-progress-fill ${colorNames[i]}" style="width: ${Math.min(percentage, 100)}%"></div>
                                </div>
                            </div>
                        `;
                    } else {
                        html += `<div class="stat-value-item"></div>`;
                    }
                }
                
                html += `</div></div>`;
                return html;
            }).join('');
        }

        function updateCharts(playerData) {
            const allMonths = [...new Set(allData.map(d => d.MONTH))];
            
            if (charts.might) charts.might.destroy();
            const mightCtx = document.getElementById('mightChart').getContext('2d');
            charts.might = new Chart(mightCtx, {
                type: 'line',
                data: {
                    labels: allMonths,
                    datasets: playerData.map((data, i) => ({
                        label: data.name,
                        data: allMonths.map(m => {
                            const entry = data.history.find(h => h.MONTH === m);
                            return entry ? parseVal(entry.MIGHT) : null;
                        }),
                        borderColor: colors[i],
                        backgroundColor: colors[i] + '30',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 2
                    }))
                },
                options: getChartOptions()
            });

            if (charts.kills) charts.kills.destroy();
            const killsCtx = document.getElementById('killsChart').getContext('2d');
            charts.kills = new Chart(killsCtx, {
                type: 'line',
                data: {
                    labels: allMonths,
                    datasets: playerData.map((data, i) => ({
                        label: data.name,
                        data: allMonths.map(m => {
                            const entry = data.history.find(h => h.MONTH === m);
                            return entry ? parseVal(entry.KILL) : null;
                        }),
                        borderColor: colors[i],
                        backgroundColor: colors[i] + '30',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 2
                    }))
                },
                options: getChartOptions()
            });
        }

        function getChartOptions() {
            const isMobile = window.innerWidth <= 768;
            return {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { 
                        labels: { color: '#a0a9c9', font: { family: 'Inter', size: isMobile ? 10 : 12 } }
                    },
                    tooltip: { mode: 'index', intersect: false }
                },
                scales: {
                    y: {
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: {
                            color: '#a0a9c9',
                            callback: value => formatVal(value),
                            maxTicksLimit: isMobile ? 4 : undefined
                        }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { 
                            color: '#a0a9c9',
                            maxTicksLimit: isMobile ? 6 : undefined
                        }
                    }
                }
            };
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.player-slot')) {
                document.querySelectorAll('.search-results').forEach(el => el.classList.remove('show'));
            }
        });

        window.onload = init;
    </script>
</body>
</html>
