<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Schedules - Lords Mobile Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .event-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border-color: var(--accent-gold);
        }
        .event-status {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-upcoming { background: rgba(245, 166, 35, 0.2); color: #f5a623; }
        .status-live { background: rgba(0, 255, 100, 0.2); color: #00ff64; box-shadow: 0 0 10px rgba(0, 255, 100, 0.3); }
        .status-ended { background: rgba(255, 50, 50, 0.2); color: #ff3232; }
        
        .event-name { font-family: 'Orbitron'; color: var(--accent-gold); font-size: 1.2rem; margin-bottom: 5px; }
        .event-region { font-size: 0.8rem; color: #888; margin-bottom: 15px; }
        .event-info-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.9rem; }
        .event-info-row i { width: 20px; color: var(--accent-gold); }
        
        .countdown-container {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }
        .countdown-label { font-size: 0.7rem; text-transform: uppercase; color: #888; letter-spacing: 2px; margin-bottom: 5px; }
        .countdown-timer { font-family: 'Orbitron'; font-size: 1.4rem; color: var(--text-color); }
        
        .local-time-display { font-size: 0.75rem; color: #666; font-style: italic; }

        /* World Clocks Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 4000; align-items: center; justify-content: center; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--accent-gold); padding: 25px; border-radius: 15px; width: 90%; max-width: 600px; text-align: center; max-height: 90vh; overflow-y: auto; }
        .clock-modal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .modal-clock-card { background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); padding: 15px; border-radius: 10px; text-align: center; }
        .modal-clock-time { font-family: 'Orbitron'; color: var(--accent-gold); font-size: 1.1rem; margin: 5px 0; }
        .modal-clock-label { font-size: 0.7rem; color: #888; text-transform: uppercase; }
        .modal-clock-event-time { font-size: 0.8rem; color: #00ff64; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

<header>
    <div class="logo">Lords Mobile Hub</div>
    <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
    </div>
    <nav class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="calculator.html">Speedup Calculator</a>
        <a href="hunting.html">Monster Hunting</a>
        <a href="events.html" class="active">Events</a>
        <a href="admin-control.html" style="color: var(--accent-gold); font-weight: bold;"><i class="fas fa-user-shield"></i> Admin</a>
    </nav>
</header>

<div class="container">
    <div class="hero-section">
        <h1 style="font-family: 'Orbitron';">EVENT_SCHEDULES</h1>
        <p>Stay ahead of the competition with real-time tracking of global guild events. Click on any event to see world clocks.</p>
    </div>

    <div id="eventsLoading" style="text-align: center; padding: 50px;">
        <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--accent-gold);"></i>
        <p style="margin-top: 15px; font-family: 'Orbitron';">LOADING_SATELLITE_DATA...</p>
    </div>

    <div id="eventsGrid" class="event-grid"></div>
</div>

<!-- World Clocks Modal -->
<div id="clockModal" class="modal" onclick="closeClockModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="modalEventName" style="font-family: 'Orbitron'; color: var(--accent-gold); margin-bottom: 5px;">EVENT_NAME</h2>
        <p id="modalEventTime" style="font-size: 0.9rem; color: #888; margin-bottom: 20px;">Event Local Time: ...</p>
        <div id="modalClocksGrid" class="clock-modal-grid">
            <!-- World clocks will be loaded here -->
        </div>
        <button class="btn-calculate" onclick="closeClockModal()" style="margin-top: 30px; width: 100%;">CLOSE</button>
    </div>
</div>

<script src="translations.js"></script>
<script src="features.js"></script>
<script>
    let events = [];
    let worldClocks = [];
    
    async function fetchAllData() {
        try {
            const [evRes, clockRes] = await Promise.all([
                fetch('data/events.json?t=' + Date.now()),
                fetch('data/clocks.json?t=' + Date.now())
            ]);
            
            if (evRes.ok) events = await evRes.json();
            if (clockRes.ok) worldClocks = await clockRes.json();
            
            document.getElementById('eventsLoading').style.display = 'none';
            renderEvents();
            startLiveUpdates();
        } catch (e) {
            console.error('Error fetching data:', e);
            document.getElementById('eventsLoading').innerHTML = '<p style="color: #ff3232;">Failed to load data. Please try again later.</p>';
        }
    }

    function renderEvents() {
        const grid = document.getElementById('eventsGrid');
        if (events.length === 0) {
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #888;">No upcoming events scheduled.</div>';
            return;
        }

        grid.innerHTML = events.map((ev, index) => `
            <div class="event-card" id="event-${index}" onclick="openClockModal(${index})">
                <div class="event-status" id="status-${index}">Checking...</div>
                <div class="event-name">${ev.name}</div>
                <div class="event-region">${ev.region || 'Global'}</div>
                
                <div class="event-info-row">
                    <i class="fas fa-clock"></i>
                    <span>${ev.dateTime.replace('T', ' ')}</span>
                </div>
                <div class="event-info-row">
                    <i class="fas fa-globe"></i>
                    <span>${ev.timezone}</span>
                </div>
                <div class="event-info-row">
                    <i class="fas fa-history"></i>
                    <span class="local-time-display" id="local-${index}">Calculating local time...</span>
                </div>

                <div class="countdown-container">
                    <div class="countdown-label">COUNTDOWN</div>
                    <div class="countdown-timer" id="timer-${index}">00:00:00:00</div>
                </div>
            </div>
        `).join('');
    }

    function updateLiveInfo() {
        events.forEach((ev, index) => {
            try {
                const nowInTZ = new Date(new Date().toLocaleString("en-US", {timeZone: ev.timezone}));
                const targetInTZ = new Date(ev.dateTime);
                const diff = targetInTZ - nowInTZ;
                
                const options = { 
                    timeZone: ev.timezone, 
                    hour: '2-digit', minute: '2-digit', second: '2-digit',
                    hour12: false 
                };
                const tzTimeStr = new Intl.DateTimeFormat('en-US', options).format(new Date());
                const localEl = document.getElementById(`local-${index}`);
                if (localEl) localEl.textContent = `Current TZ Time: ${tzTimeStr}`;

                const statusEl = document.getElementById(`status-${index}`);
                const timerEl = document.getElementById(`timer-${index}`);

                if (statusEl && timerEl) {
                    if (diff > 0) {
                        statusEl.textContent = 'Upcoming';
                        statusEl.className = 'event-status status-upcoming';
                        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        const s = Math.floor((diff % (1000 * 60)) / 1000);
                        timerEl.textContent = `${d}d ${h}h ${m}m ${s}s`;
                    } else if (diff > -3600000 * 2) {
                        statusEl.textContent = 'Live';
                        statusEl.className = 'event-status status-live';
                        timerEl.textContent = 'EVENT LIVE!';
                        timerEl.style.color = '#00ff64';
                    } else {
                        statusEl.textContent = 'Ended';
                        statusEl.className = 'event-status status-ended';
                        timerEl.textContent = '00:00:00:00';
                        timerEl.style.color = '#888';
                    }
                }
            } catch (e) { console.error("TZ Error:", e); }
        });

        // Update modal clocks if open
        if (document.getElementById('clockModal').style.display === 'flex') {
            updateModalClocks();
        }
    }

    let currentEventIndex = -1;

    function openClockModal(index) {
        currentEventIndex = index;
        const ev = events[index];
        document.getElementById('modalEventName').textContent = ev.name;
        document.getElementById('modalEventTime').textContent = `Event Time (${ev.timezone}): ${ev.dateTime.replace('T', ' ')}`;
        updateModalClocks();
        document.getElementById('clockModal').style.display = 'flex';
    }

    function closeClockModal() {
        document.getElementById('clockModal').style.display = 'none';
    }

    function updateModalClocks() {
        if (currentEventIndex === -1) return;
        const ev = events[currentEventIndex];
        const grid = document.getElementById('modalClocksGrid');
        
        if (worldClocks.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1/-1; color: #888;">No world clocks configured.</p>';
            return;
        }

        grid.innerHTML = worldClocks.map(clock => {
            try {
                const now = new Date();
                const timeStr = new Intl.DateTimeFormat('en-US', {
                    timeZone: clock.zone,
                    hour: '2-digit', minute: '2-digit', second: '2-digit',
                    hour12: false
                }).format(now);

                // Calculate event time in this specific timezone
                const eventInTargetTZ = new Intl.DateTimeFormat('en-US', {
                    timeZone: clock.zone,
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit',
                    hour12: false
                }).format(new Date(new Date(ev.dateTime).toLocaleString("en-US", {timeZone: ev.timezone})));

                return `
                    <div class="modal-clock-card">
                        <div style="font-size: 1.5rem;">${clock.flag}</div>
                        <div class="modal-clock-label">${clock.name}</div>
                        <div class="modal-clock-time">${timeStr}</div>
                        <div class="modal-clock-event-time">Event: ${eventInTargetTZ.split(', ')[1]}</div>
                        <div class="modal-clock-label" style="font-size: 0.6rem;">${clock.zone}</div>
                    </div>
                `;
            } catch (e) { return ''; }
        }).join('');
    }

    function startLiveUpdates() {
        updateLiveInfo();
        setInterval(updateLiveInfo, 1000);
    }

    function toggleMenu() {
        document.getElementById('navLinks').classList.toggle('active');
    }

    window.addEventListener('load', fetchAllData);
</script>
</body>
</html>
