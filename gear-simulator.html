<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gear Sim — HEM Guild</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #E8B34E;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --accent: #38bdf8;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 15px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .container {
            flex: 1;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Set Selection */
        .set-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .set-tab {
            flex: 1;
            padding: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .set-tab.active {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(232, 179, 78, 0.1);
        }

        /* Hero Area */
        .sim-area {
            background: var(--card);
            border-radius: 20px;
            padding: 30px;
            position: relative;
            display: grid;
            grid-template-columns: 80px 1fr 80px;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            background-image: radial-gradient(circle at center, rgba(56, 189, 248, 0.05) 0%, transparent 70%);
        }

        .hero-visual {
            text-align: center;
            font-size: 100px;
            color: var(--text-dim);
            opacity: 0.2;
        }

        .slot {
            width: 75px;
            height: 75px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
            overflow: visible;
        }

        .slot:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .slot.has-item {
            border-color: var(--primary);
            background: rgba(232, 179, 78, 0.05);
            box-shadow: 0 0 15px rgba(232, 179, 78, 0.2);
        }

        .slot-icon { font-size: 24px; color: var(--text-dim); }
        .slot-name { font-size: 8px; text-transform: uppercase; color: var(--text-dim); margin-top: 4px; }
        
        .item-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        .item-name-label {
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: var(--primary);
            white-space: nowrap;
            font-weight: bold;
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .side-slots {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .bottom-slots {
            grid-column: 1 / span 3;
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 25px;
        }

        /* Stats Bar */
        .stats-summary {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }

        .stat-val {
            color: var(--primary);
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Selection Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card);
            width: 95%;
            max-width: 500px;
            border-radius: 16px;
            padding: 0;
            max-height: 85vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }

        .modal-body {
            overflow-y: auto;
            padding: 10px;
        }

        .item-row {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            gap: 15px;
            align-items: center;
            transition: 0.2s;
        }

        .item-row:hover { background: rgba(255,255,255,0.05); }

        .item-row-img {
            width: 50px;
            height: 50px;
            background: var(--bg);
            border-radius: 8px;
            padding: 2px;
            border: 1px solid var(--border);
        }

        .item-info { flex: 1; }
        .item-info h4 { margin: 0; font-size: 15px; color: var(--primary); }
        .item-info p { margin: 3px 0 0; font-size: 11px; color: var(--text-dim); line-height: 1.4; }

        .clear-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grade-badge {
            background: #ef4444;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 10px;
        }

        @media (max-width: 400px) {
            .sim-area { padding: 15px; grid-template-columns: 75px 1fr 75px; gap: 10px; }
            .slot { width: 65px; height: 65px; }
            .item-name-label { font-size: 8px; bottom: -18px; }
        }
    </style>
</head>
<body>

<header>
    <a href="trap-guide.html" class="back-btn"><i class="fas fa-chevron-left"></i> BACK</a>
    <div style="font-weight: bold; letter-spacing: 1px;">GEAR SIMULATOR</div>
    <div style="width: 50px;"></div>
</header>

<div class="container">
    <div class="set-tabs">
        <div class="set-tab active" onclick="loadPreset('mixed')">Mixed Set</div>
        <div class="set-tab" onclick="loadPreset('f2p')">F2P Trap</div>
        <div class="set-tab" onclick="loadPreset('rally')">Rally Trap</div>
    </div>

    <div class="sim-area">
        <div class="side-slots">
            <div class="slot" id="slot-Main Hand" onclick="openPicker('Main Hand')">
                <span class="slot-icon"><i class="fas fa-sword"></i></span>
                <span class="slot-name">Weapon</span>
                <div class="item-name-label" id="name-Main Hand"></div>
            </div>
            <div class="slot" id="slot-Armor" onclick="openPicker('Armor')">
                <span class="slot-icon"><i class="fas fa-shirt"></i></span>
                <span class="slot-name">Armor</span>
                <div class="item-name-label" id="name-Armor"></div>
            </div>
            <div class="slot" id="slot-Acc-1" onclick="openPicker('Accessory', 1)">
                <span class="slot-icon"><i class="fas fa-ring"></i></span>
                <span class="slot-name">Acc 1</span>
                <div class="item-name-label" id="name-Acc-1"></div>
            </div>
        </div>

        <div class="hero-visual">
            <i class="fas fa-user-shield"></i>
        </div>

        <div class="side-slots">
            <div class="slot" id="slot-Helmet" onclick="openPicker('Helmet')">
                <span class="slot-icon"><i class="fas fa-hard-hat"></i></span>
                <span class="slot-name">Helm</span>
                <div class="item-name-label" id="name-Helmet"></div>
            </div>
            <div class="slot" id="slot-Off-Hand" onclick="openPicker('Off-Hand')">
                <span class="slot-icon"><i class="fas fa-shield-alt"></i></span>
                <span class="slot-name">Off-Hand</span>
                <div class="item-name-label" id="name-Off-Hand"></div>
            </div>
            <div class="slot" id="slot-Acc-2" onclick="openPicker('Accessory', 2)">
                <span class="slot-icon"><i class="fas fa-ring"></i></span>
                <span class="slot-name">Acc 2</span>
                <div class="item-name-label" id="name-Acc-2"></div>
            </div>
        </div>

        <div class="bottom-slots">
            <div class="slot" id="slot-Legs" onclick="openPicker('Legs')">
                <span class="slot-icon"><i class="fas fa-socks"></i></span>
                <span class="slot-name">Legs</span>
                <div class="item-name-label" id="name-Legs"></div>
            </div>
            <div class="slot" id="slot-Acc-3" onclick="openPicker('Accessory', 3)">
                <span class="slot-icon"><i class="fas fa-ring"></i></span>
                <span class="slot-name">Acc 3</span>
                <div class="item-name-label" id="name-Acc-3"></div>
            </div>
        </div>
    </div>

    <div class="stats-summary">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <div style="font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; font-weight: bold;">Total Attribute Boosts</div>
            <span class="grade-badge">MYTHIC GRADE</span>
        </div>
        <div class="stats-grid" id="stats-grid">
            <!-- Stats will appear here -->
        </div>
        <button class="clear-btn" onclick="clearAll()">RESET BUILD</button>
    </div>
</div>

<div class="modal" id="pickerModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="pickerTitle" style="margin:0; font-size: 18px; color: var(--primary);">Select Item</h3>
            <i class="fas fa-times" onclick="closePicker()" style="cursor:pointer; font-size: 20px; color: var(--text-dim);"></i>
        </div>
        <div class="modal-body" id="pickerList"></div>
    </div>
</div>

<script src="gear-data.js"></script>
<script>
    let currentSet = {
        "Main Hand": null,
        "Off-Hand": null,
        "Helmet": null,
        "Armor": null,
        "Legs": null,
        "Acc-1": null,
        "Acc-2": null,
        "Acc-3": null
    };

    let activeSlot = null;
    let activeAccIdx = null;

    function openPicker(type, accIdx = null) {
        activeSlot = type;
        activeAccIdx = accIdx;
        const modal = document.getElementById('pickerModal');
        const list = document.getElementById('pickerList');
        const title = document.getElementById('pickerTitle');
        
        title.innerText = "Select " + type + (accIdx ? ' ' + accIdx : '');
        list.innerHTML = `
            <div class="item-row" onclick="selectItem(null)">
                <div class="item-row-img" style="display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--text-dim)">
                    <i class="fas fa-ban"></i>
                </div>
                <div class="item-info"><h4>None</h4><p>Unequip this slot</p></div>
            </div>
        `;
        
        gearData[type].forEach(item => {
            const row = document.createElement('div');
            row.className = 'item-row';
            let statsStr = Object.entries(item.stats).map(([k,v]) => `${k} +${v}%`).join(', ');
            row.innerHTML = `
                <img src="${item.image}" class="item-row-img" onerror="this.src='https://via.placeholder.com/50?text=Gear'">
                <div class="item-info">
                    <h4>${item.name}</h4>
                    <p>${statsStr}</p>
                </div>
                <i class="fas fa-plus-circle" style="color:var(--primary); font-size: 18px;"></i>
            `;
            row.onclick = () => selectItem(item);
            list.appendChild(row);
        });
        
        modal.style.display = 'flex';
    }

    function closePicker() {
        document.getElementById('pickerModal').style.display = 'none';
    }

    function selectItem(item) {
        const key = activeAccIdx ? `Acc-${activeAccIdx}` : activeSlot;
        currentSet[key] = item;
        
        const slotEl = document.getElementById(`slot-${key}`);
        const nameEl = document.getElementById(`name-${key}`);
        
        // Clear existing content
        slotEl.innerHTML = '';
        
        if (item) {
            slotEl.classList.add('has-item');
            slotEl.innerHTML = `<img src="${item.image}" class="item-img" onerror="this.style.display='none'">`;
            
            const label = document.createElement('div');
            label.className = 'item-name-label';
            label.id = `name-${key}`;
            label.innerText = item.name;
            slotEl.appendChild(label);
        } else {
            slotEl.classList.remove('has-item');
            // Restore icon and name
            const iconMap = {
                "Main Hand": "sword", "Armor": "shirt", "Acc-1": "ring", "Acc-2": "ring", "Acc-3": "ring",
                "Helmet": "hard-hat", "Off-Hand": "shield-alt", "Legs": "socks"
            };
            const nameMap = {
                "Main Hand": "Weapon", "Armor": "Armor", "Acc-1": "Acc 1", "Acc-2": "Acc 2", "Acc-3": "Acc 3",
                "Helmet": "Helm", "Off-Hand": "Off-Hand", "Legs": "Legs"
            };
            slotEl.innerHTML = `
                <span class="slot-icon"><i class="fas fa-${iconMap[key]}"></i></span>
                <span class="slot-name">${nameMap[key]}</span>
                <div class="item-name-label" id="name-${key}"></div>
            `;
        }
        
        closePicker();
        updateStats();
    }

    function updateStats() {
        const totals = {};
        Object.values(currentSet).forEach(item => {
            if (item) {
                Object.entries(item.stats).forEach(([k, v]) => {
                    totals[k] = (totals[k] || 0) + v;
                });
            }
        });

        const grid = document.getElementById('stats-grid');
        grid.innerHTML = '';
        
        const importantStats = [
            "Infantry ATK", "Ranged ATK", "Cavalry ATK",
            "Army HP", "Army DEF", "Infantry HP", "Cavalry HP"
        ];

        importantStats.forEach(stat => {
            if (totals[stat]) {
                const div = document.createElement('div');
                div.className = 'stat-item';
                div.innerHTML = `<span>${stat}</span><span class="stat-val">+${totals[stat].toFixed(1)}%</span>`;
                grid.appendChild(div);
            }
        });
        
        if (grid.innerHTML === '') {
            grid.innerHTML = '<div style="grid-column: 1/span 2; text-align:center; color:var(--text-dim); padding: 20px; font-size: 13px;">No gear selected. Tap a slot to begin.</div>';
        }
    }

    function clearAll() {
        Object.keys(currentSet).forEach(k => {
            currentSet[k] = null;
            selectItem(null);
        });
        updateStats();
    }

    function loadPreset(type) {
        clearAll();
        document.querySelectorAll('.set-tab').forEach(t => t.classList.remove('active'));
        const tabs = document.querySelectorAll('.set-tab');
        if (type === 'mixed') tabs[0].classList.add('active');
        if (type === 'f2p') tabs[1].classList.add('active');
        if (type === 'rally') tabs[2].classList.add('active');

        const find = (slot, name) => gearData[slot].find(i => i.name === name);

        if (type === 'mixed') {
            selectItemManual('Main Hand', find('Main Hand', 'Frostwing Greatsword'));
            selectItemManual('Off-Hand', find('Off-Hand', 'Winter Mittens'));
            selectItemManual('Helmet', find('Helmet', 'Bumblehelm'));
            selectItemManual('Armor', find('Armor', 'Firewall Plate'));
            selectItemManual('Legs', find('Legs', 'Storm Tasset'));
            selectItemManual('Acc-1', find('Accessory', 'Burning Scroll'));
            selectItemManual('Acc-2', find('Accessory', 'Burning Scroll'));
            selectItemManual('Acc-3', find('Accessory', 'Burning Scroll'));
        } else if (type === 'f2p') {
            selectItemManual('Main Hand', find('Main Hand', 'Frostwing Greatsword'));
            selectItemManual('Off-Hand', find('Off-Hand', 'Call of the Deep'));
            selectItemManual('Helmet', find('Helmet', 'Beast Helmet'));
            selectItemManual('Armor', find('Armor', 'Terror Shield'));
            selectItemManual('Legs', find('Legs', 'Dragon\'s Stride'));
            selectItemManual('Acc-1', find('Accessory', 'Ring of Ancients'));
            selectItemManual('Acc-2', find('Accessory', 'Ring of Ancients'));
            selectItemManual('Acc-3', find('Accessory', 'Ring of Ancients'));
        } else if (type === 'rally') {
            selectItemManual('Main Hand', find('Main Hand', 'Skullcrusher'));
            selectItemManual('Off-Hand', find('Off-Hand', 'Winter Mittens'));
            selectItemManual('Helmet', find('Helmet', 'Bumblehelm'));
            selectItemManual('Armor', find('Armor', 'Firewall Plate'));
            selectItemManual('Legs', find('Legs', 'Storm Tasset'));
            selectItemManual('Acc-1', find('Accessory', 'Ambrosial Cup'));
            selectItemManual('Acc-2', find('Accessory', 'Ambrosial Cup'));
            selectItemManual('Acc-3', find('Accessory', 'Ambrosial Cup'));
        }
    }

    function selectItemManual(key, item) {
        if (!item) return;
        currentSet[key] = item;
        const slotEl = document.getElementById(`slot-${key}`);
        slotEl.classList.add('has-item');
        slotEl.innerHTML = `<img src="${item.image}" class="item-img" onerror="this.style.display='none'">`;
        
        const label = document.createElement('div');
        label.className = 'item-name-label';
        label.id = `name-${key}`;
        label.innerText = item.name;
        slotEl.appendChild(label);
        
        updateStats();
    }

    window.onload = () => loadPreset('mixed');
</script>

</body>
</html>
