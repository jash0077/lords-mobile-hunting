<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060612">
    <title>Gear Simulator - Lords Mobile Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .simulator-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 15px;
        }
        .top-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .btn-back {
            background: var(--bg-surface);
            border: 1px solid var(--border-primary);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .set-tabs {
            display: flex;
            gap: 8px;
        }
        .set-tab {
            background: var(--bg-surface);
            border: 1px solid var(--border-primary);
            color: var(--text-primary);
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .set-tab.active {
            background: var(--neon-blue);
            color: #fff;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }
        .btn-reset-set {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .btn-reset-set:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* Stats Summary Top Panel matching screenshot */
        .stats-summary-panel {
            background: #0d0f1d;
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        @media (max-width: 900px) {
            .stats-summary-panel {
                grid-template-columns: 1fr;
            }
        }
        .stat-category-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .stat-category-title {
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 6px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--text-secondary);
            padding: 2px 0;
        }
        .stat-row span:last-child {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Gear Cards Grid matching screenshot */
        .gear-cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        @media (max-width: 1024px) {
            .gear-cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .gear-cards-grid {
                grid-template-columns: 1fr;
            }
        }

        .gear-card {
            background: #0d0f1d;
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .gear-card-title {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-align: center;
        }
        .gear-card-img-box {
            width: 110px;
            height: 110px;
            background: #15182e;
            border: 2px solid var(--neon-gold);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            margin-bottom: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }
        .gear-card-img-box:hover {
            transform: scale(1.03);
            border-color: var(--neon-blue);
        }
        .gear-card-img-box img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }
        .gear-card-img-box .plus-icon {
            font-size: 28px;
            color: var(--text-muted);
        }

        .gear-card-controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .temper-select-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #14172d;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .temper-select {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
        }
        .temper-select option {
            background: #14172d;
            color: var(--text-primary);
        }
        .btn-card-action {
            width: 100%;
            background: #14172d;
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s ease;
        }
        .btn-card-action:hover {
            border-color: var(--neon-blue);
            background: #1b1f3d;
        }
        .btn-card-clear {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 5px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.78srem;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s ease;
        }
        .btn-card-clear:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #0f1020;
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            width: 90%;
            max-width: 520px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
        }
        .modal-header h3 {
            font-size: 1.1rem;
            color: var(--text-primary);
        }
        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.3rem;
            cursor: pointer;
        }
        .modal-body {
            padding: 15px;
            overflow-y: auto;
        }
        .gear-search-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-primary);
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .gear-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .gear-item-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            background: #151728;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .gear-item-row:hover {
            border-color: var(--neon-blue);
            background: #1b1e36;
        }
        .gear-item-icon-wrap {
            width: 55px;
            height: 55px;
            background: #0a0b14;
            border: 2px solid var(--neon-gold);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .gear-item-icon {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Lords Mobile Hub</div>
    <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" onclick="cycleTheme()"><i class="fas fa-adjust"></i> Theme</button>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
    </div>
    <nav class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="calculator.html">Speedup Calculator</a>
        <a href="gear-simulator.html" style="color: var(--neon-blue);">Gear Simulator</a>
        <a href="hunting.html">Monster Hunting</a>
        <a href="training.html">Training Calculator</a>
        <a href="meridian.html">Meridian</a>
    </nav>
</header>

<div class="simulator-container">
    <!-- Top Nav Bar matching screenshot -->
    <div class="top-nav-bar">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back</a>
        <div class="set-tabs">
            <button class="set-tab active" onclick="switchSet('set1')">Set 1</button>
            <button class="set-tab" onclick="switchSet('set2')">Set 2</button>
            <button class="set-tab" onclick="switchSet('set3')">Set 3</button>
        </div>
        <button class="btn-reset-set" onclick="resetCurrentSet()">Reset Entire Set</button>
    </div>

    <!-- Stats Summary Top Panel matching screenshot -->
    <div class="stats-summary-panel">
        <div class="stat-category-box">
            <div class="stat-category-title" style="color: #ef4444;"><i class="fas fa-sword"></i> COMBAT</div>
            <div id="combatStatsList">
                <div class="stat-row"><span>No Combat Stats Active</span><span></span></div>
            </div>
        </div>
        <div class="stat-category-box">
            <div class="stat-category-title" style="color: #3b82f6;"><i class="fas fa-shield-alt"></i> ECONOMY</div>
            <div id="economyStatsList">
                <div class="stat-row"><span>No Economy Stats Active</span><span></span></div>
            </div>
        </div>
        <div class="stat-category-box">
            <div class="stat-category-title" style="color: #a855f7;"><i class="fas fa-gem"></i> SIGILS</div>
            <div id="sigilStatsList">
                <div class="stat-row"><span>No Sigil Stats Active</span><span></span></div>
            </div>
        </div>
    </div>

    <!-- Gear Cards Grid -->
    <div class="gear-cards-grid" id="gearCardsGrid"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="gearModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Select Equipment</h3>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
            <input type="text" class="gear-search-input" id="gearSearchInput" placeholder="Search gear..." oninput="filterGearList()">
            <div class="gear-list" id="gearListContainer"></div>
        </div>
    </div>
</div>

<script src="gear-data.js"></script>
<script>
    let currentSet = 'set1';
    let currentActiveSlot = null;

    let gearSets = JSON.parse(localStorage.getItem('hem_gear_sets_v2')) || {
        set1: { 
            legs: { id: null, temper: 0 }, armor: { id: null, temper: 0 }, helmet: { id: null, temper: 0 }, main_hand: { id: null, temper: 0 }, 
            off_hand: { id: null, temper: 0 }, accessory1: { id: null, temper: 0 }, accessory2: { id: null, temper: 0 }, accessory3: { id: null, temper: 0 } 
        },
        set2: { 
            legs: { id: null, temper: 0 }, armor: { id: null, temper: 0 }, helmet: { id: null, temper: 0 }, main_hand: { id: null, temper: 0 }, 
            off_hand: { id: null, temper: 0 }, accessory1: { id: null, temper: 0 }, accessory2: { id: null, temper: 0 }, accessory3: { id: null, temper: 0 } 
        },
        set3: { 
            legs: { id: null, temper: 0 }, armor: { id: null, temper: 0 }, helmet: { id: null, temper: 0 }, main_hand: { id: null, temper: 0 }, 
            off_hand: { id: null, temper: 0 }, accessory1: { id: null, temper: 0 }, accessory2: { id: null, temper: 0 }, accessory3: { id: null, temper: 0 } 
        }
    };

    const slotDefinitions = [
        { key: 'legs', name: 'LEGS', category: 'legs' },
        { key: 'armor', name: 'ARMOR', category: 'armor' },
        { key: 'helmet', name: 'HELMET', category: 'helmet' },
        { key: 'main_hand', name: 'MAIN-HAND', category: 'main_hand' },
        { key: 'off_hand', name: 'OFF-HAND', category: 'off_hand' },
        { key: 'accessory1', name: 'ACCESSORY1', category: 'accessory' },
        { key: 'accessory2', name: 'ACCESSORY2', category: 'accessory' },
        { key: 'accessory3', name: 'ACCESSORY3', category: 'accessory' }
    ];

    function formatStatName(key) {
        const map = {
            rng_atk: 'Range ATK', rng_def: 'Range DEF', rng_hp: 'Range Max HP',
            inf_atk: 'Infantry ATK', inf_def: 'Infantry DEF', inf_hp: 'Infantry Max HP',
            cav_atk: 'Cavalry ATK', cav_def: 'Cavalry DEF', cav_hp: 'Cavalry Max HP',
            army_atk: 'Army ATK', army_def: 'Army DEF', army_hp: 'Army Max HP',
            siege_atk: 'Siege Engine ATK', siege_def: 'Siege Engine DEF', siege_hp: 'Siege Engine Max HP',
            travel_speed: 'Travel Speed', research_speed: 'Research Speed', construction_speed: 'Construction Speed',
            training_speed: 'Training Speed', gold_prod: 'Gold Production Rate', stone_prod: 'Stone Production Rate',
            timber_prod: 'Timber Production Rate', ore_prod: 'Ore Production Rate', reduce_upkeep: 'Reduce Upkeep',
            army_capacity: 'Army Capacity', wall_def_boost: 'Wall DEF Boost', trap_atk: 'Trap ATK', trap_def: 'Trap DEF'
        };
        return map[key] || key.replace(/_/g, ' ').toUpperCase();
    }

    function renderSimulator() {
        const grid = document.getElementById('gearCardsGrid');
        grid.innerHTML = '';

        slotDefinitions.forEach(slot => {
            const slotData = gearSets[currentSet][slot.key] || { id: null, temper: 0 };
            const item = findItemById(slotData.id, slot.category);

            const card = document.createElement('div');
            card.className = 'gear-card';
            card.innerHTML = `
                <div class="gear-card-title">${slot.name}</div>
                <div class="gear-card-img-box" onclick="openModal('${slot.key}', '${slot.category}', '${slot.name}')">
                    ${item ? `<img src="${item.image}" alt="${item.name}" title="${item.name}">` : `<i class="fas fa-plus plus-icon"></i>`}
                </div>
                <div class="gear-card-controls">
                    <div class="temper-select-wrap">
                        <span>Temper:</span>
                        <select class="temper-select" onchange="updateTemper('${slot.key}', this.value)">
                            ${[...Array(13)].map((_, i) => `<option value="${i}" ${slotData.temper === i ? 'selected' : ''}>+${i}</option>`).join('')}
                        </select>
                    </div>
                    <button class="btn-card-action" onclick="openModal('${slot.key}', '${slot.category}', '${slot.name}')">Sockets</button>
                    ${item ? `<button class="btn-card-clear" onclick="clearSlot('${slot.key}')">Clear</button>` : `<button class="btn-card-action" onclick="openModal('${slot.key}', '${slot.category}', '${slot.name}')">Select</button>`}
                </div>
            `;
            grid.appendChild(card);
        });

        calculateStats();
    }

    function findItemById(id, category) {
        if (!id || !gearData[category]) return null;
        return gearData[category].find(i => i.id === id) || null;
    }

    function switchSet(setName) {
        currentSet = setName;
        document.querySelectorAll('.set-tab').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        renderSimulator();
    }

    function resetCurrentSet() {
        gearSets[currentSet] = { 
            legs: { id: null, temper: 0 }, armor: { id: null, temper: 0 }, helmet: { id: null, temper: 0 }, main_hand: { id: null, temper: 0 }, 
            off_hand: { id: null, temper: 0 }, accessory1: { id: null, temper: 0 }, accessory2: { id: null, temper: 0 }, accessory3: { id: null, temper: 0 } 
        };
        saveAndRender();
    }

    function clearSlot(slotKey) {
        gearSets[currentSet][slotKey] = { id: null, temper: 0 };
        saveAndRender();
    }

    function updateTemper(slotKey, val) {
        gearSets[currentSet][slotKey].temper = parseInt(val) || 0;
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('hem_gear_sets_v2', JSON.stringify(gearSets));
        renderSimulator();
    }

    function openModal(slotKey, category, slotName) {
        currentActiveSlot = { slotKey, category };
        document.getElementById('modalTitle').innerText = `Select ${slotName}`;
        document.getElementById('gearSearchInput').value = '';
        renderGearList(category);
        document.getElementById('gearModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('gearModal').classList.remove('active');
    }

    function renderGearList(category, filterText = '') {
        const listContainer = document.getElementById('gearListContainer');
        listContainer.innerHTML = '';

        const items = gearData[category] || [];
        const filtered = items.filter(i => i.name.toLowerCase().includes(filterText.toLowerCase()));

        if (filtered.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; padding:15px; color:var(--text-secondary);">No gear found</div>`;
            return;
        }

        filtered.forEach(item => {
            const row = document.createElement('div');
            row.className = 'gear-item-row';
            row.onclick = () => selectGear(item.id);

            let statsHtml = '';
            if (item.stats) {
                const allStats = { ...(item.stats.combat || {}), ...(item.stats.economy || {}), ...(item.stats.sigils || {}) };
                for (const [k, v] of Object.entries(allStats)) {
                    statsHtml += `<div style="color:var(--text-secondary); font-size:0.78rem;">${formatStatName(k)}: +${v}%</div>`;
                }
            }

            row.innerHTML = `
                <div class="gear-item-icon-wrap">
                    <img src="${item.image}" class="gear-item-icon" alt="${item.name}">
                </div>
                <div style="flex:1;">
                    <div style="font-weight:700; font-size:0.95rem; color:var(--neon-blue);">${item.name}</div>
                    <div style="font-size:0.8rem; color:var(--neon-gold); margin-bottom:4px;">${item.rarity} • LVL ${item.level}</div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:2px;">${statsHtml || '<span style="color:var(--text-secondary); font-size:0.8rem;">No stats</span>'}</div>
                </div>
            `;
            listContainer.appendChild(row);
        });
    }

    function filterGearList() {
        const q = document.getElementById('gearSearchInput').value;
        if (currentActiveSlot) renderGearList(currentActiveSlot.category, q);
    }

    function selectGear(id) {
        if (!currentActiveSlot) return;
        gearSets[currentSet][currentActiveSlot.slotKey].id = id;
        closeModal();
        saveAndRender();
    }

    function calculateStats() {
        const set = gearSets[currentSet];
        const combat = {};
        const economy = {};
        const sigil = {};

        slotDefinitions.forEach(slot => {
            const slotData = set[slot.key];
            if (!slotData || !slotData.id) return;
            const item = findItemById(slotData.id, slot.category);
            if (!item || !item.stats) return;

            // Temper multiplier (each temper level adds ~5% or as standard)
            const temperMult = 1 + (slotData.temper * 0.05);

            if (item.stats.combat) {
                for (const [k, v] of Object.entries(item.stats.combat)) {
                    combat[k] = (combat[k] || 0) + (v * temperMult);
                }
            }
            if (item.stats.economy) {
                for (const [k, v] of Object.entries(item.stats.economy)) {
                    economy[k] = (economy[k] || 0) + (v * temperMult);
                }
            }
            if (item.stats.sigils) {
                for (const [k, v] of Object.entries(item.stats.sigils)) {
                    sigil[k] = (sigil[k] || 0) + (v * temperMult);
                }
            }
        });

        renderStatsBox('combatStatsList', combat);
        renderStatsBox('economyStatsList', economy);
        renderStatsBox('sigilStatsList', sigil);
    }

    function renderStatsBox(elementId, statsObj) {
        const el = document.getElementById(elementId);
        if (Object.keys(statsObj).length === 0) {
            el.innerHTML = `<div class="stat-row"><span>No Active Stats</span><span></span></div>`;
            return;
        }
        el.innerHTML = '';
        for (const [k, v] of Object.entries(statsObj)) {
            el.innerHTML += `<div class="stat-row"><span>${formatStatName(k)}</span><span>${v.toFixed(2).replace(/\.00$/, '')}%</span></div>`;
        }
    }

    function cycleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        let next = (current === 'dark' || current === '') ? 'tactical' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('hem_theme', next);
    }

    window.onload = () => {
        const savedTheme = localStorage.getItem('hem_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        renderSimulator();
    };
</script>
</body>
</html>
