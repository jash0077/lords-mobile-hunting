<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gear Sim — HEM Guild</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #E8B34E;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 15px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .container {
            flex: 1;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Set Selection */
        .set-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .set-tab {
            flex: 1;
            padding: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .set-tab.active {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(232, 179, 78, 0.1);
        }

        /* Hero Area */
        .sim-area {
            background: var(--card);
            border-radius: 20px;
            padding: 30px;
            position: relative;
            display: grid;
            grid-template-columns: 80px 1fr 80px;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .hero-visual {
            text-align: center;
            font-size: 80px;
            color: var(--text-dim);
            opacity: 0.3;
        }

        .slot {
            width: 70px;
            height: 70px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }

        .slot:hover {
            border-color: var(--primary);
        }

        .slot.has-item {
            border-color: var(--primary);
            background: rgba(232, 179, 78, 0.05);
        }

        .slot-icon { font-size: 24px; margin-bottom: 4px; }
        .slot-name { font-size: 9px; text-transform: uppercase; color: var(--text-dim); text-align: center; }
        
        .item-name-overlay {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: var(--primary);
            white-space: nowrap;
            font-weight: bold;
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .side-slots {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .bottom-slots {
            grid-column: 1 / span 3;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        /* Stats Bar */
        .stats-summary {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 5px 0;
            border-bottom: 1px solid var(--border);
        }

        .stat-val {
            color: var(--primary);
            font-weight: bold;
        }

        /* Selection Modal */
        .modal {
            display: none;
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            flex-direction: column;
            justify-content: flex-end;
        }

        .modal-content {
            background: var(--card);
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            background: var(--card);
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .item-row {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-row:hover { background: rgba(255,255,255,0.05); }

        .item-info h4 { margin: 0; font-size: 16px; }
        .item-info p { margin: 5px 0 0; font-size: 12px; color: var(--text-dim); }

        .clear-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
        }

        @media (max-width: 400px) {
            .sim-area { padding: 15px; grid-template-columns: 70px 1fr 70px; }
            .slot { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

<header>
    <a href="trap-guide.html" class="back-btn"><i class="fas fa-chevron-left"></i> BACK</a>
    <div style="font-weight: bold;">GEAR SIMULATOR</div>
    <div style="width: 50px;"></div>
</header>

<div class="container">
    <div class="set-tabs">
        <div class="set-tab active" onclick="loadPreset('mixed')">Mixed Set</div>
        <div class="set-tab" onclick="loadPreset('f2p')">F2P Trap</div>
        <div class="set-tab" onclick="loadPreset('rally')">Rally Trap</div>
    </div>

    <div class="sim-area">
        <div class="side-slots">
            <div class="slot" id="slot-Main Hand" onclick="openPicker('Main Hand')">
                <span class="slot-icon">🗡️</span>
                <span class="slot-name">Weapon</span>
                <div class="item-name-overlay" id="name-Main Hand"></div>
            </div>
            <div class="slot" id="slot-Armor" onclick="openPicker('Armor')">
                <span class="slot-icon">👕</span>
                <span class="slot-name">Armor</span>
                <div class="item-name-overlay" id="name-Armor"></div>
            </div>
            <div class="slot" id="slot-Acc-1" onclick="openPicker('Accessory', 1)">
                <span class="slot-icon">💍</span>
                <span class="slot-name">Acc 1</span>
                <div class="item-name-overlay" id="name-Acc-1"></div>
            </div>
        </div>

        <div class="hero-visual">
            <i class="fas fa-shield-halved"></i>
        </div>

        <div class="side-slots">
            <div class="slot" id="slot-Helmet" onclick="openPicker('Helmet')">
                <span class="slot-icon">🪖</span>
                <span class="slot-name">Helm</span>
                <div class="item-name-overlay" id="name-Helmet"></div>
            </div>
            <div class="slot" id="slot-Off-Hand" onclick="openPicker('Off-Hand')">
                <span class="slot-icon">🛡️</span>
                <span class="slot-name">Off-Hand</span>
                <div class="item-name-overlay" id="name-Off-Hand"></div>
            </div>
            <div class="slot" id="slot-Acc-2" onclick="openPicker('Accessory', 2)">
                <span class="slot-icon">💍</span>
                <span class="slot-name">Acc 2</span>
                <div class="item-name-overlay" id="name-Acc-2"></div>
            </div>
        </div>

        <div class="bottom-slots">
            <div class="slot" id="slot-Legs" onclick="openPicker('Legs')">
                <span class="slot-icon">👖</span>
                <span class="slot-name">Legs</span>
                <div class="item-name-overlay" id="name-Legs"></div>
            </div>
            <div class="slot" id="slot-Acc-3" onclick="openPicker('Accessory', 3)">
                <span class="slot-icon">💍</span>
                <span class="slot-name">Acc 3</span>
                <div class="item-name-overlay" id="name-Acc-3"></div>
            </div>
        </div>
    </div>

    <div class="stats-summary">
        <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;">Total Attribute Boosts</div>
        <div class="stats-grid" id="stats-grid">
            <!-- Stats will appear here -->
        </div>
        <button class="clear-btn" onclick="clearAll()">RESET ALL</button>
    </div>
</div>

<div class="modal" id="pickerModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="pickerTitle">Select Item</h3>
            <i class="fas fa-times" onclick="closePicker()" style="cursor:pointer; font-size: 20px;"></i>
        </div>
        <div id="pickerList"></div>
    </div>
</div>

<script src="gear-data.js"></script>
<script>
    let currentSet = {
        "Main Hand": null,
        "Off-Hand": null,
        "Helmet": null,
        "Armor": null,
        "Legs": null,
        "Acc-1": null,
        "Acc-2": null,
        "Acc-3": null
    };

    let activeSlot = null;
    let activeAccIdx = null;

    function openPicker(type, accIdx = null) {
        activeSlot = type;
        activeAccIdx = accIdx;
        const modal = document.getElementById('pickerModal');
        const list = document.getElementById('pickerList');
        const title = document.getElementById('pickerTitle');
        
        title.innerText = type + (accIdx ? ' ' + accIdx : '');
        list.innerHTML = '<div class="item-row" onclick="selectItem(null)"><h4>None</h4></div>';
        
        gearData[type].forEach(item => {
            const row = document.createElement('div');
            row.className = 'item-row';
            let statsStr = Object.entries(item.stats).map(([k,v]) => `${k} +${v}%`).join(', ');
            row.innerHTML = `
                <div class="item-info">
                    <h4>${item.name}</h4>
                    <p>${statsStr}</p>
                </div>
                <i class="fas fa-plus" style="color:var(--primary)"></i>
            `;
            row.onclick = () => selectItem(item);
            list.appendChild(row);
        });
        
        modal.style.display = 'flex';
    }

    function closePicker() {
        document.getElementById('pickerModal').style.display = 'none';
    }

    function selectItem(item) {
        const key = activeAccIdx ? `Acc-${activeAccIdx}` : activeSlot;
        currentSet[key] = item;
        
        const slotEl = document.getElementById(`slot-${key}`);
        const nameEl = document.getElementById(`name-${key}`);
        
        if (item) {
            slotEl.classList.add('has-item');
            nameEl.innerText = item.name;
        } else {
            slotEl.classList.remove('has-item');
            nameEl.innerText = '';
        }
        
        closePicker();
        updateStats();
    }

    function updateStats() {
        const totals = {};
        Object.values(currentSet).forEach(item => {
            if (item) {
                Object.entries(item.stats).forEach(([k, v]) => {
                    totals[k] = (totals[k] || 0) + v;
                });
            }
        });

        const grid = document.getElementById('stats-grid');
        grid.innerHTML = '';
        
        const importantStats = [
            "Infantry ATK", "Ranged ATK", "Cavalry ATK",
            "Army HP", "Army DEF", "Infantry HP", "Cavalry HP"
        ];

        importantStats.forEach(stat => {
            if (totals[stat]) {
                const div = document.createElement('div');
                div.className = 'stat-item';
                div.innerHTML = `<span>${stat}</span><span class="stat-val">+${totals[stat].toFixed(1)}%</span>`;
                grid.appendChild(div);
            }
        });
        
        if (grid.innerHTML === '') {
            grid.innerHTML = '<div style="grid-column: 1/span 2; text-align:center; color:var(--text-dim); padding: 20px;">No gear selected</div>';
        }
    }

    function clearAll() {
        Object.keys(currentSet).forEach(k => {
            currentSet[k] = null;
            const slotEl = document.getElementById(`slot-${k}`);
            const nameEl = document.getElementById(`name-${k}`);
            slotEl.classList.remove('has-item');
            nameEl.innerText = '';
        });
        updateStats();
    }

    function loadPreset(type) {
        clearAll();
        document.querySelectorAll('.set-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');

        const find = (slot, name) => gearData[slot].find(i => i.name === name);

        if (type === 'mixed') {
            selectItemManual('Main Hand', find('Main Hand', 'Frostwing Greatsword'));
            selectItemManual('Off-Hand', find('Off-Hand', 'Winter Mittens'));
            selectItemManual('Helmet', find('Helmet', 'Bumblehelm'));
            selectItemManual('Armor', find('Armor', 'Firewall Plate'));
            selectItemManual('Legs', find('Legs', 'Storm Tasset'));
            selectItemManual('Acc-1', find('Accessory', 'Burning Scroll'));
            selectItemManual('Acc-2', find('Accessory', 'Burning Scroll'));
            selectItemManual('Acc-3', find('Accessory', 'Burning Scroll'));
        } else if (type === 'f2p') {
            selectItemManual('Main Hand', find('Main Hand', 'Frostwing Greatsword'));
            selectItemManual('Off-Hand', find('Off-Hand', 'Call of the Deep'));
            selectItemManual('Helmet', find('Helmet', 'Beast Helmet'));
            selectItemManual('Armor', find('Armor', 'Terror Shield'));
            selectItemManual('Legs', find('Legs', 'Dragon\'s Stride'));
            selectItemManual('Acc-1', find('Accessory', 'Ring of Ancients'));
            selectItemManual('Acc-2', find('Accessory', 'Ring of Ancients'));
            selectItemManual('Acc-3', find('Accessory', 'Ring of Ancients'));
        } else if (type === 'rally') {
            selectItemManual('Main Hand', find('Main Hand', 'Skullcrusher'));
            selectItemManual('Off-Hand', find('Off-Hand', 'Winter Mittens'));
            selectItemManual('Helmet', find('Helmet', 'Bumblehelm'));
            selectItemManual('Armor', find('Armor', 'Firewall Plate'));
            selectItemManual('Legs', find('Legs', 'Storm Tasset'));
            selectItemManual('Acc-1', find('Accessory', 'Ambrosial Cup'));
            selectItemManual('Acc-2', find('Accessory', 'Ambrosial Cup'));
            selectItemManual('Acc-3', find('Accessory', 'Ambrosial Cup'));
        }
    }

    function selectItemManual(key, item) {
        currentSet[key] = item;
        const slotEl = document.getElementById(`slot-${key}`);
        const nameEl = document.getElementById(`name-${key}`);
        if (item) {
            slotEl.classList.add('has-item');
            nameEl.innerText = item.name;
        }
        updateStats();
    }

    window.onload = () => loadPreset('mixed');
</script>

</body>
</html>
