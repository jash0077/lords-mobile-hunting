<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gem Prediction - Lords Mobile Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        html, body { overflow-x: hidden; width: 100%; }
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: var(--bg-primary, #f4f4f4); text-align: center; margin: 0; padding: 10px; color: var(--text-primary, #333); }
        
        .container { max-width: 900px; margin: auto; background: var(--bg-surface, white); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { margin-top: 5px; font-size: 24px; color: var(--text-primary, #222); }
        h2 { margin-top: 5px; color: var(--text-secondary, #444); }
        
        .menu-btn { display: block; width: 100%; max-width: 280px; margin: 10px auto; padding: 12px; border: none; border-radius: 8px; background: #007bff; color: white; cursor: pointer; font-weight: bold; font-size: 15px; transition: background 0.2s, transform 0.1s; }
        .menu-btn:hover { background: #0056b3; transform: translateY(-1px); }
        
        .tool-input { display: block; width: 100%; max-width: 280px; margin: 10px auto; padding: 12px; border: 1px solid var(--border-subtle, #ccc); border-radius: 6px; text-align: center; font-size: 14px; background: var(--bg-surface, #fff); color: var(--text-primary, #333); transition: border-color 0.2s; }
        .tool-input:focus { outline: none; border-color: #007bff; }
        
        .guide { display: none; background: var(--bg-secondary, #eef); padding: 15px; border-radius: 6px; margin: 15px auto; font-size: 14px; max-width: 280px; border: 1px solid var(--border-primary, #ccd); text-align: left; color: var(--text-primary, #333); }
        .guide.show { display: block; }

        .adv-group { display: none; background: var(--bg-secondary, #fdfdfd); padding: 10px; border-radius: 6px; margin: -5px auto 15px auto; max-width: 280px; border: 1px dashed var(--border-primary, #bbb); }
        .adv-label { display: block; font-size: 11px; color: var(--text-secondary, #888); font-weight: bold; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .adv-group .tool-input { margin: 6px auto; padding: 10px; }

        /* Result Overlay */
        .resultTab { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .resultBox { background: var(--bg-surface, white); padding: 25px; border-radius: 12px; width: 100%; max-width: 360px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.4); color: var(--text-primary, #333); text-align: left; }
        .closeBtn { position: absolute; right: 15px; top: 10px; font-weight: bold; cursor: pointer; color: red; font-size: 20px; }
        .closeBtn:hover { transform: scale(1.1); }
        .resultGrid { display: grid; grid-template-columns: 1fr auto; row-gap: 8px; margin-top: 15px; font-size: 15px; }
        .resultGrid div { text-align: left; display: flex; align-items: center; gap: 8px; font-weight: 500; }
        .totalRow { margin-top: 15px; padding-top: 10px; border-top: 2px solid var(--border-subtle, #ccc); font-weight: 800; display: grid; grid-template-columns: 1fr auto; color: #007bff; font-size: 18px; }
    </style>
</head>
<body>

<header style="margin-bottom: 15px;">
    <div class="logo">Lords Mobile Hub</div>
    <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" onclick="cycleTheme()"><i class="fas fa-adjust"></i> Theme</button>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
    </div>
    <nav class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="calculator.html">Speedup Calculator</a>
        <a href="gem-prediction.html" style="color: var(--neon-blue);">Gem Prediction</a>
        <a href="chaos-arena.html">Chaos Arena</a>
        <a href="hunting.html">Monster Hunting</a>
        <a href="meridian.html">Meridian</a>
    </nav>
</header>

<div class="container">
    <div style="text-align: left; margin-bottom: 10px;">
        <a href="index.html" class="menu-btn" style="background:#6c757d; max-width:120px; margin:0; padding:8px 12px; font-size:13px; text-decoration:none; display:inline-block; text-align:center;">← Back</a>
    </div>

    <h2>Gem Prediction</h2>
    <button class="menu-btn" onclick="toggleGuide('gemGuide')" style="max-width:150px; padding:8px; font-size:12px;">Toggle Guide</button>
    <div id="gemGuide" class="guide">Enter your Estimated Gems or What you usually get from each source.</div>
    
    <input class="tool-input" id="colo" placeholder="Colosseum Gems (Every 3h)">
    <input class="tool-input" id="guild" placeholder="Daily Guild Gifts">
    <input class="tool-input" id="monster" placeholder="Daily Monster Hunt">
    <input class="tool-input" id="eventgems" placeholder="Base Weekly Events (Tap for more)" onfocus="revealAdv('advEvents')">
    
    <div id="advEvents" class="adv-group">
        <span class="adv-label">Detailed Events (Multipliers applied automatically)</span>
        <input class="tool-input" id="kParagon" placeholder="Kingdom Paragon">
        <input class="tool-input" id="hellEv" placeholder="Hell Events">
        <input class="tool-input" id="gDuel" placeholder="Guild Duel">
        <input class="tool-input" id="otherEv" placeholder="Other Events">
    </div>

    <input class="tool-input" id="treasure" placeholder="Treasure Trove Deposit (Tap for int.)" onfocus="revealAdv('advTrove')">
    
    <div id="advTrove" class="adv-group">
         <span class="adv-label">Trove Interest Rates</span>
        <input class="tool-input" id="basic" placeholder="Basic Interest %">
        <input class="tool-input" id="bonus" placeholder="Bonus Interest %">
    </div>

    <button class="menu-btn" onclick="calculateGems()">Predict 30 Days</button>
    <button class="menu-btn" onclick="clearInputs('gemTool')" style="background:#6c757d">Clear All</button>
</div>

<!-- Result Overlay Modal -->
<div id="resultTab" class="resultTab">
    <div class="resultBox">
        <span class="closeBtn" onclick="closeResult()">×</span>
        <div id="resultContent"></div>
    </div>
</div>

<script>
    function toggleGuide(id){
        let g = document.getElementById(id);
        g.style.display = (g.style.display === "block") ? "none" : "block";
    }

    function revealAdv(id){
        document.getElementById(id).style.display = "block";
    }

    function showResult(content){
        document.getElementById("resultContent").innerHTML = content;
        document.getElementById("resultTab").style.display = "flex";
    }

    function closeResult(){ 
        document.getElementById("resultTab").style.display = "none"; 
    }

    function parseInput(id){
        let el = document.getElementById(id);
        if(!el) return 0;
        let v = el.value.replace(/,/g,'');
        return Number(v)||0;
    }

    function formatInput(input){
        let v = input.value.replace(/[^0-9]/g,'');
        if(v === ""){ input.value = ""; return; }
        input.value = Number(v).toLocaleString();
    }

    document.querySelectorAll(".tool-input").forEach(i => {
        i.addEventListener("input", () => { if(i.type !== 'number' && i.type !== 'checkbox') formatInput(i); });
    });

    function clearInputs(toolId){
        document.querySelectorAll("input").forEach(i => { 
            if(i.type === 'checkbox') i.checked = false;
            else i.value = ""; 
        });
        document.getElementById('advEvents').style.display = 'none';
        document.getElementById('advTrove').style.display = 'none';
    }

    function calculateGems(){
        let colo = parseInput("colo"), guild = parseInput("guild"), monster = parseInput("monster");
        let evBase = parseInput("eventgems") * 4;
        let p = parseInput("kParagon") * 3;
        let h = parseInput("hellEv") * 10;
        let g = parseInput("gDuel") * 2;
        let o = parseInput("otherEv");
        let rEvent = evBase + p + h + g + o;
        let tr = parseInput("treasure"), ba = parseInput("basic"), bo = parseInput("bonus");
        let rColo = Math.floor(colo * 8 * 30), rGuild = Math.floor(guild * 30), rMonster = Math.floor(monster * 15), rTreasure = Math.floor(tr * (100 + ba + bo) / 100);
        let total = rColo + rGuild + rMonster + rEvent + rTreasure;
        showResult("<h3>30-Day Forecast</h3><div class='resultGrid'><div>Colosseum</div><span>"+rColo.toLocaleString()+"</span><div>Guild</div><span>"+rGuild.toLocaleString()+"</span><div>Monster</div><span>"+rMonster.toLocaleString()+"</span><div>Event</div><span>"+rEvent.toLocaleString()+"</span><div>Treasure</div><span>"+rTreasure.toLocaleString()+"</span></div><div class='totalRow'><div>TOTAL GEMS</div><span>"+total.toLocaleString()+"</span></div>");
    }

    function cycleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        let next = (current === 'dark' || current === '') ? 'tactical' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('hem_theme', next);
    }

    window.onload = () => {
        const savedTheme = localStorage.getItem('hem_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    };
</script>
</body>
</html>
