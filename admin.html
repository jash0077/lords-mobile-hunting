<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard Admin</title><style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    margin:0;
    padding:20px;
}

.login-box,
.admin-panel{
    max-width:800px;
    margin:auto;
    background:#222;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin:5px 0;
    border:none;
    border-radius:5px;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.add-btn{
    background:green;
    color:white;
}

.delete-btn{
    background:red;
    color:white;
}

.logout-btn{
    background:orange;
    color:white;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #444;
    padding:10px;
    text-align:center;
}

th{
    background:#333;
}
</style></head>
<body><div class="login-box" id="loginBox">
<h2>Admin Login</h2><input type="password"
id="password"
placeholder="Password">

<button onclick="login()">Login</button>

<p id="error"></p>
</div><div class="admin-panel"
id="adminPanel"
style="display:none;"><h2>🏆 Leaderboard Admin</h2><button class="logout-btn"
onclick="logout()">
Logout
</button>

<input
type="text"
id="search"
placeholder="Search Player"
onkeyup="searchPlayer()">

<input
type="text"
id="playerName"
placeholder="Player Name">

<input
type="text"
id="playerKills"
placeholder="Kills">

<button
class="add-btn"
onclick="addPlayer()">
Add Player
</button>

<table>
<thead>
<tr>
<th>Rank</th>
<th>Player</th>
<th>Kills</th>
<th>Delete</th>
</tr>
</thead><tbody id="playerTable">
</tbody></table>
</div>
<script>
const ADMIN_PASS = "52389012@Om";

let players = JSON.parse(localStorage.getItem("players")) || [];

function login() {
    const pass = document.getElementById("password").value;

    if(pass === ADMIN_PASS){
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadPlayers();
    } else {
        document.getElementById("error").innerText = "Wrong Password";
    }
}

function logout() {
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("adminPanel").style.display = "none";
}

function addPlayer() {

    const name = document.getElementById("playerName").value;
    const kills = document.getElementById("playerKills").value;

    if(name === "" || kills === ""){
        alert("Enter player name and kills");
        return;
    }

    players.push({
        name:name,
        kills:kills
    });

    localStorage.setItem(
        "players",
        JSON.stringify(players)
    );

    document.getElementById("playerName").value = "";
    document.getElementById("playerKills").value = "";

    loadPlayers();
}

function deletePlayer(index){

    players.splice(index,1);

    localStorage.setItem(
        "players",
        JSON.stringify(players)
    );

    loadPlayers();
}

function loadPlayers(){

    let table = document.getElementById("playerTable");

    table.innerHTML = "";

    players.sort((a,b)=>{

        return parseFloat(b.kills) -
               parseFloat(a.kills);

    });

    players.forEach((player,index)=>{

        table.innerHTML += `
        <tr>
            <td>${index+1}</td>
            <td>${player.name}</td>
            <td>${player.kills}</td>
            <td>
                <button
                class="delete-btn"
                onclick="deletePlayer(${index})">
                Delete
                </button>
            </td>
        </tr>
        `;

    });
}

function searchPlayer(){

    let filter =
    document.getElementById("search")
    .value.toLowerCase();

    let rows =
    document.querySelectorAll("#playerTable tr");

    rows.forEach(row=>{

        let text =
        row.innerText.toLowerCase();

        row.style.display =
        text.includes(filter)
        ? ""
        : "none";

    });
}
</script></body>
</html>
