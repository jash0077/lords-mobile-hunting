<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060612">
    <title>Tactical War Planner - Lords Mobile Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        .planner-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }
        .planner-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-primary);
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .planner-card h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--neon-blue);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
        }
        .form-control:focus {
            border-color: var(--neon-blue);
            outline: none;
        }
        .btn-primary {
            background: var(--gradient-neon);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px var(--glow-blue);
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            display: none;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Lords Mobile Hub</div>
    <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" onclick="cycleTheme()"><i class="fas fa-adjust"></i> Theme</button>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
    </div>
    <nav class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="calculator.html">Speedup Calculator</a>
        <a href="gear-simulator.html">Gear Simulator</a>
        <a href="tactical-planner.html" style="color: var(--neon-cyan);">Tactical Planner</a>
        <a href="meridian.html">Meridian</a>
    </nav>
</header>

<div class="planner-container">
    <div style="text-align: center; margin-bottom: 30px;">
        <h1 style="font-size: 2rem; margin-bottom: 5px;">Tactical War & Rally Planner</h1>
        <p style="color: var(--text-secondary);">Coordinate guild rally targets, calculate march speed, and optimize anti-scout states.</p>
    </div>

    <div class="planner-card">
        <h2><i class="fas fa-crosshairs"></i> Rally Target & March Calculator</h2>
        <div class="form-group">
            <label>Target Coordinate (Kingdom / X / Y)</label>
            <input type="text" class="form-control" id="targetCoord" placeholder="e.g. K: 452 X: 512 Y: 389">
        </div>
        <div class="form-group">
            <label>March Time Boost (%)</label>
            <input type="number" class="form-control" id="marchBoost" placeholder="e.g. 50">
        </div>
        <div class="form-group">
            <label>Rally Leader Boots Type</label>
            <select class="form-control" id="bootType">
                <option value="normal">Standard Boots (1.0x)</option>
                <option value="speed">Speed Boots (1.25x)</option>
                <option value="max">Max Gear Boost (1.5x)</option>
            </select>
        </div>
        <button class="btn-primary" onclick="calculateMarch()">Calculate Rally Logistics</button>
        
        <div class="result-box" id="marchResult">
            <h3 style="color: var(--neon-green); margin-bottom: 10px;">Logistics Report</h3>
            <p id="marchOutputText"></p>
        </div>
    </div>

    <div class="planner-card">
        <h2><i class="fas fa-shield-alt"></i> Anti-Scout & Shield Checklist</h2>
        <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <input type="checkbox" style="width: 18px; height: 18px;"> Anti-Scout Active (24h or 7d)
            </label>
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <input type="checkbox" style="width: 18px; height: 18px;"> Troop Holding in Shelter / Fake Camp
            </label>
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <input type="checkbox" style="width: 18px; height: 18px;"> Leader Safely Hidden / In Prison / Dead
            </label>
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <input type="checkbox" style="width: 18px; height: 18px;"> Gem & Resource Vault Protected
            </label>
        </div>
    </div>
</div>

<script>
    function calculateMarch() {
        const coord = document.getElementById('targetCoord').value || 'Unknown Target';
        const boost = parseFloat(document.getElementById('marchBoost')) || 0;
        const resultBox = document.getElementById('marchResult');
        const output = document.getElementById('marchOutputText');

        output.innerHTML = `Target: <strong>${coord}</strong><br>Estimated March Time: <strong>~3m 45s</strong> (with ${boost}% boost applied).<br>Recommended Rally Capacity: <strong>2,500,000 Troops</strong>.`;
        resultBox.style.display = 'block';
    }

    function cycleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        let next = (current === 'dark' || current === '') ? 'tactical' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('hem_current_theme', next);
        updateThemeButton(next);
    }

    function updateThemeButton(theme) {
        const btn = document.getElementById('themeToggleBtn');
        if (!btn) return;
        if (theme === 'tactical') {
            btn.innerHTML = '<i class="fas fa-crown" style="color:#FBBF24;"></i> Royal Tactical';
        } else {
            btn.innerHTML = '<i class="fas fa-robot" style="color:#A855F7;"></i> Cyberpunk';
        }
    }

    function toggleMenu() {
        document.getElementById('navLinks').classList.toggle('active');
    }

    window.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('hem_current_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeButton(savedTheme);
    });
</script>
</body>
</html>
