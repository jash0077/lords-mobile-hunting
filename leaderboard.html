<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild Kill Leaderboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f172a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .month-dropdown {
            padding: 10px 15px;
            background: #1e293b;
            border: 2px solid #2563eb;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .month-dropdown:hover {
            background: #334155;
            border-color: #3b82f6;
        }

        .search-box {
            padding: 10px 15px;
            background: #1e293b;
            border: 2px solid #2563eb;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            min-width: 200px;
        }

        .search-box::placeholder {
            color: #94a3b8;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }

        .nav-tabs button {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .nav-tabs button.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
        }

        .nav-tabs button:hover {
            color: #3b82f6;
        }

        /* Podium Section */
        .podium-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .podium-card {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .podium-card.gold {
            border-color: #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }

        .podium-card.silver {
            border-color: #e5e7eb;
            box-shadow: 0 0 20px rgba(229, 231, 235, 0.2);
        }

        .podium-card.bronze {
            border-color: #d97706;
            box-shadow: 0 0 20px rgba(217, 119, 6, 0.3);
        }

        .podium-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, currentColor, transparent);
        }

        .podium-rank {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .podium-card.gold .podium-rank {
            color: #fbbf24;
        }

        .podium-card.silver .podium-rank {
            color: #e5e7eb;
        }

        .podium-card.bronze .podium-rank {
            color: #d97706;
        }

        .podium-player-name {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            cursor: pointer;
            color: #e0e7ff;
            transition: color 0.3s;
        }

        .podium-player-name:hover {
            color: #2563eb;
            text-decoration: underline;
        }

        .podium-stats {
            font-size: 0.9em;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .podium-stat-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .podium-stat-label {
            color: #94a3b8;
        }

        .podium-stat-value {
            font-weight: bold;
            color: #e0e7ff;
        }

        /* Guild Stats Section */
        .guild-stats-section {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border: 2px solid #2563eb;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .stat-card {
            text-align: center;
            padding: 15px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
            border: 1px solid #475569;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #2563eb;
        }

        /* Leaderboard Table */
        .leaderboard-section {
            display: none;
        }

        .leaderboard-section.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        th {
            background: #2563eb;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: white;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #334155;
        }

        tr:hover {
            background: #334155;
        }

        .rank-cell {
            font-weight: bold;
            text-align: center;
            min-width: 60px;
        }

        .rank-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            margin-left: 5px;
        }

        .rank-badge.r5 {
            background: #fbbf24;
            color: #000;
        }

        .rank-badge.r4 {
            background: #f97316;
            color: #fff;
        }

        .rank-badge.r3 {
            background: #ef4444;
            color: #fff;
        }

        .rank-badge.r2 {
            background: #8b5cf6;
            color: #fff;
        }

        .rank-badge.r1 {
            background: #06b6d4;
            color: #fff;
        }

        .player-name {
            cursor: pointer;
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }

        .player-name:hover {
            color: #3b82f6;
            text-decoration: underline;
        }

        .gold-text {
            color: #fbbf24;
            font-weight: bold;
        }

        .silver-text {
            color: #e5e7eb;
            font-weight: bold;
        }

        .bronze-text {
            color: #d97706;
            font-weight: bold;
        }

        /* Guild Fest Section */
        .guild-fest-section {
            display: none;
        }

        .guild-fest-section.active {
            display: block;
        }

        .guild-fest-table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        /* Player Profile Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border: 2px solid #2563eb;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ef4444;
            border: none;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #475569;
        }

        .profile-name {
            font-size: 2em;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .profile-rank {
            font-size: 1.1em;
            color: #cbd5e1;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .profile-stat {
            background: rgba(15, 23, 42, 0.5);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #475569;
        }

        .profile-stat-label {
            color: #94a3b8;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .profile-stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #2563eb;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #2563eb;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            h1 {
                font-size: 1.5em;
            }

            .header-controls {
                width: 100%;
                flex-direction: column;
            }

            .search-box {
                width: 100%;
                min-width: unset;
            }

            .month-dropdown {
                width: 100%;
            }

            .podium-section {
                grid-template-columns: 1fr;
            }

            .guild-stats-section {
                grid-template-columns: repeat(2, 1fr);
            }

            .profile-stats {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.9em;
            }

            td, th {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 Guild Kill Leaderboard</h1>
            <div class="header-controls">
                <select id="monthDropdown" class="month-dropdown">
                    <option value="">All Months</option>
                </select>
                <input type="text" id="searchInput" class="search-box" placeholder="Search Player...">
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="tab-btn active" data-tab="leaderboard">Leaderboard</button>
            <button class="tab-btn" data-tab="guild-fest">Guild Fest Ranking</button>
            <button class="tab-btn" data-tab="monthly-summary">Monthly Summary</button>
        </div>

        <!-- Podium Section -->
        <div id="podiumContainer" class="podium-section"></div>

        <!-- Guild Statistics Section -->
        <div id="guildStatsContainer" class="guild-stats-section"></div>

        <!-- Leaderboard Table Section -->
        <div id="leaderboardSection" class="leaderboard-section active">
            <table id="leaderboardTable">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th>Might</th>
                        <th>Player Kill</th>
                        <th>Kills Increase</th>
                        <th>Might Loss</th>
                        <th>Might Gain</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Guild Fest Section -->
        <div id="guildFestSection" class="guild-fest-section">
            <table id="guildFestTable" class="guild-fest-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th>Guild Fest Points</th>
                        <th>Kills</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Monthly Summary Section -->
        <div id="monthlySummarySection" class="guild-fest-section">
            <table id="monthlySummaryTable">
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Total Kills</th>
                        <th>Total Might Loss</th>
                        <th>Total Might Gain</th>
                        <th>Active Players</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Player Profile Modal -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeProfile()">&times;</button>
            <div id="profileContent"></div>
        </div>
    </div>

    <script>
        let allData = [];
        let filteredData = [];

        const SHEET_ID = '1PGJ-Ad74mpx-v3RbqHku2310jiCCyYcb85eC1G3d8wM';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
        // Parse CSV text into array of objects
        function parseCSV(csv) {
            const lines = csv.split('\n').filter(l => l.trim());
            if (lines.length < 2) return [];
            
            // Proper CSV parsing that handles commas inside quotes
            function parseLine(line) {
                const result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const ch = line[i];
                    if (ch === '"') {
                        inQuotes = !inQuotes;
                    } else if (ch === ',' && !inQuotes) {
                        result.push(current.trim());
                        current = '';
                    } else {
                        current += ch;
                    }
                }
                result.push(current.trim());
                return result;
            }
            
            const headers = parseLine(lines[0]);
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const values = parseLine(lines[i]);
                const obj = {};
                headers.forEach((h, idx) => {
                    obj[h] = values[idx] || '';
                });
                // Map Google Sheet columns to expected keys
                const mapped = {
                    NAME: obj['Player'] || obj['NAME'] || '',
                    MIGHT: obj['Might'] || obj['MIGHT'] || '',
                    PLAYER_KILL: obj['Player Kill'] || obj['PLAYER_KILL'] || '',
                    KILL: obj['Kills INCREASE '] || obj['Kills INCREASE'] || obj['KILL'] || '',
                    'MIGHT GAIN': obj['MightGain'] || obj['MIGHT GAIN'] || '',
                    'MIGHT LOSS': obj['MightLoss'] || obj['MIGHT LOSS'] || '',
                    RANK: obj['RANK'] || '',
                    MONTH: obj['Date'] || obj['MONTH'] || '',
                    'GUILD FEST': obj['GUILD FEST'] || ''
                };
                if (mapped.NAME) data.push(mapped);
            }
            return data;
        }

        // Load data from Google Sheets
        async function fetchLeaderboardData() {
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                allData = parseCSV(csvText);
                filteredData = [...allData];
                populateMonthDropdown();
                renderPodium();
                renderGuildStats();
                renderLeaderboard();
                renderGuildFest();
                renderMonthlySummary();
            } catch (error) {
                console.error('Error fetching from Google Sheets:', error);
                // Fallback to local JSON
                try {
                    const response = await fetch('data/players.json?t=' + new Date().getTime());
                    allData = await response.json();
                    filteredData = [...allData];
                    populateMonthDropdown();
                    renderPodium();
                    renderGuildStats();
                renderLeaderboard();
                renderGuildFest();
                renderMonthlySummary();
            } catch (e) {
                    console.error('Fallback also failed:', e);
                }
            }
        }

        // Populate month dropdown
        function populateMonthDropdown() {
            const months = new Set();
            allData.forEach(player => {
                if (player.MONTH) months.add(player.MONTH);
            });

            const dropdown = document.getElementById('monthDropdown');
            Array.from(months).sort().forEach(month => {
                const option = document.createElement('option');
                option.value = month;
                option.textContent = month;
                dropdown.appendChild(option);
            });
        }

        // Render podium cards
        function renderPodium() {
            const container = document.getElementById('podiumContainer');
            container.innerHTML = '';

            const top3 = filteredData.slice(0, 3);
            const medals = ['gold', 'silver', 'bronze'];
            const medalIcons = ['🥇', '🥈', '🥉'];

            top3.forEach((player, index) => {
                const card = document.createElement('div');
                card.className = `podium-card ${medals[index]}`;
                const rank = index + 1;

                card.innerHTML = `
                    <div class="podium-rank">${medalIcons[index]} ${rank}</div>
                    <div class="podium-player-name" onclick="showProfile('${player.NAME}')">${player.NAME}</div>
                    <div class="podium-stats">
                        <div class="podium-stat-row">
                            <span class="podium-stat-label">Kills:</span>
                            <span class="podium-stat-value">${player.KILL || '-'}</span>
                        </div>
                        <div class="podium-stat-row">
                            <span class="podium-stat-label">Might Loss:</span>
                            <span class="podium-stat-value">${player['MIGHT LOSS'] || '-'}</span>
                        </div>
                        <div class="podium-stat-row">
                            <span class="podium-stat-label">Might Gain:</span>
                            <span class="podium-stat-value">${player['MIGHT GAIN'] || '-'}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Render guild statistics
        function renderGuildStats() {
            const container = document.getElementById('guildStatsContainer');
            container.innerHTML = '';

            const totalKills = filteredData.reduce((sum, p) => sum + parseVal(p.KILL), 0);
            const totalMightLoss = filteredData.reduce((sum, p) => sum + parseVal(p['MIGHT LOSS']), 0);
            const totalMightGain = filteredData.reduce((sum, p) => sum + parseVal(p['MIGHT GAIN']), 0);

            const stats = [
                { label: 'Total Guild Kills', value: formatNumber(totalKills) },
                { label: 'Total Might Loss', value: formatNumber(totalMightLoss) },
                { label: 'Total Might Gain', value: formatNumber(totalMightGain) },
                { label: 'Active Players', value: filteredData.length }
            ];

            stats.forEach(stat => {
                const card = document.createElement('div');
                card.className = 'stat-card';
                card.innerHTML = `
                    <div class="stat-label">${stat.label}</div>
                    <div class="stat-value">${stat.value}</div>
                `;
                container.appendChild(card);
            });
        }

        // Parse values with suffixes (M, B, K)
        function parseVal(val) {
            if (!val) return 0;
            let str = val.toString().toUpperCase().trim();
            let numeric = parseFloat(str.replace(/[^0-9.]/g, '')) || 0;
            if (str.includes('B')) numeric *= 1000000000;
            else if (str.includes('M')) numeric *= 1000000;
            else if (str.includes('K')) numeric *= 1000;
            return numeric;
        }

        // Format numbers
        function formatNumber(num) {
            if (num >= 1000000000) return (num / 1000000000).toFixed(1) + 'B';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // Get rank badge
        function getRankBadge(rank) {
            const rankMap = { '5': 'r5', '4': 'r4', '3': 'r3', '2': 'r2', '1': 'r1' };
            const rankClass = rankMap[rank];
            if (rankClass) {
                return `<span class="rank-badge ${rankClass}">R${rank}</span>`;
            }
            return '';
        }

        // Render leaderboard table
        function renderLeaderboard() {
            const tbody = document.querySelector('#leaderboardTable tbody');
            tbody.innerHTML = '';

            filteredData.forEach((player, index) => {
                const rank = index + 1;
                let rankDisplay = rank;
                let rankClass = '';

                if (rank === 1) {
                    rankDisplay = '<span class="gold-text">🥇 1</span>';
                    rankClass = 'gold-text';
                } else if (rank === 2) {
                    rankDisplay = '<span class="silver-text">🥈 2</span>';
                    rankClass = 'silver-text';
                } else if (rank === 3) {
                    rankDisplay = '<span class="bronze-text">🥉 3</span>';
                    rankClass = 'bronze-text';
                }

                const rankBadge = getRankBadge(player.RANK || '');
                const playerName = `<a class="player-name" onclick="showProfile('${player.NAME}')">${player.NAME}</a>${rankBadge}`;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="rank-cell">${rankDisplay}</td>
                    <td>${playerName}</td>
                    <td>${player.MIGHT || '-'}</td>
                    <td>${player.PLAYER_KILL || '-'}</td>
                    <td>${player.KILL || '-'}</td>
                    <td>${player['MIGHT LOSS'] || '-'}</td>
                    <td>${player['MIGHT GAIN'] || '-'}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Render Guild Fest ranking
        function renderGuildFest() {
            const tbody = document.querySelector('#guildFestTable tbody');
            tbody.innerHTML = '';

            const guildFestData = [...filteredData]
                .filter(p => p['GUILD FEST'] && p['GUILD FEST'] !== '-')
                .sort((a, b) => {
                    const aVal = parseInt(b['GUILD FEST']) || 0;
                    const bVal = parseInt(a['GUILD FEST']) || 0;
                    return aVal - bVal;
                });

            guildFestData.forEach((player, index) => {
                const rank = index + 1;
                let rankDisplay = rank;

                if (rank === 1) {
                    rankDisplay = '<span class="gold-text">🥇 1</span>';
                } else if (rank === 2) {
                    rankDisplay = '<span class="silver-text">🥈 2</span>';
                } else if (rank === 3) {
                    rankDisplay = '<span class="bronze-text">🥉 3</span>';
                }

                const rankBadge = getRankBadge(player.RANK || '');
                const playerName = `<a class="player-name" onclick="showProfile('${player.NAME}')">${player.NAME}</a>${rankBadge}`;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="rank-cell">${rankDisplay}</td>
                    <td>${playerName}</td>
                    <td>${player['GUILD FEST'] || '-'}</td>
                    <td>${player.KILL || '-'}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Show player profile
        function showProfile(playerName) {
            const player = allData.find(p => p.NAME === playerName);
            if (!player) return;

            const modal = document.getElementById('profileModal');
            const content = document.getElementById('profileContent');

            const rankBadge = getRankBadge(player.RANK || '');
            const overallRank = allData.findIndex(p => p.NAME === playerName) + 1;

            content.innerHTML = `
                <div class="profile-header">
                    <div class="profile-name">${player.NAME}</div>
                    <div class="profile-rank">Overall Rank: #${overallRank} ${rankBadge}</div>
                </div>
                <div class="profile-stats">
                    <div class="profile-stat">
                        <div class="profile-stat-label">Total Kills</div>
                        <div class="profile-stat-value">${player.KILL || '-'}</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-label">Might Loss</div>
                        <div class="profile-stat-value">${player['MIGHT LOSE'] || '-'}</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-label">Might Gain</div>
                        <div class="profile-stat-value">${player['MIGHT GAIN'] || '-'}</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-label">Guild Fest</div>
                        <div class="profile-stat-value">${player['GUILD FEST'] || '-'}</div>
                    </div>
                </div>
            `;

            modal.classList.add('show');
        }

        // Close profile modal
        function closeProfile() {
            document.getElementById('profileModal').classList.remove('show');
        }

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const tab = btn.dataset.tab;
                document.getElementById('leaderboardSection').classList.toggle('active', tab === 'leaderboard');
                document.getElementById('guildFestSection').classList.toggle('active', tab === 'guild-fest');
            });
        });

        // Search functionality
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const filter = this.value.toUpperCase();
            filteredData = allData.filter(player => 
                player.NAME.toUpperCase().includes(filter) &&
                (document.getElementById('monthDropdown').value === '' || 
                 player.MONTH === document.getElementById('monthDropdown').value)
            );
            renderPodium();
            renderGuildStats();
            renderLeaderboard();
            renderGuildFest();
            renderMonthlySummary();
        });

        // Month filter
        document.getElementById('monthDropdown').addEventListener('change', function() {
            const month = this.value;
            const search = document.getElementById('searchInput').value.toUpperCase();

            filteredData = allData.filter(player => 
                (month === '' || player.MONTH === month) &&
                player.NAME.toUpperCase().includes(search)
            );

            renderPodium();
            renderGuildStats();
            renderLeaderboard();
            renderGuildFest();
            renderMonthlySummary();
        });

        // Render Monthly Summary
        function renderMonthlySummary() {
            const tbody = document.querySelector('#monthlySummaryTable tbody');
            if (!tbody) return;
            tbody.innerHTML = '';

            const monthlyData = {};
            allData.forEach(player => {
                const month = player.MONTH || 'Unknown';
                if (!monthlyData[month]) {
                    monthlyData[month] = {
                        kills: 0,
                        loss: 0,
                        gain: 0,
                        players: new Set()
                    };
                }

                monthlyData[month].kills += parseVal(player.KILL);
                monthlyData[month].loss += parseVal(player['MIGHT LOSS']);
                monthlyData[month].gain += parseVal(player['MIGHT GAIN']);
                monthlyData[month].players.add(player.NAME);
            });

            Object.keys(monthlyData).sort().forEach(month => {
                const data = monthlyData[month];
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${month}</strong></td>
                    <td>${formatNumber(data.kills)}</td>
                    <td>${formatNumber(data.loss)}</td>
                    <td>${formatNumber(data.gain)}</td>
                    <td>${data.players.size}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Close modal on outside click
        window.addEventListener('click', function(event) {
            const modal = document.getElementById('profileModal');
            if (event.target === modal) {
                modal.classList.remove('show');
            }
        });

        // Load data on page load
        window.addEventListener('load', fetchLeaderboardData);
    </script>
