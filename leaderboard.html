<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guild Kill Leaderboard</title><style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.search-box{
    width:100%;
    max-width:400px;
    margin:0 auto 20px;
    display:block;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#1e293b;
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#2563eb;
    padding:12px;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #334155;
}

.gold{
    color:gold;
    font-weight:bold;
}

.silver{
    color:silver;
    font-weight:bold;
}

.bronze{
    color:#cd7f32;
    font-weight:bold;
}

tr:hover{
    background:#334155;
}
</style></head><body><h1>🏆 Guild Kill Leaderboard</h1><input
type="text"
id="searchInput"
class="search-box"
placeholder="Search Player...">

<table id="leaderboardTable"><thead>
<tr>
<th>Rank</th>
<th>Player</th>
<th>Kills</th>
</tr>
</thead><tbody>
</tbody></table><script>

const sheetID = "1jqCbcbNDCgFLc82GTvoAj8JFr3l5af5grqMCAOt-ixI";
const url = `https://opensheet.elk.sh/${sheetID}/Sheet1`;

fetch(url)
.then(response => response.json())
.then(data => {

    const tbody =
    document.querySelector("#leaderboardTable tbody");

    tbody.innerHTML = "";

    data.forEach((player,index) => {

        let rank = index + 1;

        if(rank === 1){
            rank = '<span class="gold">🥇 1</span>';
        }
        else if(rank === 2){
            rank = '<span class="silver">🥈 2</span>';
        }
        else if(rank === 3){
            rank = '<span class="bronze">🥉 3</span>';
        }

        tbody.innerHTML += `
        <tr>
            <td>${rank}</td>
            <td>${player.NAME}</td>
            <td>${player.KILL}</td>
        </tr>
        `;
    });

});

document.getElementById("searchInput")
.addEventListener("keyup", function(){

    let filter =
    this.value.toUpperCase();

    let rows =
    document.querySelectorAll(
    "#leaderboardTable tbody tr"
    );

    rows.forEach(row => {

        let player =
        row.cells[1].textContent
        .toUpperCase();

        row.style.display =
        player.includes(filter)
        ? ""
        : "none";

    });

});

</script></body>
</html>
