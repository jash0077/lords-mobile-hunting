<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guild Kill Leaderboard</title><style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.search-box{
    width:100%;
    max-width:400px;
    margin:0 auto 20px;
    display:block;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#1e293b;
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#2563eb;
    padding:12px;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #334155;
}

.gold{color:gold;font-weight:bold;}
.silver{color:silver;font-weight:bold;}
.bronze{color:#cd7f32;font-weight:bold;}

tr:hover{
    background:#334155;
}
</style></head><body><h1>🏆 Guild Kill Leaderboard</h1><input type="text" id="searchInput" class="search-box" placeholder="Search Player..."><table id="leaderboardTable">
<thead>
<tr>
<th>Rank</th>
<th>Player</th>
<th>Kills</th>
</tr>
</thead><tbody><tr>
<td class="gold">🥇 1</td>
<td>JASH</td>
<td>1.8B</td>
</tr><tr>
<td class="silver">🥈 2</td>
<td>Shadow</td>
<td>900M</td>
</tr><tr>
<td class="bronze">🥉 3</td>
<td>Dragon</td>
<td>700M</td>
</tr><tr>
<td>4</td>
<td>Knight</td>
<td>500M</td>
</tr><tr>
<td>5</td>
<td>Warrior</td>
<td>300M</td>
</tr></tbody>
</table><script>
document.getElementById("searchInput").addEventListener("keyup", function() {
let filter = this.value.toUpperCase();
let rows = document.querySelectorAll("#leaderboardTable tbody tr");

rows.forEach(row => {
let player = row.cells[1].textContent.toUpperCase();
row.style.display = player.includes(filter) ? "" : "none";
});
});
</script></body>
</html>
