<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild Management - Lords Mobile Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyber-gold: #f5a623;
            --cyber-bg: #050508;
            --cyber-surface: rgba(20, 20, 30, 0.98);
            --cyber-border: rgba(245, 166, 35, 0.5);
        }

        body.admin-body { background: var(--cyber-bg); color: #e0e0e0; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        .cyber-container { max-width: 1000px; margin: 0 auto; padding: 15px; }

        /* Login */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 3000; }
        .login-card { background: var(--cyber-surface); padding: 40px; border-radius: 20px; border: 1px solid var(--cyber-border); text-align: center; width: 90%; max-width: 400px; }
        .cyber-input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--cyber-border); color: white; border-radius: 8px; margin-bottom: 20px; text-align: center; font-family: 'Orbitron'; }

        /* Header */
        .admin-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--cyber-border); margin-bottom: 20px; }
        .admin-header h2 { font-family: 'Orbitron'; color: var(--cyber-gold); margin: 0; font-size: 1.1rem; letter-spacing: 2px; }

        /* Cards */
        .cyber-card { background: var(--cyber-surface); border-radius: 15px; border: 1px solid var(--cyber-border); padding: 20px; margin-bottom: 20px; }
        
        /* Table */
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .data-table th { text-align: left; padding: 12px; background: rgba(245, 166, 35, 0.1); color: var(--cyber-gold); font-family: 'Orbitron'; font-size: 0.7rem; }
        .data-table td { padding: 12px; border-bottom: 1px solid #333; }
        
        .player-select { background: #000; color: var(--cyber-gold); border: 1px solid var(--cyber-border); padding: 8px; border-radius: 4px; width: 100%; }
        .num-input { background: #000; color: white; border: 1px solid #444; padding: 8px; border-radius: 4px; width: 100px; text-align: center; }

        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        .badge-gain { background: rgba(0, 255, 100, 0.1); color: #00ff64; }
        .badge-loss { background: rgba(255, 50, 50, 0.1); color: #ff3232; }

        .cyber-btn { padding: 12px 25px; background: var(--cyber-gold); color: black; border: none; border-radius: 5px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; font-size: 0.8rem; transition: 0.3s; display: inline-flex; align-items: center; gap: 10px; }
        .cyber-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--cyber-gold); }
        .cyber-btn.hype { background: #ff00ff; color: white; box-shadow: 0 0 15px rgba(255, 0, 255, 0.4); }
        .cyber-btn.secondary { background: transparent; border: 1px solid var(--cyber-border); color: var(--cyber-gold); }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 4000; align-items: center; justify-content: center; }
        .modal-content { background: var(--cyber-surface); border: 1px solid var(--cyber-gold); padding: 25px; border-radius: 15px; width: 90%; max-width: 550px; text-align: center; max-height: 90vh; overflow-y: auto; }
        
        /* Player Selection List */
        .player-list-container { text-align: left; margin: 20px 0; max-height: 300px; overflow-y: auto; background: #000; border: 1px solid #333; border-radius: 8px; padding: 10px; }
        .player-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #222; cursor: pointer; transition: 0.2s; }
        .player-item:hover { background: rgba(245, 166, 35, 0.1); }
        .player-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--cyber-gold); }
        
        #hypeReport { background: #000; color: #00ff00; padding: 20px; border-radius: 8px; text-align: left; font-family: monospace; white-space: pre-wrap; margin: 20px 0; max-height: 300px; overflow-y: auto; border: 1px solid #00ff00; }
        .search-box { width: 100%; padding: 10px; background: #111; border: 1px solid #444; color: white; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body class="admin-body">

<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h1 style="color: var(--cyber-gold); font-family: 'Orbitron'; letter-spacing: 5px;">COMMAND CENTER</h1>
        <input type="password" id="adminPassword" class="cyber-input" placeholder="ACCESS KEY" onkeypress="if(event.key==='Enter')checkLogin()">
        <button class="cyber-btn" style="width: 100%;" onclick="checkLogin()">INITIATE ACCESS</button>
    </div>
</div>

<div class="cyber-container" id="adminContent" style="display:none;">
    <div class="admin-header">
        <h2>GUILD_DASHBOARD_v3.1</h2>
        <div style="display: flex; gap: 10px;">
            <button class="cyber-btn secondary" onclick="window.location.href='index.html'">EXIT</button>
        </div>
    </div>

    <div class="cyber-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
            <h3 style="font-family: 'Orbitron'; color: var(--cyber-gold); margin: 0;">DATA_ENTRY_SECTOR</h3>
            <button class="cyber-btn hype" onclick="openHypeSelector()"><i class="fas fa-fire"></i> HYPE_SELECTOR</button>
        </div>
        
        <div style="overflow-x: auto;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Select Player</th>
                        <th>Current Might</th>
                        <th>Might Delta</th>
                        <th>Current Kills</th>
                        <th>Kills Incr.</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <tr>
                        <td>
                            <select class="player-select" id="pSelect" onchange="updateCalc()">
                                <option value="">-- Choose Member --</option>
                            </select>
                        </td>
                        <td><input type="text" class="num-input" id="pMight" placeholder="e.g. 500M" oninput="updateCalc()"></td>
                        <td id="pDelta">--</td>
                        <td><input type="text" class="num-input" id="pKills" placeholder="e.g. 10M" oninput="updateCalc()"></td>
                        <td id="pKDelta">--</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div style="margin-top: 15px; text-align: right;">
            <button class="cyber-btn" onclick="addEntry()"><i class="fas fa-plus"></i> ADD_TO_LIST</button>
        </div>
    </div>

    <!-- Pending List -->
    <div class="cyber-card" id="confirmedSection" style="display:none;">
        <h3 style="font-family: 'Orbitron'; color: var(--cyber-gold); font-size: 0.9rem;">PENDING_RECORDS</h3>
        <div style="overflow-x: auto;">
            <table class="data-table">
                <thead>
                    <tr><th>Player</th><th>Might</th><th>Delta</th><th>Kills</th><th>Gain</th></tr>
                </thead>
                <tbody id="confirmedBody"></tbody>
            </table>
        </div>
        <div style="margin-top: 20px; text-align: right;">
            <button class="cyber-btn secondary" onclick="resetAll()">CLEAR_ALL</button>
            <button class="cyber-btn" onclick="syncAll()">SYNC_MAINFRAME</button>
        </div>
    </div>
</div>

<!-- Hype Selector Modal -->
<div id="hypeSelectorModal" class="modal">
    <div class="modal-content">
        <h2 style="font-family: 'Orbitron'; color: var(--cyber-gold);">SELECT PLAYERS TO HYPE</h2>
        <input type="text" class="search-box" id="playerSearch" placeholder="Search player name..." oninput="filterPlayers()">
        <div class="player-list-container" id="playerList"></div>
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
            <button class="cyber-btn hype" onclick="generateHype()">GENERATE_REPORT</button>
            <button class="cyber-btn secondary" onclick="closeHypeSelector()">CANCEL</button>
        </div>
    </div>
</div>

<!-- Hype Result Modal -->
<div id="hypeResultModal" class="modal">
    <div class="modal-content">
        <h2 style="font-family: 'Orbitron'; color: #ff00ff;">🔥 GUILD HYPE REPORT 🔥</h2>
        <div id="hypeReport"></div>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="cyber-btn" onclick="copyHype()">COPY_TO_CLIPBOARD</button>
            <button class="cyber-btn secondary" onclick="closeHypeResult()">BACK</button>
        </div>
    </div>
</div>

<script>
    const ADMIN_PASS = '523890';
    const SHEET_ID = '1U32usFizcgYfiN2URc9s4tteVXDBZoSDS2AK-KoBfjI';
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
    
    let oldData = [];
    let pendingList = [];

    function checkLogin() {
        if (document.getElementById('adminPassword').value === ADMIN_PASS) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            fetchData();
        }
    }

    async function fetchData() {
        try {
            const res = await fetch(SHEET_URL);
            const text = await res.text();
            
            const rows = text.split('\n').map(r => r.replace(/"/g, '').split(','));
            oldData = [];
            
            for(let i = 1; i < rows.length; i++) {
                if(rows[i][0]) {
                    oldData.push({
                        name: rows[i][0],
                        might: parseNumber(rows[i][1]),
                        kills: parseNumber(rows[i][2])
                    });
                }
            }
            
            populateSelect();
        } catch(e) {
            console.error('Fetch Error:', e);
            alert('Failed to connect to mainframe.');
        }
    }

    function parseNumber(str) {
        if(!str) return 0;
        str = str.toString().toUpperCase().replace(/,/g, '').trim();
        let mult = 1;
        if(str.endsWith('M')) { mult = 1000000; str = str.slice(0, -1); }
        else if(str.endsWith('K')) { mult = 1000; str = str.slice(0, -1); }
        else if(str.endsWith('B')) { mult = 1000000000; str = str.slice(0, -1); }
        
        return parseFloat(str) * mult || 0;
    }

    function formatNumber(num) {
        if(num >= 1000000000) return (num / 1000000000).toFixed(2) + 'B';
        if(num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
        if(num >= 1000) return (num / 1000).toFixed(1) + 'K';
        return num.toLocaleString();
    }

    function populateSelect() {
        const sel = document.getElementById('pSelect');
        sel.innerHTML = '<option value="">-- Choose Member --</option>';
        
        oldData.sort((a,b) => a.name.localeCompare(b.name)).forEach(p => {
            sel.innerHTML += `<option value="${p.name}">${p.name}</option>`;
        });
    }

    function updateCalc() {
        const name = document.getElementById('pSelect').value;
        const p = oldData.find(x => x.name === name);
        if(!p) return;

        const curMight = parseNumber(document.getElementById('pMight').value);
        const curKills = parseNumber(document.getElementById('pKills').value);

        if(curMight > 0) {
            const mDelta = curMight - p.might;
            const el = document.getElementById('pDelta');
            el.innerHTML = mDelta >= 0 ? `<span class="badge badge-gain">+${formatNumber(mDelta)}</span>` : `<span class="badge badge-loss">${formatNumber(mDelta)}</span>`;
        }

        if(curKills > 0) {
            const kDelta = curKills - p.kills;
            const el = document.getElementById('pKDelta');
            el.innerHTML = kDelta >= 0 ? `<span class="badge badge-gain">+${formatNumber(kDelta)}</span>` : `<span class="badge badge-loss">${formatNumber(kDelta)}</span>`;
        }
    }

    function addEntry() {
        const name = document.getElementById('pSelect').value;
        if(!name) return alert('Select a member first.');

        const curMight = parseNumber(document.getElementById('pMight').value);
        const curKills = parseNumber(document.getElementById('pKills').value);
        
        if(!curMight && !curKills) return alert('Enter Might or Kills.');

        const p = oldData.find(x => x.name === name);
        const mDelta = curMight ? curMight - p.might : 0;
        const kDelta = curKills ? curKills - p.kills : 0;

        pendingList = pendingList.filter(x => x.name !== name);
        
        pendingList.push({
            name,
            newMight: curMight || p.might,
            newKills: curKills || p.kills,
            mDelta,
            kDelta
        });

        document.getElementById('pSelect').value = '';
        document.getElementById('pMight').value = '';
        document.getElementById('pKills').value = '';
        document.getElementById('pDelta').innerHTML = '--';
        document.getElementById('pKDelta').innerHTML = '--';

        renderPending();
    }

    function renderPending() {
        const sec = document.getElementById('confirmedSection');
        const body = document.getElementById('confirmedBody');
        
        if(pendingList.length === 0) {
            sec.style.display = 'none';
            return;
        }

        sec.style.display = 'block';
        body.innerHTML = pendingList.map(p => `
            <tr>
                <td style="color: var(--cyber-gold); font-weight: bold;">${p.name}</td>
                <td>${formatNumber(p.newMight)}</td>
                <td>${p.mDelta >= 0 ? '<span style="color:#00ff64">+' : '<span style="color:#ff3232">'}${formatNumber(p.mDelta)}</span></td>
                <td>${formatNumber(p.newKills)}</td>
                <td>${p.kDelta >= 0 ? '<span style="color:#00ff64">+' : '<span style="color:#ff3232">'}${formatNumber(p.kDelta)}</span></td>
            </tr>
        `).join('');
    }

    function resetAll() {
        pendingList = [];
        renderPending();
    }

    function syncAll() {
        if(pendingList.length === 0) return;
        
        const lines = ['Name,Might,Kills'];
        
        oldData.forEach(p => {
            const pending = pendingList.find(x => x.name === p.name);
            if(pending) {
                lines.push(`${p.name},${pending.newMight},${pending.newKills}`);
            } else {
                lines.push(`${p.name},${p.might},${p.kills}`);
            }
        });

        const csvContent = lines.join('\n');
        
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", "guild_data_update.csv");
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        alert('Update file generated. Please import this into Google Sheets.');
        resetAll();
    }

    // --- HYPE SELECTOR LOGIC ---
    function openHypeSelector() {
        const list = document.getElementById('playerList');
        list.innerHTML = oldData.map((p, i) => `
            <div class="player-item" onclick="toggleCheckbox('hype_${i}')">
                <input type="checkbox" id="hype_${i}" value="${p.name}" class="hype-check" onclick="event.stopPropagation()">
                <label for="hype_${i}" style="color: var(--cyber-gold); font-family: 'Orbitron'; cursor:pointer;">${p.name}</label>
            </div>
        `).join('');
        document.getElementById('playerSearch').value = '';
        document.getElementById('hypeSelectorModal').style.display = 'flex';
    }

    function closeHypeSelector() {
        document.getElementById('hypeSelectorModal').style.display = 'none';
    }

    function toggleCheckbox(id) {
        const cb = document.getElementById(id);
        cb.checked = !cb.checked;
    }

    function filterPlayers() {
        const q = document.getElementById('playerSearch').value.toLowerCase();
        const items = document.querySelectorAll('.player-item');
        items.forEach(item => {
            const name = item.querySelector('label').textContent.toLowerCase();
            item.style.display = name.includes(q) ? 'flex' : 'none';
        });
    }

    function generateHype() {
        const checks = document.querySelectorAll('.hype-check:checked');
        if(checks.length === 0) {
            alert('Select at least one player!');
            return;
        }

        const selectedNames = Array.from(checks).map(c => c.value);
        let report = `🔥 GUILD MILESTONE HYPE 🔥\n\n`;

        selectedNames.forEach(name => {
            const pending = pendingList.find(x => x.name === name);
            const p = oldData.find(x => x.name === name);
            
            const currentMight = pending ? pending.newMight : p.might;
            const currentKills = pending ? pending.newKills : p.kills;
            
            const mDelta = pending ? pending.mDelta : 0;
            const kDelta = pending ? pending.kDelta : 0;

            report += `⚔️ ${name}\n`;
            report += `🛡️ Might: ${formatNumber(currentMight)}`;
            if(mDelta > 0) report += ` (+${formatNumber(mDelta)}) 🚀`;
            report += `\n`;
            
            report += `💀 Kills: ${formatNumber(currentKills)}`;
            if(kDelta > 0) report += ` (+${formatNumber(kDelta)}) 🩸`;
            report += `\n\n`;
        });

        report += `KEEP PUSHING! FOR THE GUILD! 🏆`;

        document.getElementById('hypeReport').textContent = report;
        closeHypeSelector();
        document.getElementById('hypeResultModal').style.display = 'flex';
    }

    function closeHypeResult() {
        document.getElementById('hypeResultModal').style.display = 'none';
    }

    function copyHype() {
        const text = document.getElementById('hypeReport').textContent;
        navigator.clipboard.writeText(text).then(() => {
            alert('Copied to clipboard!');
        });
    }
</script>
</body>
</html>
