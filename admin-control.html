<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild Management - Lords Mobile Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyber-gold: #f5a623;
            --cyber-bg: #050508;
            --cyber-surface: rgba(20, 20, 30, 0.98);
            --cyber-border: rgba(245, 166, 35, 0.5);
        }

        body.admin-body { background: var(--cyber-bg); color: #e0e0e0; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        .cyber-container { max-width: 1000px; margin: 0 auto; padding: 15px; }

        /* Login */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 3000; }
        .login-card { background: var(--cyber-surface); padding: 40px; border-radius: 20px; border: 1px solid var(--cyber-border); text-align: center; width: 90%; max-width: 400px; }
        .cyber-input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--cyber-border); color: white; border-radius: 8px; margin-bottom: 20px; text-align: center; font-family: 'Orbitron'; }

        /* Header */
        .admin-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--cyber-border); margin-bottom: 20px; }
        .admin-header h2 { font-family: 'Orbitron'; color: var(--cyber-gold); margin: 0; font-size: 1.1rem; letter-spacing: 2px; }

        /* Battle Clock */
        .battle-clock-card { background: linear-gradient(135deg, rgba(245, 166, 35, 0.1) 0%, rgba(0,0,0,0.5) 100%); border: 2px solid var(--cyber-gold); border-radius: 15px; padding: 20px; text-align: center; margin-bottom: 30px; box-shadow: 0 0 20px rgba(245, 166, 35, 0.2); }
        .clock-display { font-family: 'Orbitron'; font-size: 2.5rem; color: var(--cyber-gold); text-shadow: 0 0 10px var(--cyber-gold); margin: 10px 0; }
        .clock-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 3px; color: #888; }

        /* Cards */
        .cyber-card { background: var(--cyber-surface); border-radius: 15px; border: 1px solid var(--cyber-border); padding: 20px; margin-bottom: 20px; }
        
        /* Table */
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .data-table th { text-align: left; padding: 12px; background: rgba(245, 166, 35, 0.1); color: var(--cyber-gold); font-family: 'Orbitron'; font-size: 0.7rem; }
        .data-table td { padding: 12px; border-bottom: 1px solid #333; }
        
        .player-select { background: #000; color: var(--cyber-gold); border: 1px solid var(--cyber-border); padding: 8px; border-radius: 4px; width: 100%; }
        .num-input { background: #000; color: white; border: 1px solid #444; padding: 8px; border-radius: 4px; width: 100px; text-align: center; }

        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        .badge-gain { background: rgba(0, 255, 100, 0.1); color: #00ff64; }
        .badge-loss { background: rgba(255, 50, 50, 0.1); color: #ff3232; }

        .cyber-btn { padding: 12px 25px; background: var(--cyber-gold); color: black; border: none; border-radius: 5px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; font-size: 0.8rem; transition: 0.3s; display: inline-flex; align-items: center; gap: 10px; }
        .cyber-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--cyber-gold); }
        .cyber-btn.hype { background: #ff00ff; color: white; box-shadow: 0 0 15px rgba(255, 0, 255, 0.4); }
        .cyber-btn.secondary { background: transparent; border: 1px solid var(--cyber-border); color: var(--cyber-gold); }

        /* Hype Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 4000; align-items: center; justify-content: center; }
        .modal-content { background: var(--cyber-surface); border: 1px solid var(--cyber-gold); padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; text-align: center; }
        #hypeReport { background: #000; color: #00ff00; padding: 20px; border-radius: 8px; text-align: left; font-family: monospace; white-space: pre-wrap; margin: 20px 0; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body class="admin-body">

<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h1 style="color: var(--cyber-gold); font-family: 'Orbitron'; letter-spacing: 5px;">COMMAND CENTER</h1>
        <input type="password" id="adminPassword" class="cyber-input" placeholder="ACCESS KEY" onkeypress="if(event.key==='Enter')checkLogin()">
        <button class="cyber-btn" style="width: 100%;" onclick="checkLogin()">INITIATE ACCESS</button>
    </div>
</div>

<div class="cyber-container" id="adminContent" style="display:none;">
    <div class="admin-header">
        <h2>GUILD_DASHBOARD_v3.0</h2>
        <div style="display: flex; gap: 10px;">
            <button class="cyber-btn secondary" onclick="window.location.href='index.html'">EXIT</button>
        </div>
    </div>

    <!-- Battle Clock Section -->
    <div class="battle-clock-card">
        <div class="clock-label">NEXT GUILD EVENT COUNTDOWN</div>
        <div class="clock-display" id="timer">00:00:00:00</div>
        <div style="margin-top: 15px; display: flex; justify-content: center; gap: 10px;">
            <input type="datetime-local" id="eventTime" class="num-input" style="width: 200px;">
            <button class="cyber-btn" onclick="setEvent()">SET_EVENT</button>
        </div>
    </div>

    <div class="cyber-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="font-family: 'Orbitron'; color: var(--cyber-gold); margin: 0;">MANUAL_UPDATE_SECTOR</h3>
            <button class="cyber-btn hype" onclick="generateHype()"><i class="fas fa-fire"></i> HYPE_BUTTON</button>
        </div>
        
        <div style="overflow-x: auto;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Select Player</th>
                        <th>Current Might</th>
                        <th>Might Delta</th>
                        <th>Current Kills</th>
                        <th>Kills Incr.</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <!-- Row 1 (Always visible for entry) -->
                    <tr>
                        <td>
                            <select class="player-select" id="pSelect" onchange="updateCalc()">
                                <option value="">-- Choose Member --</option>
                            </select>
                        </td>
                        <td><input type="text" class="num-input" id="pMight" placeholder="e.g. 500M" oninput="updateCalc()"></td>
                        <td id="pDelta">--</td>
                        <td><input type="text" class="num-input" id="pKills" placeholder="e.g. 10M" oninput="updateCalc()"></td>
                        <td id="pKDelta">--</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div style="margin-top: 15px; text-align: right;">
            <button class="cyber-btn" onclick="addEntry()"><i class="fas fa-plus"></i> ADD_TO_LIST</button>
        </div>
    </div>

    <!-- Confirmed List -->
    <div class="cyber-card" id="confirmedSection" style="display:none;">
        <h3 style="font-family: 'Orbitron'; color: var(--cyber-gold); font-size: 0.9rem;">PENDING_SYNC_LIST</h3>
        <table class="data-table">
            <thead>
                <tr><th>Player</th><th>Might</th><th>Delta</th><th>Kills</th><th>Gain</th></tr>
            </thead>
            <tbody id="confirmedBody"></tbody>
        </table>
        <div style="margin-top: 20px; text-align: right;">
            <button class="cyber-btn" onclick="syncAll()">SYNC_TO_MAINFRAME</button>
        </div>
    </div>
</div>

<!-- Hype Modal -->
<div id="hypeModal" class="modal">
    <div class="modal-content">
        <h2 style="font-family: 'Orbitron'; color: #ff00ff;">🔥 GUILD HYPE REPORT 🔥</h2>
        <div id="hypeReport"></div>
        <button class="cyber-btn" onclick="copyHype()">COPY_TO_CLIPBOARD</button>
        <button class="cyber-btn secondary" onclick="closeHype()">CLOSE</button>
    </div>
</div>

<script>
    const ADMIN_PASS = '523890';
    const SHEET_ID = '1U32usFizcgYfiN2URc9s4tteVXDBZoSDS2AK-KoBfjI';
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
    
    let oldData = [];
    let pendingList = [];
    let countdownInterval;

    function checkLogin() {
        if (document.getElementById('adminPassword').value === ADMIN_PASS) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            fetchData();
            startTimer();
        }
    }

    async function fetchData() {
        const res = await fetch(SHEET_URL + '&cb=' + Date.now());
        const csv = await res.text();
        oldData = parseCSV(csv);
        const select = document.getElementById('pSelect');
        oldData.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.Player;
            opt.textContent = p.Player;
            select.appendChild(opt);
        });
    }

    function parseCSV(csv) {
        const lines = csv.split('\n').filter(l => l.trim());
        const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
        return lines.slice(1).map(line => {
            const values = line.match(/("[^"]*"|[^,]*)/g) || [];
            const obj = {};
            headers.forEach((h, i) => obj[h] = (values[i] || '').replace(/"/g, '').trim());
            return obj;
        });
    }

    function updateCalc() {
        const name = document.getElementById('pSelect').value;
        const might = parseV(document.getElementById('pMight').value);
        const kills = parseV(document.getElementById('pKills').value);
        
        const p = oldData.find(u => u.Player === name);
        if (p) {
            const dm = might - parseV(p.Might);
            const dk = kills - parseV(p['Player Kill']);
            document.getElementById('pDelta').innerHTML = `<span class="badge ${dm>=0?'badge-gain':'badge-loss'}">${dm>=0?'+':''}${fmt(dm)}</span>`;
            document.getElementById('pKDelta').innerHTML = `<span class="badge badge-gain">+${fmt(dk)}</span>`;
        }
    }

    function addEntry() {
        const name = document.getElementById('pSelect').value;
        const might = parseV(document.getElementById('pMight').value);
        const kills = parseV(document.getElementById('pKills').value);
        
        if (!name || !might) return alert("Please select a player and enter might.");
        
        const p = oldData.find(u => u.Player === name);
        const dm = might - parseV(p.Might);
        const dk = kills - parseV(p['Player Kill']);

        pendingList.push({ name, might, dm, kills, dk });
        renderPending();
        
        // Reset inputs
        document.getElementById('pSelect').value = "";
        document.getElementById('pMight').value = "";
        document.getElementById('pKills').value = "";
        document.getElementById('pDelta').textContent = "--";
        document.getElementById('pKDelta').textContent = "--";
    }

    function renderPending() {
        document.getElementById('confirmedSection').style.display = 'block';
        const body = document.getElementById('confirmedBody');
        body.innerHTML = '';
        pendingList.forEach(p => {
            body.innerHTML += `<tr><td>${p.name}</td><td>${fmt(p.might)}</td><td><span class="badge ${p.dm>=0?'badge-gain':'badge-loss'}">${fmt(p.dm)}</span></td><td>${fmt(p.kills)}</td><td><span class="badge badge-gain">+${fmt(p.dk)}</span></td></tr>`;
        });
    }

    // Hype Button Logic
    function generateHype() {
        if (pendingList.length === 0) return alert("Add some players to the list first!");
        
        let report = `🔥 **HEM GUILD WAR REPORT** 🔥\n\n`;
        report += `🏆 **TOP PERFORMERS THIS WEEK** 🏆\n\n`;
        
        // Sort by Might Gain
        const sorted = [...pendingList].sort((a,b) => b.dm - a.dm);
        
        sorted.forEach((p, i) => {
            const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '⚔️';
            report += `${medal} **${p.name}**\n   └ Might: +${fmt(p.dm)} | Kills: +${fmt(p.dk)}\n\n`;
        });
        
        report += `💪 Great job everyone! Keep pushing! 💪`;
        
        document.getElementById('hypeReport').textContent = report;
        document.getElementById('hypeModal').style.display = 'flex';
    }

    function copyHype() {
        const text = document.getElementById('hypeReport').textContent;
        navigator.clipboard.writeText(text);
        alert("Report copied! Paste it in Discord/Telegram.");
    }

    function closeHype() { document.getElementById('hypeModal').style.display = 'none'; }

    // Battle Clock Logic
    function startTimer() {
        const saved = localStorage.getItem('guild_event_time');
        if (saved) {
            document.getElementById('eventTime').value = saved;
            updateTimer(new Date(saved).getTime());
        }
    }

    function setEvent() {
        const time = document.getElementById('eventTime').value;
        if (!time) return;
        localStorage.setItem('guild_event_time', time);
        updateTimer(new Date(time).getTime());
        alert("Battle Clock Set!");
    }

    function updateTimer(target) {
        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
            const now = new Date().getTime();
            const dist = target - now;
            
            if (dist < 0) {
                document.getElementById('timer').textContent = "EVENT LIVE!";
                return clearInterval(countdownInterval);
            }
            
            const d = Math.floor(dist / (1000 * 60 * 60 * 24));
            const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((dist % (1000 * 60)) / 1000);
            
            document.getElementById('timer').textContent = `${d}d ${h}h ${m}m ${s}s`;
        }, 1000);
    }

    function parseV(v) {
        if(!v) return 0;
        v = v.toString().toUpperCase().replace(/,/g, '');
        if(v.endsWith('B')) return parseFloat(v)*1e9;
        if(v.endsWith('M')) return parseFloat(v)*1e6;
        if(v.endsWith('K')) return parseFloat(v)*1e3;
        return parseFloat(v);
    }

    function fmt(n) {
        const a = Math.abs(n);
        if(a>=1e9) return (n/1e9).toFixed(2)+'B';
        if(a>=1e6) return (n/1e6).toFixed(2)+'M';
        if(a>=1e3) return (n/1e3).toFixed(1)+'K';
        return n.toLocaleString();
    }

    function syncAll() { alert("SYNC_INITIATED: Sending data to Mainframe."); }
    function resetAll() { pendingList = []; renderPending(); document.getElementById('confirmedSection').style.display = 'none'; }
</script>
</body>
</html>
