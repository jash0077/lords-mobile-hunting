<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center - Lords Mobile Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        :root {
            --cyber-gold: #f5a623;
            --cyber-blue: #00d2ff;
            --cyber-bg: #050508;
            --cyber-surface: rgba(20, 20, 30, 0.9);
            --cyber-border: rgba(245, 166, 35, 0.3);
            --cyber-glow: 0 0 20px rgba(245, 166, 35, 0.2);
        }

        body.admin-body {
            background: var(--cyber-bg);
            color: #e0e0e0;
            font-family: 'Poppins', sans-serif;
            margin: 0; padding: 0;
        }

        .cyber-container { max-width: 1000px; margin: 0 auto; padding: 15px; }

        /* Login Overlay */
        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #050508 100%);
            display: flex; align-items: center; justify-content: center; z-index: 3000;
        }
        .login-card {
            background: var(--cyber-surface); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 20px; border: 1px solid var(--cyber-border);
            box-shadow: var(--cyber-glow); text-align: center; width: 90%; max-width: 400px;
        }
        .login-card h1 { font-family: 'Orbitron', sans-serif; color: var(--cyber-gold); letter-spacing: 3px; margin-bottom: 25px; }
        .cyber-input {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.6); border: 1px solid var(--cyber-border);
            color: white; border-radius: 8px; margin-bottom: 20px; font-family: 'Orbitron', sans-serif; text-align: center;
        }

        /* Header */
        .admin-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; border-bottom: 1px solid var(--cyber-border); margin-bottom: 20px;
        }
        .admin-header h2 { font-family: 'Orbitron', sans-serif; color: var(--cyber-gold); margin: 0; font-size: 1.2rem; }

        /* Cards */
        .cyber-card {
            background: var(--cyber-surface); border-radius: 15px; border: 1px solid var(--cyber-border);
            padding: 20px; margin-bottom: 20px; position: relative;
        }
        .upload-zone {
            border: 2px dashed var(--cyber-border); border-radius: 12px; padding: 30px;
            text-align: center; cursor: pointer; background: rgba(245, 166, 35, 0.03);
        }
        .upload-zone i { font-size: 3rem; color: var(--cyber-gold); margin-bottom: 10px; }

        /* Status & Results */
        .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .status-item { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .status-item .label { font-size: 0.7rem; color: #888; text-transform: uppercase; }
        .status-item .value { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--cyber-gold); }

        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .data-table th { text-align: left; padding: 12px; background: rgba(245, 166, 35, 0.1); color: var(--cyber-gold); font-family: 'Orbitron'; font-size: 0.7rem; }
        .data-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
        .badge-gain { background: rgba(0, 255, 100, 0.1); color: #00ff64; }
        .badge-loss { background: rgba(255, 50, 50, 0.1); color: #ff3232; }

        /* System Log */
        .system-log {
            background: #000; border-radius: 8px; padding: 15px; font-family: monospace;
            font-size: 0.75rem; color: #00ff00; height: 100px; overflow-y: auto; margin-top: 20px;
            border: 1px solid #333;
        }

        .cyber-btn {
            padding: 10px 20px; background: var(--cyber-gold); color: black; border: none;
            border-radius: 5px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; font-size: 0.75rem;
        }
        .cyber-btn.secondary { background: transparent; border: 1px solid var(--cyber-border); color: var(--cyber-gold); }

        #canvas-debug { display: none; }
        .loader { display: none; text-align: center; margin: 20px 0; color: var(--cyber-gold); }
    </style>
</head>
<body class="admin-body">

<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h1>ACCESS_KEY</h1>
        <input type="password" id="adminPassword" class="cyber-input" placeholder="••••••" onkeypress="if(event.key==='Enter')checkLogin()">
        <button class="cyber-btn" style="width: 100%;" onclick="checkLogin()">VERIFY_IDENTITY</button>
    </div>
</div>

<div class="cyber-container" id="adminContent" style="display:none;">
    <div class="admin-header">
        <h2>COMMAND_CENTER</h2>
        <button class="cyber-btn secondary" onclick="window.location.href='index.html'">HOME</button>
    </div>

    <div class="cyber-card">
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-microchip"></i>
            <p>UPLOAD_SCREENSHOTS (MAX 12)</p>
            <input type="file" id="fileInput" hidden multiple accept="image/*" onchange="handleFiles(event)">
        </div>
    </div>

    <div class="loader" id="loader">
        <i class="fas fa-sync fa-spin fa-2x"></i>
        <p id="loaderText" style="margin-top: 10px;">ANALYZING_IMAGE_SECTORS...</p>
    </div>

    <div id="resultsArea" style="display:none;">
        <div class="status-grid">
            <div class="status-item"><div class="label">Matched</div><div class="value" id="statMatched">0</div></div>
            <div class="status-item"><div class="label">Skipped</div><div class="value" id="statSkipped">0</div></div>
            <div class="status-item"><div class="label">Total Delta</div><div class="value" id="statDelta">0</div></div>
        </div>

        <div class="cyber-card" style="padding: 0; overflow: hidden;">
            <table class="data-table">
                <thead>
                    <tr><th>Unit</th><th>Might</th><th>Delta</th><th>Kills</th></tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>
        
        <div style="text-align: right; margin-top: 15px;">
            <button class="cyber-btn" onclick="syncToSheet()">SYNC_MAINFRAME</button>
        </div>
    </div>

    <div class="system-log" id="systemLog">
        > SYSTEM_INITIALIZED...<br>
        > AWAITING_INPUT_DATA...
    </div>
</div>

<canvas id="canvas-debug"></canvas>

<script>
    const ADMIN_PASS = '523890';
    const SHEET_ID = '1U32usFizcgYfiN2URc9s4tteVXDBZoSDS2AK-KoBfjI';
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
    
    let oldData = [];
    let masterMap = new Map();
    let skippedCount = 0;

    function log(msg) {
        const logBox = document.getElementById('systemLog');
        logBox.innerHTML += `<br>> ${msg}`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function checkLogin() {
        if (document.getElementById('adminPassword').value === ADMIN_PASS) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            fetchSheet();
        }
    }

    async function fetchSheet() {
        log("CONNECTING_TO_MAINFRAME...");
        try {
            const res = await fetch(SHEET_URL);
            const csv = await res.text();
            oldData = parseCSV(csv);
            log(`SUCCESS: LOADED ${oldData.length} PLAYER_RECORDS.`);
        } catch (e) { log("ERROR: MAINFRAME_CONNECTION_FAILED."); }
    }

    function parseCSV(csv) {
        const lines = csv.split('\n').filter(l => l.trim());
        const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
        return lines.slice(1).map(line => {
            const values = line.match(/("[^"]*"|[^,]*)/g) || [];
            const obj = {};
            headers.forEach((h, i) => obj[h] = (values[i] || '').replace(/"/g, '').trim());
            return obj;
        });
    }

    async function handleFiles(event) {
        const files = Array.from(event.target.files).slice(0, 12);
        if (files.length === 0) return;

        masterMap.clear();
        skippedCount = 0;
        document.getElementById('loader').style.display = 'block';
        document.getElementById('resultsArea').style.display = 'none';

        const worker = await Tesseract.createWorker({
            logger: m => { if(m.status === 'recognizing text') document.getElementById('loaderText').textContent = `SCANNING: ${Math.round(m.progress * 100)}%`; }
        });
        await worker.loadLanguage('eng');
        await worker.initialize('eng');

        for (const file of files) {
            log(`PROCESSING_SECTOR: ${file.name}`);
            const processedImg = await preProcess(file);
            const { data: { text } } = await worker.recognize(processedImg);
            parseText(text);
        }

        await worker.terminate();
        render();
    }

    // High-Precision Pre-Processing: Grayscale & Contrast
    function preProcess(file) {
        return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.getElementById('canvas-debug');
                    const ctx = canvas.getContext('2d');
                    
                    // Focus on middle area (ignore top/bottom UI)
                    const cropY = img.height * 0.15;
                    const cropH = img.height * 0.70;
                    canvas.width = img.width;
                    canvas.height = cropH;
                    
                    ctx.filter = 'grayscale(1) contrast(1.5)';
                    ctx.drawImage(img, 0, cropY, img.width, cropH, 0, 0, img.width, cropH);
                    resolve(canvas.toDataURL());
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function parseText(text) {
        const lines = text.split('\n');
        lines.forEach(line => {
            if (line.match(/Casualties|Bloodbath|Mail|Members|relocate|chaos/i)) return;

            const numbers = line.match(/[\d,.]+/g);
            if (numbers && numbers.length >= 2) {
                let rawName = line.replace(/[\d,.]+/g, '').replace(/[|#]/g, '').trim();
                if (rawName.length < 2) return;

                const match = findMatch(rawName);
                if (match) {
                    const m = parseInt(numbers[0].replace(/,/g, ''));
                    const k = parseInt(numbers[1].replace(/,/g, ''));
                    if (!isNaN(m) && !isNaN(k)) {
                        masterMap.set(match.Player, {
                            name: match.Player,
                            might: m,
                            oldMight: parseV(match.Might),
                            kills: k,
                            oldKills: parseV(match['Player Kill'])
                        });
                    }
                } else {
                    skippedCount++;
                    log(`ANOMALY: UNKNOWN_UNIT [${rawName}]`);
                }
            }
        });
    }

    function findMatch(name) {
        return oldData.find(p => {
            const sim = similarity(name.toLowerCase(), p.Player.toLowerCase());
            return sim > 0.65; // Balanced threshold
        });
    }

    function similarity(s1, s2) {
        let longer = s1.length > s2.length ? s1 : s2;
        let shorter = s1.length > s2.length ? s2 : s1;
        if (longer.length === 0) return 1.0;
        return (longer.length - editDistance(longer, shorter)) / parseFloat(longer.length);
    }

    function editDistance(s1, s2) {
        const costs = [];
        for (let i = 0; i <= s1.length; i++) {
            let last = i;
            for (let j = 0; j <= s2.length; j++) {
                if (i === 0) costs[j] = j;
                else if (j > 0) {
                    let newVal = costs[j - 1];
                    if (s1.charAt(i - 1) !== s2.charAt(j - 1)) newVal = Math.min(Math.min(newVal, last), costs[j]) + 1;
                    costs[j - 1] = last; last = newVal;
                }
            }
            if (i > 0) costs[s2.length] = last;
        }
        return costs[s2.length];
    }

    function render() {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('resultsArea').style.display = 'block';
        const body = document.getElementById('resultsBody');
        body.innerHTML = '';
        
        let totalD = 0;
        masterMap.forEach(p => {
            const d = p.might - p.oldMight;
            totalD += d;
            const row = `<tr><td>${p.name}</td><td>${fmt(p.might)}</td><td><span class="badge ${d>=0?'badge-gain':'badge-loss'}">${d>=0?'+':''}${fmt(d)}</span></td><td>${fmt(p.kills)}</td></tr>`;
            body.innerHTML += row;
        });

        document.getElementById('statMatched').textContent = masterMap.size;
        document.getElementById('statSkipped').textContent = skippedCount;
        document.getElementById('statDelta').textContent = (totalD>=0?'+':'') + fmt(totalD);
        log(`ANALYSIS_COMPLETE: ${masterMap.size} UNITS_SYNCED.`);
    }

    function parseV(v) {
        if(!v) return 0;
        v = v.toString().toUpperCase().replace(/,/g, '');
        if(v.endsWith('B')) return parseFloat(v)*1e9;
        if(v.endsWith('M')) return parseFloat(v)*1e6;
        if(v.endsWith('K')) return parseFloat(v)*1e3;
        return parseFloat(v);
    }

    function fmt(n) {
        const a = Math.abs(n);
        if(a>=1e9) return (n/1e9).toFixed(2)+'B';
        if(a>=1e6) return (n/1e6).toFixed(2)+'M';
        if(a>=1e3) return (n/1e3).toFixed(1)+'K';
        return n.toLocaleString();
    }

    function syncToSheet() { alert(`SYNC_LOCKED: Ready to push ${masterMap.size} records to GitHub Mainframe.`); }
</script>
</body>
</html>
