<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center Ultra - Lords Mobile Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        :root {
            --cyber-gold: #f5a623;
            --cyber-bg: #050508;
            --cyber-surface: rgba(20, 20, 30, 0.98);
            --cyber-border: rgba(245, 166, 35, 0.5);
        }

        body.admin-body { background: var(--cyber-bg); color: #e0e0e0; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        .cyber-container { max-width: 1000px; margin: 0 auto; padding: 15px; }

        /* Login */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 3000; }
        .login-card { background: var(--cyber-surface); padding: 40px; border-radius: 20px; border: 1px solid var(--cyber-border); text-align: center; width: 90%; max-width: 400px; box-shadow: 0 0 30px rgba(245, 166, 35, 0.2); }
        .cyber-input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--cyber-border); color: white; border-radius: 8px; margin-bottom: 20px; text-align: center; font-family: 'Orbitron'; }

        /* Header */
        .admin-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--cyber-border); margin-bottom: 20px; }
        .admin-header h2 { font-family: 'Orbitron'; color: var(--cyber-gold); margin: 0; font-size: 1.1rem; letter-spacing: 2px; }

        /* Summary Dashboard */
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .summary-item { background: rgba(245, 166, 35, 0.05); border: 1px solid var(--cyber-border); padding: 15px; border-radius: 12px; text-align: center; }
        .summary-item .label { font-size: 0.7rem; color: #888; text-transform: uppercase; }
        .summary-item .value { font-family: 'Orbitron'; font-size: 1.2rem; color: var(--cyber-gold); margin-top: 5px; }

        /* Cards */
        .cyber-card { background: var(--cyber-surface); border-radius: 15px; border: 1px solid var(--cyber-border); padding: 20px; margin-bottom: 20px; }
        .upload-zone { border: 2px dashed var(--cyber-border); border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; background: rgba(245, 166, 35, 0.02); transition: 0.3s; }
        .upload-zone:hover { background: rgba(245, 166, 35, 0.08); }
        .upload-zone i { font-size: 3rem; color: var(--cyber-gold); margin-bottom: 10px; }

        /* Vision Sliders */
        .vision-controls { display: flex; gap: 20px; margin-top: 15px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; font-size: 0.8rem; }
        .vision-controls label { color: var(--cyber-gold); font-family: 'Orbitron'; }

        /* Results Table */
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .data-table th { text-align: left; padding: 10px; background: rgba(245, 166, 35, 0.1); color: var(--cyber-gold); font-family: 'Orbitron'; font-size: 0.7rem; }
        .data-table td { padding: 10px; border-bottom: 1px solid #333; }
        
        .player-select { background: #000; color: var(--cyber-gold); border: 1px solid var(--cyber-border); padding: 5px; border-radius: 4px; width: 100%; font-size: 0.8rem; }
        .ocr-hint { font-size: 0.7rem; color: #888; display: block; margin-top: 4px; font-style: italic; }

        .badge { padding: 3px 6px; border-radius: 4px; font-weight: bold; }
        .badge-gain { background: rgba(0, 255, 100, 0.1); color: #00ff64; }
        .badge-loss { background: rgba(255, 50, 50, 0.1); color: #ff3232; }

        .cyber-btn { padding: 10px 20px; background: var(--cyber-gold); color: black; border: none; border-radius: 5px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; font-size: 0.8rem; transition: 0.3s; }
        .cyber-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--cyber-gold); }
        .cyber-btn.secondary { background: transparent; border: 1px solid var(--cyber-border); color: var(--cyber-gold); }
        
        .loader { display: none; text-align: center; margin: 20px 0; color: var(--cyber-gold); }
        #canvas-proc { display: none; }
    </style>
</head>
<body class="admin-body">

<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h1 style="color: var(--cyber-gold); font-family: 'Orbitron'; letter-spacing: 5px;">COMMAND CENTER</h1>
        <input type="password" id="adminPassword" class="cyber-input" placeholder="ACCESS KEY" onkeypress="if(event.key==='Enter')checkLogin()">
        <button class="cyber-btn" style="width: 100%;" onclick="checkLogin()">INITIATE ACCESS</button>
    </div>
</div>

<div class="cyber-container" id="adminContent" style="display:none;">
    <div class="admin-header">
        <h2>ULTRA_COMMAND_v2.0</h2>
        <div style="display: flex; gap: 10px;">
            <button class="cyber-btn secondary" onclick="resetAll()">RESET</button>
            <button class="cyber-btn secondary" onclick="window.location.href='index.html'">EXIT</button>
        </div>
    </div>

    <div class="summary-grid" id="summaryGrid" style="display:none;">
        <div class="summary-item"><div class="label">Units Scanned</div><div class="value" id="sumUnits">0</div></div>
        <div class="summary-item"><div class="label">Total Might Delta</div><div class="value" id="sumMight">0</div></div>
        <div class="summary-item"><div class="label">Total Kills Gain</div><div class="value" id="sumKills">0</div></div>
    </div>

    <div class="cyber-card">
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-microchip"></i>
            <p>UPLOAD SCREENSHOTS (MAX 12)</p>
            <input type="file" id="fileInput" hidden multiple accept="image/*" onchange="handleFiles(event)">
        </div>
        <div class="vision-controls">
            <div><label>Contrast:</label> <input type="range" id="vContrast" min="1" max="3" step="0.1" value="1.8"></div>
            <div><label>Brightness:</label> <input type="range" id="vBright" min="0.5" max="2" step="0.1" value="1.1"></div>
        </div>
    </div>

    <div class="loader" id="loader">
        <i class="fas fa-atom fa-spin fa-3x"></i>
        <p id="loaderText" style="margin-top: 15px; font-family: 'Orbitron';">SCANNING_DATA_SECTORS...</p>
    </div>

    <div id="resultsArea" style="display:none;">
        <div class="cyber-card" style="padding: 0; overflow-x: auto;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Assigned Unit</th>
                        <th>New Might</th>
                        <th>Might Delta</th>
                        <th>New Kills</th>
                        <th>Kills Incr.</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>
        
        <div style="text-align: right; margin-top: 20px;">
            <button class="cyber-btn" onclick="syncToSheet()"><i class="fas fa-cloud-upload-alt"></i> SYNC_TO_MAINFRAME</button>
        </div>
    </div>
</div>

<canvas id="canvas-proc"></canvas>

<script>
    const ADMIN_PASS = '523890';
    const SHEET_ID = '1U32usFizcgYfiN2URc9s4tteVXDBZoSDS2AK-KoBfjI';
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
    
    let oldData = [];
    let scannedRows = [];
    let aiMemory = JSON.parse(localStorage.getItem('ai_memory') || '{}');

    function checkLogin() {
        if (document.getElementById('adminPassword').value === ADMIN_PASS) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            fetchMainframe();
            loadSavedData();
        }
    }

    async function fetchMainframe() {
        try {
            const res = await fetch(SHEET_URL + '&cb=' + Date.now());
            const csv = await res.text();
            oldData = parseCSV(csv);
        } catch (e) { console.error("Mainframe Link Offline"); }
    }

    function parseCSV(csv) {
        const lines = csv.split('\n').filter(l => l.trim());
        const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
        return lines.slice(1).map(line => {
            const values = line.match(/("[^"]*"|[^,]*)/g) || [];
            const obj = {};
            headers.forEach((h, i) => obj[h] = (values[i] || '').replace(/"/g, '').trim());
            return obj;
        });
    }

    function loadSavedData() {
        const saved = localStorage.getItem('last_scan_data');
        if (saved) {
            scannedRows = JSON.parse(saved);
            render();
        }
    }

    async function handleFiles(event) {
        const files = Array.from(event.target.files).slice(0, 12);
        if (files.length === 0) return;

        document.getElementById('loader').style.display = 'block';
        document.getElementById('resultsArea').style.display = 'none';

        const worker = await Tesseract.createWorker();
        await worker.loadLanguage('eng');
        await worker.initialize('eng');

        for (const file of files) {
            const img = await preProcess(file);
            const { data: { text } } = await worker.recognize(img);
            extract(text);
        }

        await worker.terminate();
        render();
    }

    function preProcess(file) {
        return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.getElementById('canvas-proc');
                    const ctx = canvas.getContext('2d');
                    const cropY = img.height * 0.15;
                    const cropH = img.height * 0.70;
                    canvas.width = img.width;
                    canvas.height = cropH;
                    
                    const contrast = document.getElementById('vContrast').value;
                    const brightness = document.getElementById('vBright').value;
                    
                    ctx.filter = `grayscale(1) contrast(${contrast}) brightness(${brightness})`;
                    ctx.drawImage(img, 0, cropY, img.width, cropH, 0, 0, img.width, cropH);
                    resolve(canvas.toDataURL());
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function extract(text) {
        const lines = text.split('\n');
        lines.forEach(line => {
            if (line.match(/Casualties|Bloodbath|Mail|Members|relocate|chaos/i)) return;
            const nums = line.match(/[\d,.]+/g);
            if (nums && nums.length >= 2) {
                let raw = line.replace(/[\d,.]+/g, '').replace(/[|#]/g, '').trim();
                if (raw.length < 2) return;
                
                // AI Memory Check
                let assigned = aiMemory[raw] || "";
                if (!assigned) {
                    const match = oldData.find(p => similarity(raw.toLowerCase(), p.Player.toLowerCase()) > 0.75);
                    if (match) assigned = match.Player;
                }

                scannedRows.push({
                    raw: raw,
                    assigned: assigned,
                    might: parseInt(nums[0].replace(/,/g, '')),
                    kills: parseInt(nums[1].replace(/,/g, ''))
                });
            }
        });
    }

    function render() {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('resultsArea').style.display = 'block';
        document.getElementById('summaryGrid').style.display = 'grid';
        
        const body = document.getElementById('resultsBody');
        body.innerHTML = '';
        
        let tUnits = 0, tMight = 0, tKills = 0;

        scannedRows.forEach((row, i) => {
            const p = oldData.find(u => u.Player === row.assigned);
            const om = p ? parseV(p.Might) : 0;
            const ok = p ? parseV(p['Player Kill']) : 0;
            const dm = row.might - om;
            const dk = row.kills - ok;

            if (row.assigned) {
                tUnits++;
                tMight += dm;
                tKills += dk;
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <select class="player-select" onchange="updateUnit(${i}, this.value)">
                        <option value="">-- ASSIGN UNIT --</option>
                        ${oldData.map(u => `<option value="${u.Player}" ${u.Player === row.assigned ? 'selected' : ''}>${u.Player}</option>`).join('')}
                    </select>
                    <span class="ocr-hint">RAW: "${row.raw}"</span>
                </td>
                <td style="font-family:Orbitron;">${fmt(row.might)}</td>
                <td><span class="badge ${dm >= 0 ? 'badge-gain' : 'badge-loss'}">${dm >= 0 ? '+' : ''}${fmt(dm)}</span></td>
                <td style="font-family:Orbitron;">${fmt(row.kills)}</td>
                <td><span class="badge badge-gain">+${fmt(dk)}</span></td>
            `;
            body.appendChild(tr);
        });

        document.getElementById('sumUnits').textContent = tUnits;
        document.getElementById('sumMight').textContent = (tMight >= 0 ? '+' : '') + fmt(tMight);
        document.getElementById('sumKills').textContent = '+' + fmt(tKills);
        
        localStorage.setItem('last_scan_data', JSON.stringify(scannedRows));
    }

    function updateUnit(i, name) {
        scannedRows[i].assigned = name;
        // Save to AI Memory
        if (name) {
            aiMemory[scannedRows[i].raw] = name;
            localStorage.setItem('ai_memory', JSON.stringify(aiMemory));
        }
        render();
    }

    function similarity(s1, s2) {
        let longer = s1.length > s2.length ? s1 : s2;
        let shorter = s1.length > s2.length ? s2 : s1;
        if (longer.length === 0) return 1.0;
        return (longer.length - editDist(longer, shorter)) / parseFloat(longer.length);
    }

    function editDist(s1, s2) {
        const costs = [];
        for (let i = 0; i <= s1.length; i++) {
            let last = i;
            for (let j = 0; j <= s2.length; j++) {
                if (i === 0) costs[j] = j;
                else if (j > 0) {
                    let newVal = costs[j - 1];
                    if (s1.charAt(i - 1) !== s2.charAt(j - 1)) newVal = Math.min(Math.min(newVal, last), costs[j]) + 1;
                    costs[j - 1] = last; last = newVal;
                }
            }
            if (i > 0) costs[s2.length] = last;
        }
        return costs[s2.length];
    }

    function parseV(v) {
        if(!v) return 0;
        v = v.toString().toUpperCase().replace(/,/g, '');
        if(v.endsWith('B')) return parseFloat(v)*1e9;
        if(v.endsWith('M')) return parseFloat(v)*1e6;
        if(v.endsWith('K')) return parseFloat(v)*1e3;
        return parseFloat(v);
    }

    function fmt(n) {
        const a = Math.abs(n);
        if(a>=1e9) return (n/1e9).toFixed(2)+'B';
        if(a>=1e6) return (n/1e6).toFixed(2)+'M';
        if(a>=1e3) return (n/1e3).toFixed(1)+'K';
        return n.toLocaleString();
    }

    function resetAll() {
        scannedRows = [];
        localStorage.removeItem('last_scan_data');
        render();
    }

    function syncToSheet() {
        alert(`SYNC_MAINFRAME: Uploading ${scannedRows.filter(r=>r.assigned).length} unit records.`);
    }
</script>
</body>
</html>
