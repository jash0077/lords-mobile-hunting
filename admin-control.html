<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control - Lords Mobile Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        .admin-container { max-width: 1000px; margin: 20px auto; padding: 15px; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark-bg); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .login-box { background: var(--dark-surface); padding: 30px; border-radius: 16px; border: 1px solid var(--dark-border); text-align: center; width: 90%; max-width: 400px; }
        .login-box input { width: 100%; padding: 12px; margin: 20px 0; background: #000; border: 1px solid var(--dark-border); color: white; border-radius: 8px; }
        
        .ocr-section { background: var(--dark-surface); border-radius: 16px; padding: 20px; border: 1px solid var(--dark-border); margin-top: 10px; }
        .upload-area { border: 2px dashed var(--dark-border); border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; transition: all 0.3s; margin-bottom: 20px; }
        .upload-area:hover { border-color: var(--accent-blue); background: rgba(77, 148, 255, 0.05); }
        .upload-area i { font-size: 2.5em; color: var(--accent-blue); margin-bottom: 10px; }
        
        .queue-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .queue-item { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--dark-border); aspect-ratio: 1; }
        .queue-item img { width: 100%; height: 100%; object-fit: cover; }
        .queue-item.done { border-color: var(--accent-green); }
        .queue-item.processing { border-color: var(--accent-blue); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .results-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #000; border-radius: 8px; font-size: 0.85em; }
        .results-table th, .results-table td { padding: 10px; text-align: left; border-bottom: 1px solid var(--dark-border); }
        .results-table th { background: var(--dark-elevated); color: var(--accent-blue); position: sticky; top: 0; }
        
        .comparison-badge { padding: 3px 6px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
        .gain { background: rgba(63, 185, 80, 0.2); color: var(--accent-green); }
        .loss { background: rgba(248, 81, 73, 0.2); color: #f85149; }
        
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; font-size: 0.9em; }
        .btn-primary { background: var(--accent-blue); color: white; }
        .btn-success { background: var(--accent-green); color: white; }
        .btn-secondary { background: var(--dark-elevated); color: white; }
        
        .loading-spinner { display: none; margin: 20px 0; text-align: center; color: var(--accent-blue); }
        
        /* Mobile adjustments */
        @media (max-width: 600px) {
            .results-table th:nth-child(4), .results-table td:nth-child(4) { display: none; }
            .admin-container { padding: 10px; }
        }
    </style>
</head>
<body class="dark-mode">

<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <i class="fas fa-user-shield fa-3x" style="color: var(--accent-blue); margin-bottom: 20px;"></i>
        <h2>Admin Control</h2>
        <input type="password" id="adminPassword" placeholder="Password" onkeypress="if(event.key==='Enter')checkLogin()">
        <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="checkLogin()">Login</button>
        <p id="loginError" style="color: #f85149; margin-top: 15px; display: none;">Invalid Password</p>
    </div>
</div>

<div class="container admin-container" id="adminContent" style="display:none;">
    <header style="background: none; box-shadow: none; padding: 0; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
        <div class="logo" style="font-size: 1.2em;">Admin Panel</div>
        <a href="index.html" class="btn btn-secondary" style="padding: 8px 15px;"><i class="fas fa-home"></i> Home</a>
    </header>

    <div class="ocr-section">
        <h3><i class="fas fa-camera"></i> Multi-Screenshot Scan</h3>
        <p style="color: var(--dark-secondary-text); font-size: 0.9em; margin-bottom: 15px;">Upload up to 12 screenshots. The tool will auto-correct names and calculate differences.</p>
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-images"></i>
            <p>Select Screenshots (Max 12)</p>
            <input type="file" id="fileInput" hidden accept="image/*" multiple onchange="handleImages(event)">
        </div>

        <div class="queue-list" id="queueList"></div>

        <div class="loading-spinner" id="loader">
            <i class="fas fa-circle-notch fa-spin fa-2x"></i>
            <p id="loaderText" style="margin-top: 10px; font-size: 0.9em;">Ready to scan...</p>
        </div>

        <div id="resultsArea" style="display:none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h4><i class="fas fa-check-circle"></i> Results</h4>
                <span id="matchStats" style="font-size: 0.8em; color: var(--accent-green);"></span>
            </div>
            <div style="overflow-x: auto; max-height: 400px; border: 1px solid var(--dark-border); border-radius: 8px;">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Player</th>
                            <th>New Might</th>
                            <th>Diff</th>
                            <th>New Kills</th>
                            <th>Kills+</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
            <div class="btn-group">
                <button class="btn btn-success" onclick="syncToSheet()"><i class="fas fa-sync"></i> Sync to Google Sheet</button>
                <button class="btn btn-secondary" onclick="resetOCR()">Reset All</button>
            </div>
        </div>
    </div>
</div>

<script>
    const ADMIN_PASS = '523890';
    const SHEET_ID = '1U32usFizcgYfiN2URc9s4tteVXDBZoSDS2AK-KoBfjI';
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
    
    let oldData = [];
    let masterData = new Map(); // Using Map to handle unique players across multiple screenshots
    let imageQueue = [];
    let isProcessing = false;

    function checkLogin() {
        if (document.getElementById('adminPassword').value === ADMIN_PASS) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            fetchOldData();
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    async function fetchOldData() {
        try {
            const response = await fetch(SHEET_URL);
            const csv = await response.text();
            oldData = parseCSV(csv);
            console.log("Old data loaded:", oldData.length, "players");
        } catch (e) { console.error("Error fetching old data", e); }
    }

    function parseCSV(csv) {
        const lines = csv.split('\n').filter(l => l.trim());
        if (lines.length < 2) return [];
        const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
        return lines.slice(1).map(line => {
            const values = line.match(/("[^"]*"|[^,]*)/g) || [];
            const obj = {};
            headers.forEach((h, i) => obj[h] = (values[i] || '').replace(/"/g, '').trim());
            return obj;
        });
    }

    async function handleImages(event) {
        const files = Array.from(event.target.files).slice(0, 12);
        if (files.length === 0) return;

        resetOCR();
        const queueList = document.getElementById('queueList');
        
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const reader = new FileReader();
            reader.onload = (e) => {
                const div = document.createElement('div');
                div.className = 'queue-item';
                div.id = `queue-${i}`;
                div.innerHTML = `<img src="${e.target.result}">`;
                queueList.appendChild(div);
                imageQueue.push({ id: i, data: e.target.result });
                if (i === files.length - 1) startProcessing();
            };
            reader.readAsDataURL(file);
        }
    }

    async function startProcessing() {
        if (isProcessing || imageQueue.length === 0) return;
        isProcessing = true;
        document.getElementById('loader').style.display = 'block';
        document.getElementById('resultsArea').style.display = 'none';

        const worker = await Tesseract.createWorker({
            logger: m => {
                if (m.status === 'recognizing text') {
                    const current = imageQueue[0].id + 1;
                    const total = imageQueue.length + masterData.size/8; // rough estimate
                    document.getElementById('loaderText').textContent = `Processing Image ${current}... ${Math.round(m.progress * 100)}%`;
                }
            }
        });

        await worker.loadLanguage('eng');
        await worker.initialize('eng');

        while (imageQueue.length > 0) {
            const img = imageQueue.shift();
            const item = document.getElementById(`queue-${img.id}`);
            item.className = 'queue-item processing';
            
            const { data: { text } } = await worker.recognize(img.data);
            processText(text);
            
            item.className = 'queue-item done';
        }

        await worker.terminate();
        isProcessing = false;
        renderResults();
    }

    function processText(text) {
        const lines = text.split('\n').filter(l => l.trim().length > 3);
        
        lines.forEach(line => {
            // Clean noise like "Casualties", "What A Bloodbath", "Mail"
            if (line.match(/Casualties|Bloodbath|Mail|Members|relocate|chaos/i)) return;

            const numbers = line.match(/[\d,.]+/g);
            if (numbers && numbers.length >= 2) {
                let name = line.replace(/[\d,.]+/g, '').replace(/[|#]/g, '').trim();
                if (name.length < 3) return;

                // Fuzzy Match Name with Old Data
                const matchedPlayer = findBestMatch(name);
                if (matchedPlayer) {
                    const finalName = matchedPlayer.Player;
                    const mightStr = numbers[0].replace(/,/g, '');
                    const killsStr = numbers[1].replace(/,/g, '');
                    
                    const newMight = parseInt(mightStr);
                    const newKills = parseInt(killsStr);

                    if (!isNaN(newMight) && !isNaN(newKills)) {
                        masterData.set(finalName, {
                            name: finalName,
                            newMight: newMight,
                            oldMight: parseValue(matchedPlayer.Might),
                            newKills: newKills,
                            oldKills: parseValue(matchedPlayer['Player Kill'])
                        });
                    }
                }
            }
        });
    }

    // Fuzzy matching logic to fix OCR errors
    function findBestMatch(scannedName) {
        let bestMatch = null;
        let maxSimilarity = 0;

        oldData.forEach(p => {
            const sim = similarity(scannedName.toLowerCase(), p.Player.toLowerCase());
            if (sim > maxSimilarity) {
                maxSimilarity = sim;
                bestMatch = p;
            }
        });

        return maxSimilarity > 0.6 ? bestMatch : null;
    }

    function similarity(s1, s2) {
        let longer = s1, shorter = s2;
        if (s1.length < s2.length) { longer = s2; shorter = s1; }
        const longerLength = longer.length;
        if (longerLength === 0) return 1.0;
        return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
    }

    function editDistance(s1, s2) {
        const costs = [];
        for (let i = 0; i <= s1.length; i++) {
            let lastValue = i;
            for (let j = 0; j <= s2.length; j++) {
                if (i === 0) costs[j] = j;
                else if (j > 0) {
                    let newValue = costs[j - 1];
                    if (s1.charAt(i - 1) !== s2.charAt(j - 1))
                        newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                    costs[j - 1] = lastValue;
                    lastValue = newValue;
                }
            }
            if (i > 0) costs[s2.length] = lastValue;
        }
        return costs[s2.length];
    }

    function renderResults() {
        const body = document.getElementById('resultsBody');
        body.innerHTML = '';
        
        masterData.forEach(p => {
            const mightDiff = p.newMight - p.oldMight;
            const killsDiff = p.newKills - p.oldKills;
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${p.name}</td>
                <td>${formatNumber(p.newMight)}</td>
                <td><span class="comparison-badge ${mightDiff >= 0 ? 'gain' : 'loss'}">${mightDiff >= 0 ? '+' : ''}${formatNumber(mightDiff)}</span></td>
                <td>${formatNumber(p.newKills)}</td>
                <td><span class="comparison-badge gain">+${formatNumber(killsDiff)}</span></td>
            `;
            body.appendChild(row);
        });

        document.getElementById('loader').style.display = 'none';
        document.getElementById('resultsArea').style.display = 'block';
        document.getElementById('matchStats').textContent = `Successfully matched ${masterData.size} players.`;
    }

    function parseValue(val) {
        if (!val) return 0;
        val = val.toString().toUpperCase().replace(/,/g, '');
        if (val.endsWith('B')) return parseFloat(val) * 1e9;
        if (val.endsWith('M')) return parseFloat(val) * 1e6;
        if (val.endsWith('K')) return parseFloat(val) * 1e3;
        return parseFloat(val);
    }

    function formatNumber(num) {
        if (Math.abs(num) >= 1e9) return (num / 1e9).toFixed(2) + 'B';
        if (Math.abs(num) >= 1e6) return (num / 1e6).toFixed(2) + 'M';
        if (Math.abs(num) >= 1e3) return (num / 1e3).toFixed(1) + 'K';
        return num.toLocaleString();
    }

    function syncToSheet() {
        alert("Syncing " + masterData.size + " records to Google Sheet... This feature will use your GitHub token to push updates!");
    }

    function resetOCR() {
        document.getElementById('queueList').innerHTML = '';
        document.getElementById('resultsArea').style.display = 'none';
        masterData.clear();
        imageQueue = [];
    }
</script>
</body>
</html>
