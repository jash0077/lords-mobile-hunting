<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fail-Proof Command Center - Lords Mobile Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        :root {
            --cyber-gold: #f5a623;
            --cyber-bg: #050508;
            --cyber-surface: rgba(20, 20, 30, 0.95);
            --cyber-border: rgba(245, 166, 35, 0.4);
        }

        body.admin-body { background: var(--cyber-bg); color: #e0e0e0; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        .cyber-container { max-width: 1000px; margin: 0 auto; padding: 15px; }

        /* Login */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 3000; }
        .login-card { background: var(--cyber-surface); padding: 40px; border-radius: 20px; border: 1px solid var(--cyber-border); text-align: center; width: 90%; max-width: 400px; }
        .cyber-input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--cyber-border); color: white; border-radius: 8px; margin-bottom: 20px; text-align: center; }

        /* Header */
        .admin-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--cyber-border); margin-bottom: 20px; }
        .admin-header h2 { font-family: 'Orbitron'; color: var(--cyber-gold); margin: 0; font-size: 1.2rem; }

        /* Cards */
        .cyber-card { background: var(--cyber-surface); border-radius: 15px; border: 1px solid var(--cyber-border); padding: 20px; margin-bottom: 20px; }
        .upload-zone { border: 2px dashed var(--cyber-border); border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; }
        .upload-zone i { font-size: 3rem; color: var(--cyber-gold); margin-bottom: 10px; }

        /* Results Table */
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .data-table th { text-align: left; padding: 10px; background: rgba(245, 166, 35, 0.1); color: var(--cyber-gold); font-family: 'Orbitron'; }
        .data-table td { padding: 10px; border-bottom: 1px solid #333; }
        
        .player-select { background: #000; color: var(--cyber-gold); border: 1px solid var(--cyber-border); padding: 5px; border-radius: 4px; width: 100%; font-size: 0.8rem; }
        .ocr-hint { font-size: 0.7rem; color: #888; display: block; margin-top: 4px; font-style: italic; }

        .badge { padding: 3px 6px; border-radius: 4px; font-weight: bold; }
        .badge-gain { background: rgba(0, 255, 100, 0.1); color: #00ff64; }
        .badge-loss { background: rgba(255, 50, 50, 0.1); color: #ff3232; }

        .cyber-btn { padding: 10px 20px; background: var(--cyber-gold); color: black; border: none; border-radius: 5px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .cyber-btn.secondary { background: transparent; border: 1px solid var(--cyber-border); color: var(--cyber-gold); }
        
        .loader { display: none; text-align: center; margin: 20px 0; color: var(--cyber-gold); }
    </style>
</head>
<body class="admin-body">

<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h1 style="color: var(--cyber-gold); font-family: 'Orbitron';">COMMAND CENTER</h1>
        <input type="password" id="adminPassword" class="cyber-input" placeholder="ACCESS KEY" onkeypress="if(event.key==='Enter')checkLogin()">
        <button class="cyber-btn" style="width: 100%;" onclick="checkLogin()">INITIATE ACCESS</button>
    </div>
</div>

<div class="cyber-container" id="adminContent" style="display:none;">
    <div class="admin-header">
        <h2>FAIL_PROOF_SCANNER</h2>
        <button class="cyber-btn secondary" onclick="window.location.href='index.html'">EXIT</button>
    </div>

    <div class="cyber-card">
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-upload"></i>
            <p>UPLOAD SCREENSHOTS (MAX 12)</p>
            <input type="file" id="fileInput" hidden multiple accept="image/*" onchange="handleFiles(event)">
        </div>
    </div>

    <div class="loader" id="loader">
        <i class="fas fa-spinner fa-spin fa-2x"></i>
        <p id="loaderText" style="margin-top: 10px;">SCANNING_SECTORS...</p>
    </div>

    <div id="resultsArea" style="display:none;">
        <div class="cyber-card" style="padding: 0; overflow-x: auto;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Assign Player</th>
                        <th>Scanned Might</th>
                        <th>Might Delta</th>
                        <th>Scanned Kills</th>
                        <th>Kills Incr.</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>
        
        <div style="text-align: right; margin-top: 20px; display: flex; justify-content: space-between;">
            <button class="cyber-btn secondary" onclick="resetAll()">RESET_SYSTEM</button>
            <button class="cyber-btn" onclick="syncToSheet()">SYNC_TO_MAINFRAME</button>
        </div>
    </div>
</div>

<canvas id="canvas-proc" style="display:none;"></canvas>

<script>
    const ADMIN_PASS = '523890';
    const SHEET_ID = '1U32usFizcgYfiN2URc9s4tteVXDBZoSDS2AK-KoBfjI';
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
    
    let oldData = [];
    let scannedRows = [];

    function checkLogin() {
        if (document.getElementById('adminPassword').value === ADMIN_PASS) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            fetchLatestData();
        }
    }

    async function fetchLatestData() {
        try {
            const res = await fetch(SHEET_URL + '&cache=' + Date.now());
            const csv = await res.text();
            oldData = parseCSV(csv);
            console.log("Mainframe Data Updated:", oldData.length, "units.");
        } catch (e) { alert("ERROR: Mainframe Connection Failed."); }
    }

    function parseCSV(csv) {
        const lines = csv.split('\n').filter(l => l.trim());
        const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
        return lines.slice(1).map(line => {
            const values = line.match(/("[^"]*"|[^,]*)/g) || [];
            const obj = {};
            headers.forEach((h, i) => obj[h] = (values[i] || '').replace(/"/g, '').trim());
            return obj;
        });
    }

    async function handleFiles(event) {
        const files = Array.from(event.target.files).slice(0, 12);
        if (files.length === 0) return;

        scannedRows = [];
        document.getElementById('loader').style.display = 'block';
        document.getElementById('resultsArea').style.display = 'none';

        const worker = await Tesseract.createWorker();
        await worker.loadLanguage('eng');
        await worker.initialize('eng');

        for (const file of files) {
            const imgData = await preProcess(file);
            const { data: { text } } = await worker.recognize(imgData);
            extractRows(text);
        }

        await worker.terminate();
        renderRows();
    }

    function preProcess(file) {
        return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.getElementById('canvas-proc');
                    const ctx = canvas.getContext('2d');
                    const cropY = img.height * 0.15;
                    const cropH = img.height * 0.70;
                    canvas.width = img.width;
                    canvas.height = cropH;
                    ctx.filter = 'grayscale(1) contrast(1.8) brightness(1.1)';
                    ctx.drawImage(img, 0, cropY, img.width, cropH, 0, 0, img.width, cropH);
                    resolve(canvas.toDataURL());
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function extractRows(text) {
        const lines = text.split('\n');
        lines.forEach(line => {
            if (line.match(/Casualties|Bloodbath|Mail|Members|relocate|chaos/i)) return;
            const numbers = line.match(/[\d,.]+/g);
            if (numbers && numbers.length >= 2) {
                let rawName = line.replace(/[\d,.]+/g, '').replace(/[|#]/g, '').trim();
                if (rawName.length < 2) return;
                
                // Smart Match
                const match = oldData.find(p => similarity(rawName.toLowerCase(), p.Player.toLowerCase()) > 0.7);
                
                scannedRows.push({
                    rawName: rawName,
                    assignedPlayer: match ? match.Player : "",
                    might: parseInt(numbers[0].replace(/,/g, '')),
                    kills: parseInt(numbers[1].replace(/,/g, ''))
                });
            }
        });
    }

    function renderRows() {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('resultsArea').style.display = 'block';
        const body = document.getElementById('resultsBody');
        body.innerHTML = '';

        scannedRows.forEach((row, index) => {
            const player = oldData.find(p => p.Player === row.assignedPlayer);
            const oldMight = player ? parseV(player.Might) : 0;
            const oldKills = player ? parseV(player['Player Kill']) : 0;
            const delta = row.might - oldMight;
            const kDelta = row.kills - oldKills;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <select class="player-select" onchange="updateRow(${index}, this.value)">
                        <option value="">-- Select Player --</option>
                        ${oldData.map(p => `<option value="${p.Player}" ${p.Player === row.assignedPlayer ? 'selected' : ''}>${p.Player}</option>`).join('')}
                    </select>
                    <span class="ocr-hint">AI read: "${row.rawName}"</span>
                </td>
                <td style="font-family:Orbitron;">${fmt(row.might)}</td>
                <td><span class="badge ${delta >= 0 ? 'badge-gain' : 'badge-loss'}">${delta >= 0 ? '+' : ''}${fmt(delta)}</span></td>
                <td style="font-family:Orbitron;">${fmt(row.kills)}</td>
                <td><span class="badge badge-gain">+${fmt(kDelta)}</span></td>
            `;
            body.appendChild(tr);
        });
    }

    function updateRow(index, playerName) {
        scannedRows[index].assignedPlayer = playerName;
        renderRows();
    }

    function similarity(s1, s2) {
        let longer = s1.length > s2.length ? s1 : s2;
        let shorter = s1.length > s2.length ? s2 : s1;
        if (longer.length === 0) return 1.0;
        return (longer.length - editDistance(longer, shorter)) / parseFloat(longer.length);
    }

    function editDistance(s1, s2) {
        const costs = [];
        for (let i = 0; i <= s1.length; i++) {
            let last = i;
            for (let j = 0; j <= s2.length; j++) {
                if (i === 0) costs[j] = j;
                else if (j > 0) {
                    let newVal = costs[j - 1];
                    if (s1.charAt(i - 1) !== s2.charAt(j - 1)) newVal = Math.min(Math.min(newVal, last), costs[j]) + 1;
                    costs[j - 1] = last; last = newVal;
                }
            }
            if (i > 0) costs[s2.length] = last;
        }
        return costs[s2.length];
    }

    function parseV(v) {
        if(!v) return 0;
        v = v.toString().toUpperCase().replace(/,/g, '');
        if(v.endsWith('B')) return parseFloat(v)*1e9;
        if(v.endsWith('M')) return parseFloat(v)*1e6;
        if(v.endsWith('K')) return parseFloat(v)*1e3;
        return parseFloat(v);
    }

    function fmt(n) {
        const a = Math.abs(n);
        if(a>=1e9) return (n/1e9).toFixed(2)+'B';
        if(a>=1e6) return (n/1e6).toFixed(2)+'M';
        if(a>=1e3) return (n/1e3).toFixed(1)+'K';
        return n.toLocaleString();
    }

    function resetAll() {
        scannedRows = [];
        document.getElementById('resultsArea').style.display = 'none';
        document.getElementById('fileInput').value = '';
    }

    function syncToSheet() {
        const ready = scannedRows.filter(r => r.assignedPlayer !== "").length;
        alert(`SYNC_READY: Sending ${ready} confirmed records to Mainframe.`);
    }
</script>
</body>
</html>
