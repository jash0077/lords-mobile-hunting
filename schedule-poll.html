<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Findtime — pick a time everyone can make</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7E9E1;
    --paper-2:#DEE1D7;
    --ink:#212B23;
    --ink-soft:#5B6459;
    --line:#C4CABB;
    --line-soft:#D3D7CB;
    --amber:#D98E2B;
    --amber-deep:#B5721C;
    --rust:#A6432F;
    --forest:#3F6B4A;
    --forest-deep:#2E5136;
    --card:#F1F2EC;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:28px 28px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:40px 20px 80px;}
  header.site{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:36px;padding-bottom:18px;border-bottom:2px solid var(--ink);}
  .brand{font-family:'Fraunces',serif;font-weight:600;font-size:26px;letter-spacing:-0.01em;cursor:pointer;}
  .brand span{color:var(--amber-deep);}
  .tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;}

  h1{font-family:'Fraunces',serif;font-weight:600;font-size:34px;line-height:1.15;margin:0 0 8px;letter-spacing:-0.01em;}
  h2{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin:0 0 4px;}
  .sub{color:var(--ink-soft);font-size:15px;margin:0 0 28px;line-height:1.5;}

  .card{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--radius);padding:26px;margin-bottom:20px;}
  .card + .card{margin-top:0;}

  label{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:6px;}
  input[type=text]{
    width:100%;font-family:'Inter',sans-serif;font-size:16px;padding:10px 12px;
    border:1.5px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);
    margin-bottom:18px;
  }
  input[type=text]:focus{outline:none;border-color:var(--ink);}

  .slot-row{display:flex;gap:8px;margin-bottom:8px;}
  .slot-row input{margin-bottom:0;}
  .icon-btn{
    border:1.5px solid var(--line);background:#fff;border-radius:var(--radius);
    width:42px;flex:0 0 42px;font-size:18px;cursor:pointer;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{border-color:var(--rust);color:var(--rust);}

  .add-slot{
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--forest-deep);
    background:none;border:1px dashed var(--forest);border-radius:var(--radius);
    padding:8px 14px;cursor:pointer;margin-top:6px;letter-spacing:.03em;
  }
  .add-slot:hover{background:rgba(63,107,74,0.08);}

  .btn{
    font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.04em;
    padding:13px 22px;border-radius:var(--radius);border:1.5px solid var(--ink);
    background:var(--ink);color:var(--paper);cursor:pointer;text-transform:uppercase;
  }
  .btn:hover{background:var(--amber-deep);border-color:var(--amber-deep);}
  .btn.secondary{background:transparent;color:var(--ink);}
  .btn.secondary:hover{background:var(--ink);color:var(--paper);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;}

  .code-block{
    font-family:'JetBrains Mono',monospace;font-size:28px;letter-spacing:.12em;
    background:var(--ink);color:var(--paper);padding:16px 20px;border-radius:var(--radius);
    text-align:center;margin:18px 0;
  }
  .link-row{display:flex;gap:8px;align-items:center;}
  .link-row input{flex:1;font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--paper-2);}

  .stamp{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.06em;
  }

  .slot-vote{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--radius);
    margin-bottom:10px;cursor:pointer;background:#fff;transition:border-color .1s;
  }
  .slot-vote:hover{border-color:var(--ink-soft);}
  .slot-vote.picked{border-color:var(--forest);background:rgba(63,107,74,0.08);}
  .slot-vote .label{font-size:15px;font-weight:500;}
  .check{
    width:22px;height:22px;border:1.5px solid var(--line);border-radius:50%;flex:0 0 22px;
    display:flex;align-items:center;justify-content:center;
  }
  .slot-vote.picked .check{border-color:var(--forest);background:var(--forest);color:#fff;font-size:13px;}

  .results-slot{
    border:1.5px solid var(--line);border-radius:var(--radius);margin-bottom:12px;
    padding:16px;background:#fff;position:relative;
  }
  .results-slot.best{border-color:var(--forest);border-width:2px;}
  .results-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .results-label{font-size:16px;font-weight:600;}
  .results-count{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-soft);}
  .bar-track{height:10px;background:var(--paper-2);border-radius:6px;overflow:hidden;margin-bottom:8px;}
  .bar-fill{height:100%;background:var(--amber);border-radius:6px;transition:width .3s;}
  .results-slot.best .bar-fill{background:var(--forest);}
  .names{font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .best-badge{
    position:absolute;top:-11px;right:14px;background:var(--forest);color:#fff;
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;
    padding:3px 9px;border-radius:20px;text-transform:uppercase;
  }

  .empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:30px 0;}
  .error{color:var(--rust);font-size:13px;margin-top:-10px;margin-bottom:14px;}
  a.plain{color:var(--forest-deep);}
  .footer-note{margin-top:30px;font-size:12px;color:var(--ink-soft);text-align:center;}
  .copied{color:var(--forest-deep);font-size:12px;margin-left:6px;font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <div class="brand" onclick="go('home')">find<span>time</span></div>
    <div class="tag">v1 · shared poll</div>
  </header>
  <div id="app"></div>
  <div class="footer-note">Anyone with the event code can vote. No accounts, no email.</div>
</div>

<script>
// Storage implementation for standalone use
window.storage = window.storage || {
  set: async (key, value) => {
    localStorage.setItem(key, value);
    return true;
  },
  get: async (key) => {
    const value = localStorage.getItem(key);
    return value ? { value } : null;
  }
};

const app = document.getElementById('app');
let state = { view:'home', eventId:null, eventData:null };

function esc(s){
  const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML;
}

function go(view, eventId){
  state.view = view;
  if(eventId) state.eventId = eventId;
  window.location.hash = eventId ? `${view}/${eventId}` : view;
  render();
}

function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

async function saveEvent(id, data){
  await window.storage.set('event:'+id, JSON.stringify(data), true);
}
async function loadEvent(id){
  try{
    const r = await window.storage.get('event:'+id, true);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}

// ---------- VIEWS ----------

function renderHome(){
  app.innerHTML = `
    <h1>Find a time that works for everyone.</h1>
    <p class="sub">Create an event, list a few time options, share the code. Everyone marks what works — you see the winner.</p>
    <div class="btn-row">
      <button class="btn" onclick="go('create')">Create an event</button>
      <button class="btn secondary" onclick="go('join')">I have a code</button>
    </div>
  `;
}

let draftSlots = ['', ''];
function renderCreate(){
  app.innerHTML = `
    <h2>New event</h2>
    <p class="sub">Give it a name and list the time options people can choose from.</p>
    <div class="card">
      <label for="title">Event name</label>
      <input type="text" id="title" placeholder="Team sync, coffee catch-up, guild raid…">
      <label for="desc">Details (optional)</label>
      <input type="text" id="desc" placeholder="Anything people should know">
      <label>Time options</label>
      <div id="slotList"></div>
      <button class="add-slot" onclick="addSlotField()">+ Add another option</button>
      <div class="error" id="createErr" style="display:none;"></div>
      <div class="btn-row">
        <button class="btn" onclick="submitCreate()">Create event</button>
        <button class="btn secondary" onclick="go('home')">Cancel</button>
      </div>
    </div>
  `;
  renderSlotFields();
}
function renderSlotFields(){
  const el = document.getElementById('slotList');
  el.innerHTML = draftSlots.map((v,i)=>`
    <div class="slot-row">
      <input type="text" value="${esc(v)}" placeholder="e.g. Mon Aug 4, 6:00 PM" oninput="draftSlots[${i}]=this.value">
      ${draftSlots.length>1?`<button class="icon-btn" onclick="removeSlotField(${i})">×</button>`:''}
    </div>
  `).join('');
}
function addSlotField(){ draftSlots.push(''); renderSlotFields(); }
function removeSlotField(i){ draftSlots.splice(i,1); renderSlotFields(); }

async function submitCreate(){
  const title = document.getElementById('title').value.trim();
  const desc = document.getElementById('desc').value.trim();
  const slots = draftSlots.map(s=>s.trim()).filter(Boolean);
  const errEl = document.getElementById('createErr');
  if(!title){ errEl.textContent='Give the event a name.'; errEl.style.display='block'; return; }
  if(slots.length < 2){ errEl.textContent='Add at least two time options.'; errEl.style.display='block'; return; }
  const id = genCode();
  const data = { title, desc, slots, responses: [], createdAt: Date.now() };
  await saveEvent(id, data);
  draftSlots = ['',''];
  go('share', id);
}

function renderShare(){
  const id = state.eventId;
  const url = window.location.href.split('#')[0] + '#vote/' + id;
  app.innerHTML = `
    <h2>Event created</h2>
    <p class="sub">Share this code or link — anyone who has it can add their availability.</p>
    <div class="card" style="text-align:center;">
      <div class="stamp">Event code</div>
      <div class="code-block">${id}</div>
      <div class="link-row">
        <input type="text" id="shareUrl" value="${esc(url)}" readonly>
        <button class="icon-btn" style="width:auto;padding:0 14px;" onclick="copyLink()">Copy</button>
      </div>
      <span id="copiedMsg" class="copied" style="display:none;">Copied ✓</span>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn" onclick="go('vote', '${id}')">Go to event</button>
        <button class="btn secondary" onclick="go('home')">Done</button>
      </div>
    </div>
  `;
}
function copyLink(){
  const inp = document.getElementById('shareUrl');
  inp.select();
  navigator.clipboard.writeText(inp.value).then(()=>{
    document.getElementById('copiedMsg').style.display='inline';
  }).catch(()=>{});
}

function renderJoin(){
  app.innerHTML = `
    <h2>Enter event code</h2>
    <p class="sub">Ask the organizer for the 6-character code.</p>
    <div class="card">
      <label for="joinCode">Code</label>
      <input type="text" id="joinCode" placeholder="ABC123" style="text-transform:uppercase;letter-spacing:.1em;font-family:'JetBrains Mono',monospace;">
      <div class="error" id="joinErr" style="display:none;"></div>
      <div class="btn-row">
        <button class="btn" onclick="submitJoin()">Continue</button>
        <button class="btn secondary" onclick="go('home')">Back</button>
      </div>
    </div>
  `;
  document.getElementById('joinCode').addEventListener('keydown', e=>{ if(e.key==='Enter') submitJoin(); });
}
async function submitJoin(){
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  const errEl = document.getElementById('joinErr');
  if(!code){ errEl.textContent='Enter a code.'; errEl.style.display='block'; return; }
  const data = await loadEvent(code);
  if(!data){ errEl.textContent="Can't find that event. Check the code and try again."; errEl.style.display='block'; return; }
  go('vote', code);
}

let pickedSlots = new Set();
async function renderVote(){
  app.innerHTML = `<div class="empty">Loading event…</div>`;
  const data = await loadEvent(state.eventId);
  if(!data){ app.innerHTML = `<div class="empty">Couldn't find that event.</div><div class="btn-row"><button class="btn secondary" onclick="go('home')">Back home</button></div>`; return; }
  state.eventData = data;
  pickedSlots = new Set();
  app.innerHTML = `
    <h2>${esc(data.title)}</h2>
    ${data.desc?`<p class="sub">${esc(data.desc)}</p>`:'<p class="sub"></p>'}
    <div class="card">
      <label for="voterName">Your name</label>
      <input type="text" id="voterName" placeholder="So people know it's you">
      <label>Select every time that works for you</label>
      <div id="slotVotes"></div>
      <div class="error" id="voteErr" style="display:none;"></div>
      <div class="btn-row">
        <button class="btn" onclick="submitVote()">Submit availability</button>
        <button class="btn secondary" onclick="go('results', '${state.eventId}')">See results</button>
      </div>
    </div>
    <div class="stamp" style="margin-top:10px;">Event code: ${state.eventId}</div>
  `;
  const votesEl = document.getElementById('slotVotes');
  votesEl.innerHTML = data.slots.map((s,i)=>`
    <div class="slot-vote" id="slotOpt${i}" onclick="toggleSlot(${i})">
      <span class="label">${esc(s)}</span>
      <span class="check"></span>
    </div>
  `).join('');
}
function toggleSlot(i){
  const el = document.getElementById('slotOpt'+i);
  if(pickedSlots.has(i)){ pickedSlots.delete(i); el.classList.remove('picked'); el.querySelector('.check').textContent=''; }
  else{ pickedSlots.add(i); el.classList.add('picked'); el.querySelector('.check').textContent='✓'; }
}
async function submitVote(){
  const name = document.getElementById('voterName').value.trim();
  const errEl = document.getElementById('voteErr');
  if(!name){ errEl.textContent='Enter your name.'; errEl.style.display='block'; return; }
  if(pickedSlots.size === 0){ errEl.textContent='Pick at least one time.'; errEl.style.display='block'; return; }
  const data = await loadEvent(state.eventId);
  if(!data){ errEl.textContent='Event no longer exists.'; errEl.style.display='block'; return; }
  data.responses = data.responses.filter(r=>r.name.toLowerCase() !== name.toLowerCase());
  data.responses.push({ name, slots: Array.from(pickedSlots) });
  await saveEvent(state.eventId, data);
  go('results', state.eventId);
}

async function renderResults(){
  app.innerHTML = `<div class="empty">Loading results…</div>`;
  const data = await loadEvent(state.eventId);
  if(!data){ app.innerHTML = `<div class="empty">Couldn't find that event.</div><div class="btn-row"><button class="btn secondary" onclick="go('home')">Back home</button></div>`; return; }
  const counts = data.slots.map((_,i)=> data.responses.filter(r=>r.slots.includes(i)).length );
  const maxCount = Math.max(0, ...counts);
  app.innerHTML = `
    <h2>${esc(data.title)}</h2>
    <p class="sub">${data.responses.length} ${data.responses.length===1?'person has':'people have'} responded.</p>
    <div>
      ${data.slots.map((s,i)=>{
        const cnt = counts[i];
        const isBest = maxCount>0 && cnt===maxCount;
        const pct = maxCount>0 ? Math.round((cnt/maxCount)*100) : 0;
        const namesForSlot = data.responses.filter(r=>r.slots.includes(i)).map(r=>r.name);
        return `
          <div class="results-slot ${isBest?'best':''}">
            ${isBest?'<div class="best-badge">Best time</div>':''}
            <div class="results-top">
              <span class="results-label">${esc(s)}</span>
              <span class="results-count">${cnt} ${cnt===1?'vote':'votes'}</span>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width:${cnt>0?pct:0}%;"></div></div>
            ${namesForSlot.length?`<div class="names">${namesForSlot.map(esc).join(', ')}</div>`:''}
          </div>
        `;
      }).join('')}
    </div>
    <div class="btn-row">
      <button class="btn" onclick="go('vote', '${state.eventId}')">Add / update my availability</button>
      <button class="btn secondary" onclick="go('home')">Home</button>
    </div>
    <div class="stamp" style="margin-top:10px;">Event code: ${state.eventId}</div>
  `;
}

function render(){
  if(state.view==='home') renderHome();
  else if(state.view==='create') renderCreate();
  else if(state.view==='share') renderShare();
  else if(state.view==='join') renderJoin();
  else if(state.view==='vote') renderVote();
  else if(state.view==='results') renderResults();
  else renderHome();
}

function routeFromHash(){
  const h = window.location.hash.replace('#','');
  const [view, id] = h.split('/');
  if(view && ['home','create','join','vote','results','share'].includes(view)){
    state.view = view; state.eventId = id || null;
  } else { state.view='home'; }
  render();
}
window.addEventListener('hashchange', routeFromHash);
routeFromHash();
</script>
</body>
</html>
